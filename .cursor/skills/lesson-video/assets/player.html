<!-- Video page for one episode: make_video.py page fills the __PLACEHOLDERS__ from EPISODE and chapters.json. -->
<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* One dark "screening room" look, chosen on purpose to sit around a black 3Blue1Brown-style video. */
  :root {
    color-scheme: dark;
    --ground: #0b0c0e;
    --surface: #15171b;
    --surface-hi: #1d2026;
    --line: #2a2d34;
    --ink: #ebe8e2;
    --muted: #9a9ea6;
    --accent: #58c4dd;
    --zero: #83c167;
    --eng: #f0ac5f;
    --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  }
  body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 40px; display: grid; gap: 22px; }
  header { display: grid; gap: 6px; }
  .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
  h1 { margin: 0; font-size: clamp(22px, 3.2vw, 32px); font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .lede { margin: 0; color: var(--muted); max-width: 62ch; }
  .stage { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
  .player { display: grid; gap: 10px; }
  video { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
  .now { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 28px; }
  .now b { font-weight: 500; }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px;
          font-weight: 500; border: 1px solid currentColor; white-space: nowrap; }
  .pill.zero { color: var(--zero); }
  .pill.eng { color: var(--eng); }
  aside { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px;
              border-bottom: 1px solid var(--line); }
  .controls .sum { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; user-select: none; }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
                  background: var(--ink); transition: transform .2s; }
  .toggle input:checked + .track { background: var(--eng); }
  .toggle input:checked + .track::after { transform: translateX(14px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  ol { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
  li button { width: 100%; display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; align-items: center; gap: 4px 10px;
              padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: inherit;
              text-align: left; cursor: pointer; }
  li button:hover { background: var(--surface-hi); }
  li button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  li button[aria-current="true"] { background: var(--surface-hi); }
  li button[aria-current="true"] .num { color: var(--accent); }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .t { font-size: 14px; line-height: 1.4; }
  .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  li.skipped button { opacity: .38; }
  footer { color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 14px; }
  footer p { margin: 0; max-width: 90ch; }
  @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">__KICKER__</div>
    <h1>__HEADLINE__</h1>
    <p class="lede">__LEDE__</p>
  </header>

  <section class="stage">
    <div class="player">
      <video id="video" controls playsinline preload="metadata" poster="__POSTER__"></video>
      <div class="now" id="now"></div>
    </div>
    <aside aria-label="章节">
      <div class="controls">
        <label class="toggle" for="skip">
          <input type="checkbox" id="skip">
          <span class="track" aria-hidden="true"></span>
          跳过工程师向
        </label>
        <span class="sum" id="sum"></span>
      </div>
      <ol id="list"></ol>
    </aside>
  </section>

  <footer>
    <p><span class="pill zero">零基础</span> 谁都能听懂：比方、手算、结论。 <span class="pill eng">工程师向</span> 要一点线性代数、概率和深度学习的底子。</p>
    <p>字幕已烧进画面。配音由 ElevenLabs（elevenlabs.io）合成；__SOURCE__</p>
  </footer>
</div>

<script>
  const CHAPTERS = __CHAPTERS__;
  const LEVEL = { zero: "零基础", eng: "工程师向" };
  const video = document.getElementById("video");
  const list = document.getElementById("list");
  const now = document.getElementById("now");
  const skip = document.getElementById("skip");
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  let cur = 0;
  try {
    skip.checked = localStorage.getItem("skipEng") === "1";
    cur = Math.min(CHAPTERS.length - 1, Math.max(0, parseInt(localStorage.getItem("chapter") || "0", 10) || 0));
  } catch (e) { /* storage unavailable: start at chapter 1 */ }

  const total = (lv) => CHAPTERS.filter((c) => !lv || c.level === lv).reduce((a, c) => a + c.dur, 0);
  document.getElementById("sum").textContent =
    `共 ${fmt(total())} · 零基础 ${fmt(total("zero"))} · 工程师向 ${fmt(total("eng"))}`;

  CHAPTERS.forEach((c, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="num">${i + 1}</span><span class="t"></span>
      <span class="meta"><span class="pill ${c.level}">${LEVEL[c.level]}</span><span>${fmt(c.dur)}</span></span>`;
    b.querySelector(".t").textContent = c.title;
    b.addEventListener("click", () => load(i, true));
    li.appendChild(b);
    list.appendChild(li);
  });

  function refresh() {
    [...list.children].forEach((li, i) => {
      li.classList.toggle("skipped", skip.checked && CHAPTERS[i].level === "eng");
      li.querySelector("button").setAttribute("aria-current", i === cur ? "true" : "false");
    });
    const c = CHAPTERS[cur];
    now.innerHTML = `<span class="pill ${c.level}">${LEVEL[c.level]}</span><b></b><span class="num">第 ${cur + 1} / ${CHAPTERS.length} 章</span>`;
    now.querySelector("b").textContent = c.title;
  }

  function load(i, autoplay) {
    cur = i;
    video.src = CHAPTERS[i].src;
    try { localStorage.setItem("chapter", String(i)); } catch (e) {}
    refresh();
    if (autoplay) video.play().catch(() => {});
  }

  video.addEventListener("ended", () => {
    for (let j = cur + 1; j < CHAPTERS.length; j++) {
      if (!(skip.checked && CHAPTERS[j].level === "eng")) return load(j, true);
    }
  });
  skip.addEventListener("change", () => {
    try { localStorage.setItem("skipEng", skip.checked ? "1" : "0"); } catch (e) {}
    refresh();
  });
  load(cur, false);
</script>
