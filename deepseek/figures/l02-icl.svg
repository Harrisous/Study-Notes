<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>微调与零样本、单样本、少样本的上下文学习</title>

<rect x="12" y="14" width="166" height="290" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="8"/>
<text x="95" y="38" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">微调（GPT-1 的用法）</text>
<text x="34" y="78" font-size="13" fill="var(--fig-green, #16704A)">apple → 苹果</text>
<text x="34" y="108" font-size="13" fill="var(--fig-red, #A3231C)">⤷ 梯度更新 θ</text>
<text x="34" y="138" font-size="13" fill="var(--fig-green, #16704A)">book → 书</text>
<text x="34" y="168" font-size="13" fill="var(--fig-red, #A3231C)">⤷ 梯度更新 θ</text>
<text x="34" y="198" font-size="12" fill="var(--fig-muted, #74716A)">… 更多带标签的例子 …</text>
<text x="34" y="228" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">测试：cat →</text>
<text x="95" y="262" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">用带标签的例子改权重</text>
<text x="95" y="280" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">GPT-1：batch 32，约 3 遍</text>
<rect x="190" y="14" width="166" height="290" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="8"/>
<text x="273" y="38" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">零样本 zero-shot</text>
<rect x="202" y="52" width="142" height="74" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.05" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" rx="6" stroke-dasharray="4 3"/>
<text x="340" y="66" font-size="11" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">提示</text>
<text x="212" y="78" font-size="12" fill="var(--fig-muted, #74716A)">英译中：</text>
<text x="212" y="108" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">cat →</text>
<text x="273" y="262" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">权重不变，只做前向</text>
<text x="273" y="280" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">例子放在上下文里</text>
<rect x="368" y="14" width="166" height="290" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="8"/>
<text x="451" y="38" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">单样本 one-shot</text>
<rect x="380" y="52" width="142" height="104" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.05" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" rx="6" stroke-dasharray="4 3"/>
<text x="518" y="66" font-size="11" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">提示</text>
<text x="390" y="78" font-size="12" fill="var(--fig-muted, #74716A)">英译中：</text>
<text x="390" y="108" font-size="13" fill="var(--fig-green, #16704A)">apple → 苹果</text>
<text x="390" y="138" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">cat →</text>
<text x="451" y="262" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">权重不变，只做前向</text>
<text x="451" y="280" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">例子放在上下文里</text>
<rect x="546" y="14" width="166" height="290" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="8"/>
<text x="629" y="38" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">少样本 few-shot</text>
<rect x="558" y="52" width="142" height="194" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.05" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" rx="6" stroke-dasharray="4 3"/>
<text x="696" y="66" font-size="11" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">提示</text>
<text x="568" y="78" font-size="12" fill="var(--fig-muted, #74716A)">英译中：</text>
<text x="568" y="108" font-size="13" fill="var(--fig-green, #16704A)">apple → 苹果</text>
<text x="568" y="138" font-size="13" fill="var(--fig-green, #16704A)">book → 书</text>
<text x="568" y="168" font-size="13" fill="var(--fig-green, #16704A)">water → 水</text>
<text x="568" y="198" font-size="12" fill="var(--fig-muted, #74716A)">…（K 个例子）</text>
<text x="568" y="228" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">cat →</text>
<text x="629" y="262" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">权重不变，只做前向</text>
<text x="629" y="280" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">例子放在上下文里</text>
<line x1="184" y1="14" x2="184" y2="304" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="12" y="330" font-size="12" fill="var(--fig-ink, #1C1B19)">左：GPT-1 的“预训练 + 微调”。右三栏：GPT-3 的上下文学习，模型读完整个提示，</text>
<text x="12" y="348" font-size="12" fill="var(--fig-ink, #1C1B19)">接着预测 “cat →” 后面的 token；K 一般取 10 到 100，受 2048 的上下文长度限制。</text>
</svg>
