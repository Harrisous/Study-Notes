<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>路由坍缩的自我强化回路，以及均衡损失的效果（Shazeer 等 2017 表 6）</title>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker></defs>
<rect x="20" y="52" width="150" height="46" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="8"/>
<text x="95" y="71" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">路由器对专家 A</text>
<text x="95" y="88" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">的打分略高一点</text>
<rect x="236" y="52" width="150" height="46" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="311" y="80" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">A 分到更多 token</text>
<rect x="236" y="204" width="150" height="46" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="311" y="223" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">A 得到更多梯度更新</text>
<text x="311" y="240" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">变得更“好用”</text>
<rect x="20" y="204" width="150" height="46" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="8"/>
<text x="95" y="223" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">更多 token 与 A 的</text>
<text x="95" y="240" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">亲和度变高</text>
<line x1="174" y1="75" x2="232" y2="75" stroke="var(--fig-red, #A3231C)" stroke-width="1.8" marker-end="url(#ah-red)"/>
<line x1="311" y1="102" x2="311" y2="200" stroke="var(--fig-red, #A3231C)" stroke-width="1.8" marker-end="url(#ah-red)"/>
<line x1="232" y1="227" x2="174" y2="227" stroke="var(--fig-red, #A3231C)" stroke-width="1.8" marker-end="url(#ah-red)"/>
<line x1="95" y1="200" x2="95" y2="102" stroke="var(--fig-red, #A3231C)" stroke-width="1.8" marker-end="url(#ah-red)"/>
<text x="203" y="146" font-size="14" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">自我强化</text>
<text x="203" y="164" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">（路由坍缩）</text>
<rect x="20" y="292" width="366" height="46" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="8"/>
<text x="34" y="311" font-size="12" fill="var(--fig-green, #16704A)">均衡损失：一个专家分到的 token 越多，</text>
<text x="34" y="329" font-size="12" fill="var(--fig-green, #16704A)">它的平均亲和度就被往下压得越狠（推导见正文）</text>
<line x1="95" y1="290" x2="95" y2="254" stroke="var(--fig-green, #16704A)" stroke-width="1.8" marker-end="url(#ah-green)"/>
<text x="420" y="26" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Shazeer 等 2017 表 6（MoE-256 语言模型）</text>
<text x="420" y="44" font-size="12" fill="var(--fig-muted, #74716A)">同一模型，只改均衡损失的权重</text>
<text x="420" y="76" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">最忙专家的负载 / 平均负载</text>
<rect x="428" y="86" width="229.42" height="15" fill="var(--fig-red, #A3231C)" fill-opacity="0.75"/>
<text x="663.42" y="98" font-size="12" fill="var(--fig-red, #A3231C)">17.80</text>
<rect x="428" y="108" width="14.69" height="15" fill="var(--fig-green, #16704A)" fill-opacity="0.75"/>
<text x="448.69" y="120" font-size="12" fill="var(--fig-green, #16704A)">1.14</text>
<text x="420" y="160" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">importance 的变异系数 CV</text>
<rect x="428" y="170" width="220.4" height="15" fill="var(--fig-red, #A3231C)" fill-opacity="0.75"/>
<text x="654.4" y="182" font-size="12" fill="var(--fig-red, #A3231C)">3.04</text>
<rect x="428" y="192" width="4.35" height="15" fill="var(--fig-green, #16704A)" fill-opacity="0.75"/>
<text x="438.35" y="204" font-size="12" fill="var(--fig-green, #16704A)">0.06</text>
<text x="420" y="244" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">测试困惑度（越低越好）</text>
<rect x="428" y="254" width="219.85" height="15" fill="var(--fig-red, #A3231C)" fill-opacity="0.75"/>
<text x="653.85" y="266" font-size="12" fill="var(--fig-red, #A3231C)">39.8</text>
<rect x="428" y="276" width="196.65" height="15" fill="var(--fig-green, #16704A)" fill-opacity="0.75"/>
<text x="630.65" y="288" font-size="12" fill="var(--fig-green, #16704A)">35.6</text>
<rect x="420" y="324" width="12" height="12" fill="var(--fig-red, #A3231C)" fill-opacity="0.75"/>
<text x="438" y="335" font-size="12" fill="var(--fig-ink, #1C1B19)">无均衡损失</text>
<rect x="526" y="324" width="12" height="12" fill="var(--fig-green, #16704A)" fill-opacity="0.75"/>
<text x="544" y="335" font-size="12" fill="var(--fig-ink, #1C1B19)">w<tspan baseline-shift="-2.6" font-size="11">imp</tspan> = w<tspan baseline-shift="-2.6" font-size="11">load</tspan> = 0.1</text>
<text x="420" y="354" font-size="11" fill="var(--fig-muted, #74716A)">困惑度坐标从 0 开始：39.8 → 35.6 是约 11% 的改善</text>
</svg>
