<rect x="566.97" y="290" width="13.03" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" rx="2"/>
<text x="156" y="305" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">prefill 2048（97%）</text>
<text x="586" y="305" font-size="12" fill="var(--fig-amber, #8A6508)" font-weight="600">decode 64（3%）</text>
<text x="142" y="333" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">时间</text>
<rect x="150" y="318" width="59.1" height="20" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.45" rx="2"/>
<rect x="209.1" y="318" width="370.9" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" rx="2"/>
<text x="155" y="333" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">0.29 s</text>
<text x="586" y="333" font-size="12" fill="var(--fig-amber, #8A6508)" font-weight="600">decode 1.82 s（86%）</text>
<text x="150" y="362" font-size="12" fill="var(--fig-ink, #1C1B19)">MFU：prefill 43%，decode 14%；prefill batch 1，decode batch 64</text>
<text x="16" y="414" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">高吞吐配置</text>
<text x="142" y="415" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">token 数</text>
