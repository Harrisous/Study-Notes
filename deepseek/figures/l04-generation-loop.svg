<line x1="16" y1="240" x2="704" y2="240" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="266" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">Ⓑ 时间花在哪里：PaLM 540B，64 块 TPU v4，提示 2048 token，生成 64 token</text>
<text x="16" y="304" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">低延迟配置</text>
