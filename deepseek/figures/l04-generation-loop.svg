<rect x="566.97" y="400" width="13.03" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" rx="2"/>
<text x="156" y="415" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">prefill 2048（97%）</text>
<text x="586" y="415" font-size="12" fill="var(--fig-amber, #8A6508)" font-weight="600">decode 64（3%）</text>
<text x="142" y="443" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">时间</text>
<rect x="150" y="428" width="401.71" height="20" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.45" rx="2"/>
<rect x="551.71" y="428" width="28.29" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" rx="2"/>
<text x="156" y="443" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">prefill 85.2 s（93%）</text>
<text x="586" y="443" font-size="12" fill="var(--fig-amber, #8A6508)" font-weight="600">decode 6.0 s（7%）</text>
<text x="150" y="472" font-size="12" fill="var(--fig-ink, #1C1B19)">MFU：prefill 76%，decode 33%；prefill、decode 都是 batch 512</text>
<text x="16" y="524" font-size="12" fill="var(--fig-muted, #74716A)">同一个请求里，decode 只处理约 3% 的 token；低延迟配置下却占了 86% 的时间，</text>
<text x="16" y="542" font-size="12" fill="var(--fig-muted, #74716A)">而且硬件利用率（MFU）只有 prefill 的三分之一左右。数据：Pope 等人 2023 表 2。</text>
