<text x="248" y="152" font-size="12" fill="var(--fig-muted, #74716A)">旧流 i 按 α<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">i</tspan>,<tspan font-style="italic">j</tspan></tspan> 流进新流 j</text>
<text x="248" y="186" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">第 0 列 α<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">i</tspan>,0</tspan>：读出权重，= (H<tspan baseline-shift="super" font-size="11">pre</tspan>)<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<text x="248" y="206" font-size="12" fill="var(--fig-muted, #74716A)">𝓕 的输入 = Σ<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">i</tspan></tspan> α<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">i</tspan>,0</tspan> × 流 i</text>
