<text x="20" y="370" font-size="12" fill="var(--fig-muted, #74716A)">(b) 的公式：U × C(8,2) / p²。同一阶 8 个头共用一个 mix &lt; 2⁶³，而任意 3 个表大小之积 ≥ 1.158×10¹⁹ &gt; 2⁶³，</text>
<text x="20" y="390" font-size="12" fill="var(--fig-muted, #74716A)">所以两个不同的 mix 最多只能在 2 个头上同时相撞（前提：哈希结构同开源代码）。U 为假设值，论文未给出。</text>
