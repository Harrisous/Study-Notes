<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>主线 A 的总结：每 token KV 字节，从 GPT-3 到 DeepSeek-V4.1-Flash</title>

<line x1="200" y1="48" x2="200" y2="454" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="200" y="42" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">100</text>
