<text x="308" y="42" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">4</tspan></text>
<line x1="362" y1="48" x2="362" y2="454" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="362" y="42" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">5</tspan></text>
<line x1="416" y1="48" x2="416" y2="454" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="416" y="42" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">6</tspan></text>
<line x1="470" y1="48" x2="470" y2="454" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="470" y="42" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">7</tspan></text>
<text x="202" y="22" font-size="12" fill="var(--fig-muted, #74716A)">每 token 的 KV 字节（对数刻度；按各模型的部署精度）· 是 V4.1 的几倍</text>
<text x="190" y="71" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">GPT-3 175B</text>
<text x="190" y="87" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">MHA · 96 层 × 96 头 · 按 2 字节</text>
<rect x="200" y="62" width="252.39" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="458.39" y="77" font-size="12" fill="var(--fig-ink, #1C1B19)">4,718,592 B · ×5,302</text>
<text x="596" y="77" font-size="12" fill="var(--fig-muted, #74716A)">起点</text>
<text x="190" y="115" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">Llama-3-70B</text>
<text x="190" y="131" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">GQA-8 · 80 层 · BF16</text>
<rect x="200" y="106" width="189.83" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="395.83" y="121" font-size="12" fill="var(--fig-ink, #1C1B19)">327,680 B · ×368</text>
<text x="596" y="121" font-size="12" fill="var(--fig-blue, #1F5FA8)">头数：96 → 8 组</text>
<text x="190" y="159" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek LLM 67B</text>
<text x="190" y="175" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">GQA-8 · 95 层 · BF16</text>
<rect x="200" y="150" width="193.86" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="399.86" y="165" font-size="12" fill="var(--fig-ink, #1C1B19)">389,120 B · ×437</text>
<text x="596" y="165" font-size="12" fill="var(--fig-blue, #1F5FA8)">头数</text>
<text x="190" y="203" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V2</text>
<text x="190" y="219" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">MLA · 60 层 × 576 · BF16</text>
<rect x="200" y="194" width="153.34" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<rect x="200" y="216" width="130.34" height="8" fill="var(--fig-amber, #8A6508)" fill-opacity="0.25" stroke="var(--fig-amber, #8A6508)" stroke-width="0.6"/>
<text x="335.34" y="224" font-size="11" fill="var(--fig-muted, #74716A)">部署时 6 比特：25,920</text>
<text x="359.34" y="209" font-size="12" fill="var(--fig-ink, #1C1B19)">69,120 B · ×77.7</text>
<text x="596" y="209" font-size="12" fill="var(--fig-blue, #1F5FA8)">条目大小（MLA）</text>
<text x="190" y="247" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V3</text>
<text x="190" y="263" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">MLA · 61 层 × 576 · BF16</text>
<rect x="200" y="238" width="153.73" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="359.73" y="253" font-size="12" fill="var(--fig-ink, #1C1B19)">70,272 B · ×79.0</text>
<text x="596" y="253" font-size="12" fill="var(--fig-blue, #1F5FA8)">条目大小</text>
<text x="190" y="291" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V3.2</text>
<text x="190" y="307" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">MLA + 索引键 · 61 层 · FP8+BF16</text>
<rect x="200" y="282" width="144.82" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="350.82" y="297" font-size="12" fill="var(--fig-ink, #1C1B19)">48,068 B · ×54.0</text>
<text x="596" y="297" font-size="12" fill="var(--fig-blue, #1F5FA8)">精度（FP8）</text>
<text x="190" y="335" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V4-Pro</text>
<text x="190" y="351" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">30 CSA + 31 HCA · FP8+BF16</text>
<rect x="200" y="326" width="91.89" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="297.89" y="341" font-size="12" fill="var(--fig-ink, #1C1B19)">5,031 B · ×5.65</text>
<text x="596" y="341" font-size="12" fill="var(--fig-blue, #1F5FA8)">序列维（压缩）</text>
<text x="190" y="379" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V4-Flash</text>
<text x="190" y="395" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">21 CSA + 20 HCA · FP8+BF16</text>
<rect x="200" y="370" width="83.47" height="20" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="289.47" y="385" font-size="12" fill="var(--fig-ink, #1C1B19)">3,514 B · ×3.95</text>
<text x="596" y="385" font-size="12" fill="var(--fig-blue, #1F5FA8)">序列维</text>
<text x="190" y="423" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="end" font-weight="700">DeepSeek-V4.1-Flash</text>
<text x="190" y="439" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">4 份 CSA2 · FP4</text>
<rect x="200" y="414" width="51.27" height="20" fill="var(--fig-orange, #B4460C)" fill-opacity="0.75" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<text x="257.27" y="429" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">890 B · ×1</text>
<text x="596" y="429" font-size="12" fill="var(--fig-blue, #1F5FA8)">层维 + 精度（FP4）</text>
<text x="596" y="42" font-size="12" fill="var(--fig-blue, #1F5FA8)">这一级省在哪个维度</text>
<text x="20" y="476" font-size="12" fill="var(--fig-muted, #74716A)">V4 系列与 V4.1 只计全局 KV（主 KV + 索引键），不含每请求常数的 SWA 状态；V3.2 起的数字含索引器键。</text>
<text x="20" y="496" font-size="12" fill="var(--fig-muted, #74716A)">1M token 的一个请求：GPT-3 4,608 GiB → DeepSeek 67B 380 GiB → V3 68.6 GiB → V3.2 46.9 GiB → V4-Flash 3.43 GiB → V4.1 0.87 GiB。</text>
<text x="20" y="516" font-size="12" fill="var(--fig-muted, #74716A)">GPT-3 按全部 96 层全量缓存、2 字节计，是上界（论文未写推理精度；一半层是局部带状稀疏注意力）。</text>
</svg>
