<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>InstructGPT 的三步：监督微调、训练奖励模型、用 PPO 做强化学习</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<text x="125" y="24" font-size="15" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">① 监督微调（SFT）</text>
<text x="375" y="24" font-size="15" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">② 训练奖励模型（RM）</text>
<text x="625" y="24" font-size="15" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">③ 用 PPO 做强化学习</text>
<rect x="12" y="42" width="226" height="72" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.3" rx="8"/>
<text x="125" y="63.83" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">抽一个提示 <tspan font-weight="700">q</tspan></text>
<text x="125" y="82.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">12,725 个训练提示</text>
<text x="125" y="101.53" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">标注员写 11,295 + API 1,430</text>
<line x1="125" y1="116" x2="125" y2="129" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="12" y="132" width="226" height="58" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="8" stroke-dasharray="5 3"/>
<text x="125" y="156.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">标注员写出示范回答 <tspan font-weight="700">o</tspan></text>
<text x="125" y="175.1" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">（人工，约 40 名标注员）</text>
<line x1="125" y1="192" x2="125" y2="213" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="12" y="216" width="226" height="62" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.3" rx="8"/>
<text x="125" y="242.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">有监督微调 GPT-3</text>
<text x="125" y="261.11" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">在示范上做最大似然</text>
<line x1="125" y1="280" x2="125" y2="299" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="12" y="302" width="226" height="56" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="125" y="334.68" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">SFT 模型 π<tspan baseline-shift="super" font-size="11">SFT</tspan></text>
<rect x="262" y="42" width="226" height="72" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.3" rx="8"/>
<text x="375" y="63.83" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">同一个 <tspan font-weight="700">q</tspan> 采样 K = 4…9 个回答</text>
<text x="375" y="82.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">33,207 个训练提示</text>
<text x="375" y="101.53" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">标注员写 6,623 + API 26,584</text>
<line x1="375" y1="116" x2="375" y2="129" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="262" y="132" width="226" height="58" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="8" stroke-dasharray="5 3"/>
<text x="375" y="156.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">标注员从好到差排序</text>
<text x="375" y="175.1" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">例：D &gt; C &gt; A &gt; B（人工）</text>
<line x1="375" y1="192" x2="375" y2="213" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="262" y="216" width="226" height="62" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.3" rx="8"/>
<text x="375" y="242.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">拆成 C(K,2) 对两两比较</text>
<text x="375" y="261.11" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">Bradley–Terry 损失，训 1 个 epoch</text>
<line x1="375" y1="280" x2="375" y2="299" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="262" y="302" width="226" height="56" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="8"/>
<text x="375" y="334.68" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">奖励模型 r<tspan baseline-shift="sub" font-size="11">φ</tspan>(q, o)：输出一个数</text>
<rect x="512" y="42" width="226" height="72" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.3" rx="8"/>
<text x="625" y="63.83" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">抽一个新提示 <tspan font-weight="700">q</tspan></text>
<text x="625" y="82.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">31,144 个 API 提示</text>
<text x="625" y="101.53" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">只有提示，没有人工标签</text>
<line x1="625" y1="116" x2="625" y2="129" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="512" y="132" width="226" height="58" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="625" y="165.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan> 生成回答 <tspan font-weight="700">o</tspan></text>
<line x1="625" y1="192" x2="625" y2="213" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="512" y="216" width="226" height="62" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="8"/>
<text x="625" y="242.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">奖励 = r<tspan baseline-shift="sub" font-size="11">φ</tspan>(q,o) − β·log(π<tspan baseline-shift="sub" font-size="11">θ</tspan>/π<tspan baseline-shift="sub" font-size="11">ref</tspan>)</text>
<text x="625" y="261.11" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">β = 0.02</text>
<line x1="625" y1="280" x2="625" y2="299" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="512" y="302" width="226" height="56" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="625" y="325.25" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">PPO 更新 π<tspan baseline-shift="sub" font-size="11">θ</tspan></text>
<text x="625" y="344.11" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">PPO-ptx：另混预训练梯度</text>
<path d="M738 330 h10 V161 h-7" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.5" marker-end="url(#ah-blue)"/>
<path d="M488 330 h12 V247 h9" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="1.6" marker-end="url(#ah-green)"/>
<path d="M125 360 V384 H625 V363" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<text x="375" y="404" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">初始化策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan>，并冻结一份作参考 π<tspan baseline-shift="sub" font-size="11">ref</tspan></text>
<path d="M542 42 C 502 20, 498 20, 458 40" fill="none" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-muted)"/>
<rect x="14" y="426" width="22" height="12" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="3" stroke-dasharray="5 3"/>
<text x="42" y="436" font-size="12" fill="var(--fig-muted, #74716A)">虚线框：人工完成的步骤。上方虚线弧：第 2、3 步可以反复迭代（用新策略的回答再收集比较）。</text>
<text x="14" y="458" font-size="12" fill="var(--fig-muted, #74716A)">数字为 InstructGPT 训练集规模（按提示计，arXiv v1 表 6）；β、PPO-ptx 见附录 C.4。</text>
</svg>
