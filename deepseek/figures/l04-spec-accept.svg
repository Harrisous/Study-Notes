<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>投机采样的接受规则：接受 min(p, q)，拒绝的质量由残差 (p − q)+ 补上</title>

<text x="16" y="24" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">Ⓐ 每个候选词：绿色 = 接受的质量 min(p, q)，红色 = 被拒的草稿质量，虚线 = 补采的质量</text>
<line x1="54" y1="300" x2="350" y2="300" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="50" y="304" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0.0</text>
<line x1="54" y1="258" x2="350" y2="258" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="50" y="262" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0.1</text>
<line x1="54" y1="216" x2="350" y2="216" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="50" y="220" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0.2</text>
<line x1="54" y1="174" x2="350" y2="174" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="50" y="178" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0.3</text>
<line x1="54" y1="132" x2="350" y2="132" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="50" y="136" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0.4</text>
<line x1="54" y1="90" x2="350" y2="90" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="50" y="94" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0.5</text>
<rect x="60" y="216" width="64" height="84" fill="var(--fig-green, #16704A)" fill-opacity="0.55"/>
<rect x="60" y="90" width="64" height="126" fill="var(--fig-green, #16704A)" fill-opacity="0.08" stroke="var(--fig-green, #16704A)" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="92" y="157" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">+0.3</text>
<line x1="56" y1="90" x2="128" y2="90" stroke="var(--fig-green, #16704A)" stroke-width="2.4"/>
<line x1="56" y1="216" x2="128" y2="216" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="92" y="262" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.2</text>
<text x="92" y="320" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">山</text>
<text x="92" y="340" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">p = 0.5，q = 0.2</text>
<text x="92" y="358" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">接受概率 1</text>
<rect x="170" y="174" width="64" height="126" fill="var(--fig-green, #16704A)" fill-opacity="0.55"/>
<rect x="170" y="90" width="64" height="84" fill="var(--fig-red, #A3231C)" fill-opacity="0.35"/>
<text x="202" y="136" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">−0.2</text>
<line x1="166" y1="174" x2="238" y2="174" stroke="var(--fig-green, #16704A)" stroke-width="2.4"/>
<line x1="166" y1="90" x2="238" y2="90" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="202" y="241" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.3</text>
<text x="202" y="320" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">海</text>
<text x="202" y="340" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">p = 0.3，q = 0.5</text>
<text x="202" y="358" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">接受概率 0.600</text>
<rect x="280" y="216" width="64" height="84" fill="var(--fig-green, #16704A)" fill-opacity="0.55"/>
<rect x="280" y="174" width="64" height="42" fill="var(--fig-red, #A3231C)" fill-opacity="0.35"/>
<text x="312" y="199" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">−0.1</text>
<line x1="276" y1="216" x2="348" y2="216" stroke="var(--fig-green, #16704A)" stroke-width="2.4"/>
<line x1="276" y1="174" x2="348" y2="174" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="312" y="262" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.2</text>
<text x="312" y="320" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">河</text>
<text x="312" y="340" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">p = 0.2，q = 0.3</text>
<text x="312" y="358" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">接受概率 0.667</text>
<line x1="54" y1="300" x2="350" y2="300" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<line x1="60" y1="386" x2="86" y2="386" stroke="var(--fig-green, #16704A)" stroke-width="2.4"/>
<text x="92" y="390" font-size="12" fill="var(--fig-ink, #1C1B19)">目标分布 p（大模型）</text>
<line x1="240" y1="386" x2="266" y2="386" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="272" y="390" font-size="12" fill="var(--fig-ink, #1C1B19)">草稿分布 q（小模型）</text>
<text x="400" y="78" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">Ⓑ 记账</text>
<text x="400" y="108" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">接受率 β = Σ min(p, q) = 0.2 + 0.3 + 0.2 = 0.7</text>
<text x="400" y="132" font-size="12" fill="var(--fig-ink, #1C1B19)">全变差 TV(p, q) = ½ Σ |p − q| = 0.3 = 1 − β</text>
<text x="400" y="156" font-size="12" fill="var(--fig-red, #A3231C)">被拒的草稿质量 Σ(q − p)<tspan baseline-shift="sub" font-size="11">+</tspan> = 0.2 + 0.1 = 0.3</text>
<text x="400" y="180" font-size="12" fill="var(--fig-green, #16704A)">残差 (p − q)<tspan baseline-shift="sub" font-size="11">+</tspan> = [0.3, 0, 0] → 归一化 [1, 0, 0]</text>
<text x="400" y="204" font-size="12" fill="var(--fig-ink, #1C1B19)">输出 = min(p, q) + (1 − β) · 残差</text>
<text x="400" y="228" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">     = [0.2 + 0.3·1, 0.3 + 0, 0.2 + 0] = [0.5, 0.3, 0.2] = p</text>
<text x="400" y="268" font-size="12" fill="var(--fig-muted, #74716A)">模拟 200,000 次（numpy，种子 0）：</text>
<text x="400" y="292" font-size="12" fill="var(--fig-muted, #74716A)">输出频率 [0.501, 0.300, 0.198]，接受率 0.699</text>
<text x="400" y="324" font-size="12" fill="var(--fig-ink, #1C1B19)">被拒的红色质量（0.3）恰好由绿色虚线</text>
<text x="400" y="348" font-size="12" fill="var(--fig-ink, #1C1B19)">（0.3）补回：两块面积相等，因为</text>
<text x="400" y="372" font-size="12" fill="var(--fig-ink, #1C1B19)">p 与 q 的总和都是 1。</text>
</svg>
