<text x="10" y="514" font-size="12" fill="var(--fig-muted, #74716A)">(a) HC 与 mHC 两行是 27B 模型的反向复合增益，取自对论文图的数字化读数（第 16 课 §3、§7）；其余由公式计算。</text>
<text x="10" y="532" font-size="12" fill="var(--fig-muted, #74716A)">(b) 前三行不含子层自己的 pre-norm，V4 与 V4.1 两行含；mHC 的 18d 是第 16 课的推算（§7 总表）。</text>
