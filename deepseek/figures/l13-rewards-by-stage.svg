<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>R1-Zero 与 R1 两个 RL 阶段分别用了哪些奖励</title>

<text x="268" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">R1-Zero 的 RL</text>
<text x="268" y="43" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">从 V3-Base 直接开始</text>
<text x="456" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">R1 第一阶段 RL</text>
<text x="456" y="43" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">推理导向，得到 Dev2</text>
<text x="644" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">R1 第二阶段 RL</text>
<text x="644" y="43" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">全场景，得到 R1</text>
<line x1="16" y1="54" x2="744" y2="54" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<rect x="16" y="64" width="728" height="78" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.35" rx="8"/>
