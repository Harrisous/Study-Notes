<rect x="552" y="74" width="84" height="24" fill="var(--fig-green, #16704A)" fill-opacity="0.14" stroke="var(--fig-green, #16704A)" stroke-width="1.2" rx="12"/>
<text x="594" y="90.5" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">规则奖励</text>
<text x="642" y="90.5" font-size="14" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="700">+</text>
<rect x="650" y="74" width="82" height="24" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" rx="12"/>
<text x="691" y="90.5" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">语言一致性</text>
<text x="644" y="124" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">直接相加</text>
<rect x="176" y="158" width="184" height="152" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="8" stroke-dasharray="4 4"/>
<text x="268" y="230" font-size="12.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">不训练一般题</text>
<text x="268" y="248" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">（只有可自动核对的题）</text>
<rect x="364" y="158" width="184" height="152" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="8" stroke-dasharray="4 4"/>
<text x="456" y="222" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">论文只说：语言一致性</text>
<text x="456" y="240" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">奖励也加在非推理数据上，</text>
<text x="456" y="258" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">其余未详述</text>
<rect x="552" y="158" width="184" height="24" fill="var(--fig-amber, #8A6508)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="12"/>
<text x="644" y="174.5" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">有用性 RM：只看最终总结</text>
<text x="644" y="201" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+ 格式 + 语言一致性</text>
<text x="644" y="219" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">成对训练，66,000 对偏好</text>
<rect x="552" y="246" width="184" height="24" fill="var(--fig-red, #A3231C)" fill-opacity="0.14" stroke="var(--fig-red, #A3231C)" stroke-width="1.2" rx="12"/>
<text x="644" y="262.5" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">安全 RM：看推理与总结全文</text>
<text x="644" y="289" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+ 格式 + 语言一致性</text>
<text x="644" y="307" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">逐点训练，106,000 条</text>
<text x="268" y="350" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">温度 T = 1，G = 16</text>
<text x="268" y="369" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">10,400 步</text>
<text x="268" y="388" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">ε 未公开</text>
<text x="456" y="350" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">温度 T = 1，G = 16</text>
<text x="456" y="369" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">步数未公开（训到推理收敛）</text>
<text x="456" y="388" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">ε = 10</text>
<text x="644" y="350" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">温度 T = 0.7</text>
<text x="644" y="369" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1,700 步；偏好奖励只在</text>
<text x="644" y="388" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">最后 400 步加入</text>
<text x="16" y="430" font-size="12" fill="var(--fig-muted, #74716A)">共同设置：lr 3×10<tspan baseline-shift="4.32" font-size="11">-6</tspan>，KL 系数 0.001，每步 32 题 × 16 个回答，每 400 步重置参考模型（第二阶段“沿用第一阶段的大部分参数”）</text>
</svg>
