<rect x="364" y="74" width="84" height="24" fill="var(--fig-green, #16704A)" fill-opacity="0.14" stroke="var(--fig-green, #16704A)" stroke-width="1.2" rx="12"/>
<text x="406" y="90.5" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">规则奖励</text>
