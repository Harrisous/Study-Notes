<text x="26" y="187" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一般题：有用性</text>
<text x="26" y="205" font-size="12" fill="var(--fig-muted, #74716A)">66K 条 RL 提示</text>
<rect x="16" y="238" width="728" height="80" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.35" rx="8"/>
<text x="26" y="275" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一般题：无害性</text>
