<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>DSA 让每 token 缓存变大 20%，却让每步解码的读取量降到约 1/4.6</title>

<text x="20" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">(a) 每 token 每层存多少字节</text>
<text x="140" y="80" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">MLA，BF16</text>
<rect x="150" y="64" width="182.4" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" stroke="var(--fig-amber, #8A6508)" stroke-width="0.8"/>
<text x="241.2" y="82" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1152</text>
<text x="338.4" y="82" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">1152 B</text>
<text x="140" y="142" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">MLA，FP8 格式</text>
<rect x="150" y="126" width="81.07" height="26" fill="var(--fig-orange, #B4460C)" fill-opacity="0.55" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<text x="190.53" y="144" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">512 FP8</text>
<rect x="231.07" y="126" width="2.53" height="26" fill="var(--fig-muted, #74716A)" fill-opacity="0.55" stroke="var(--fig-muted, #74716A)" stroke-width="0.8"/>
<rect x="233.6" y="126" width="20.27" height="26" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" stroke="var(--fig-red, #A3231C)" stroke-width="0.8"/>
<text x="259.87" y="144" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">656 B</text>
<text x="140" y="204" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DSA = FP8 + 索引键</text>
<rect x="150" y="188" width="81.07" height="26" fill="var(--fig-orange, #B4460C)" fill-opacity="0.55" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="231.07" y="188" width="2.53" height="26" fill="var(--fig-muted, #74716A)" fill-opacity="0.55" stroke="var(--fig-muted, #74716A)" stroke-width="0.8"/>
<rect x="233.6" y="188" width="20.27" height="26" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" stroke="var(--fig-red, #A3231C)" stroke-width="0.8"/>
<rect x="253.87" y="188" width="20.9" height="26" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="280.77" y="206" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">788 B</text>
<text x="20" y="252" font-size="11" fill="var(--fig-muted, #74716A)">FP8 格式：512 个 FP8（内容）+ 4 个 FP32 缩放</text>
<text x="20" y="268" font-size="11" fill="var(--fig-muted, #74716A)">+ 64 个 BF16（RoPE 部分，不量化）= 656 B</text>
<text x="20" y="292" font-size="12" fill="var(--fig-violet, #6733C4)">DSA 比不带索引键多存 132 B，即 +20.1%；</text>
<text x="20" y="310" font-size="12" fill="var(--fig-violet, #6733C4)">任何历史 token 都可能被选中，一个都不能丢。</text>
<text x="400" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">(b) 位置 T 解码一步，每层读多少字节</text>
<line x1="450" y1="330" x2="740" y2="330" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="442" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0 MB</text>
<line x1="450" y1="261.5" x2="740" y2="261.5" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="442" y="265.5" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">40 MB</text>
<line x1="450" y1="193" x2="740" y2="193" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="442" y="197" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">80 MB</text>
<line x1="450" y1="124.5" x2="740" y2="124.5" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="442" y="128.5" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">120 MB</text>
<line x1="450" y1="56" x2="740" y2="56" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="442" y="60" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">160 MB</text>
<text x="450" y="348" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0K</text>
<text x="522.5" y="348" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">32K</text>
<text x="595" y="348" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">64K</text>
<text x="667.5" y="348" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">96K</text>
<text x="740" y="348" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">128K</text>
<line x1="450" y1="330" x2="740" y2="330" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<line x1="450" y1="56" x2="450" y2="330" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<line x1="450" y1="330" x2="740" y2="71.42" stroke="var(--fig-amber, #8A6508)" stroke-width="2.2" stroke-dasharray="6 4"/>
<line x1="450" y1="330" x2="740" y2="182.75" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4"/>
<path d="M450.0 330.0 L454.5 327.2 L740.0 298.1" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="3"/>
<text x="736" y="63.42" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="end" font-weight="700">稠密 BF16：151.0</text>
<text x="736" y="174.75" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="end" font-weight="700">稠密 FP8：86.0</text>
<text x="736" y="288.07" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="end" font-weight="700">DSA：18.6</text>
<text x="458" y="68" font-size="12" fill="var(--fig-ink, #1C1B19)">128K 处：FP8 读取降到 1/4.6，</text>
<text x="458" y="86" font-size="12" fill="var(--fig-ink, #1C1B19)">相对 BF16 稠密核降到 1/8.1</text>
<text x="595" y="368" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">位置 T</text>
<text x="20" y="394" font-size="12" fill="var(--fig-muted, #74716A)">DSA 的读取 = 2048 × 656（被选条目）+ T × 132（全部索引键）。T &lt; 2564 时，DSA 读得比稠密 FP8 还多。</text>
<text x="20" y="414" font-size="11" fill="var(--fig-muted, #74716A)">字节格式来自 FlashMLA README 与推理代码；读取量是按格式计算的模型，不是实测。</text>
</svg>
