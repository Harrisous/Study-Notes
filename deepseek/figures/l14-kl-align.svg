<text x="470" y="354" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">KL(p<tspan baseline-shift="sub" font-size="11">S</tspan> ‖ softmax(I<tspan baseline-shift="sub" font-size="11">S</tspan>)) = 0.0557</text>
<text x="470" y="374" font-size="12" fill="var(--fig-muted, #74716A)">主注意力每个头只在 S<tspan baseline-shift="sub" font-size="11">t</tspan> 内做 softmax，</text>
<text x="470" y="392" font-size="12" fill="var(--fig-muted, #74716A)">再取两头平均（笔者的理解，论文未写明）；</text>
<text x="470" y="410" font-size="12" fill="var(--fig-muted, #74716A)">S<tspan baseline-shift="sub" font-size="11">t</tspan> 外的 token 没有梯度。</text>
<rect x="20" y="428" width="720" height="30" fill="var(--fig-red, #A3231C)" fill-opacity="0.05" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="6" stroke-dasharray="5 3"/>
<text x="32" y="448" font-size="12" fill="var(--fig-red, #A3231C)">⊘ 梯度分离：indexer 的输入从计算图上 detach。indexer 只从这个 KL 损失学习，主模型只从语言模型损失学习。</text>
