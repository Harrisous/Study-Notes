<rect x="258" y="30" width="12" height="12" fill="var(--fig-muted, #74716A)" fill-opacity="0.45"/>
<text x="276" y="40" font-size="12" fill="var(--fig-ink, #1C1B19)">头 2 注意力</text>
<rect x="68" y="48" width="12" height="12" fill="var(--fig-green, #16704A)" fill-opacity="0.7"/>
<text x="86" y="58" font-size="12" fill="var(--fig-ink, #1C1B19)">目标 p（两头平均）</text>
<rect x="258" y="48" width="12" height="12" fill="var(--fig-violet, #6733C4)" fill-opacity="0.7"/>
<text x="276" y="58" font-size="12" fill="var(--fig-ink, #1C1B19)">softmax(I)（indexer）</text>
<text x="60" y="354" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">KL(p ‖ softmax(I)) = 0.0576</text>
<text x="60" y="374" font-size="12" fill="var(--fig-muted, #74716A)">梯度 = softmax(I) − p：s = 2 被 indexer 高估（+0.160），</text>
<text x="60" y="392" font-size="12" fill="var(--fig-muted, #74716A)">梯度下降会压低 s = 2 的分数、抬高其余三个。</text>
<text x="470" y="24" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">(b) 稀疏训练：只在 S<tspan baseline-shift="sub" font-size="11">t</tspan> = {2, 3} 上</text>
