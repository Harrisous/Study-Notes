<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>稠密模型的参数分布，以及稠密与 MoE 模型的总参数和激活参数</title>

<text x="24" y="26" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">(a) DeepSeek LLM 7B 的参数都在哪里（共 6.91B，B = 10<tspan baseline-shift="5.6" font-size="11">9</tspan>）</text>
<rect x="24" y="44" width="195.78" height="38" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.28" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1.5"/>
<text x="121.89" y="61" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">注意力</text>
<text x="121.89" y="76" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">2.01B · 29.1%</text>
<rect x="219.78" y="44" width="394.62" height="38" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.78" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1.5"/>
<text x="417.09" y="61" font-size="13" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">FFN</text>
<text x="417.09" y="76" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle">4.06B · 58.7%</text>
<rect x="614.4" y="44" width="40.79" height="38" fill="var(--fig-muted, #74716A)" fill-opacity="0.3" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1.5"/>
<text x="634.79" y="68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">6.1%</text>
<rect x="655.19" y="44" width="40.79" height="38" fill="var(--fig-muted, #74716A)" fill-opacity="0.18" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1.5"/>
<text x="675.58" y="68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">6.1%</text>
<line x1="616.4" y1="86" x2="694" y2="86" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="696" y="102" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">输入嵌入、输出头 各 0.42B（不共享权重）</text>
<text x="24" y="138" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">每一层内部（按比例）：</text>
<rect x="150" y="152" width="470" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.78"/>
<text x="140" y="168" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end">FFN</text>
<text x="158" y="168" font-size="12" fill="var(--fig-surface, #FFFFFF)">3·d·d<tspan baseline-shift="-2.6" font-size="11">ff</tspan> = 3×4096×11008</text>
<text x="628" y="168" font-size="12" fill="var(--fig-ink, #1C1B19)">135.3M</text>
<rect x="150" y="186" width="233.18" height="22" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.28"/>
<text x="140" y="202" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end">注意力</text>
<text x="158" y="202" font-size="12" fill="var(--fig-ink, #1C1B19)">4·d<tspan baseline-shift="4.8" font-size="11">2</tspan> = 4×4096<tspan baseline-shift="4.8" font-size="11">2</tspan></text>
<text x="391.18" y="202" font-size="12" fill="var(--fig-ink, #1C1B19)">67.1M</text>
<text x="150" y="234" font-size="12" fill="var(--fig-muted, #74716A)">FFN : 注意力 = 3·d<tspan baseline-shift="-2.6" font-size="11">ff</tspan> : 4d = 2.02，FFN 占每层参数的 66.8%</text>
<text x="24" y="290" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">(b) 总参数（浅色长条）与每个 token 激活的参数（深色）</text>
<line x1="172" y1="304" x2="172" y2="460" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="172" y="474" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0B</text>
<line x1="257.6" y1="304" x2="257.6" y2="460" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="257.6" y="474" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10B</text>
<line x1="343.2" y1="304" x2="343.2" y2="460" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="343.2" y="474" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">20B</text>
<line x1="428.8" y1="304" x2="428.8" y2="460" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="428.8" y="474" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">30B</text>
<line x1="514.4" y1="304" x2="514.4" y2="460" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="514.4" y="474" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">40B</text>
<line x1="600" y1="304" x2="600" y2="460" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="600" y="474" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">50B</text>
<text x="162" y="324" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek LLM 7B</text>
<rect x="172" y="311" width="59.15" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="239.15" y="324" font-size="12" fill="var(--fig-muted, #74716A)">6.9B（稠密：全部激活）</text>
<text x="162" y="354" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">LLaMA2 7B</text>
<rect x="172" y="341" width="57.68" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="237.68" y="354" font-size="12" fill="var(--fig-muted, #74716A)">6.7B（稠密：全部激活）</text>
<text x="162" y="384" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">Mixtral 8x7B</text>
<rect x="172" y="371" width="399.78" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<rect x="172" y="371" width="110.25" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="579.78" y="384" font-size="12" fill="var(--fig-ink, #1C1B19)">46.7B / 12.9B = 28%</text>
<text x="162" y="414" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeekMoE 16B</text>
<rect x="172" y="401" width="140.18" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<rect x="172" y="401" width="24.21" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="320.18" y="414" font-size="12" fill="var(--fig-ink, #1C1B19)">16.4B / 2.8B = 17%</text>
<text x="162" y="444" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V2-Lite</text>
<rect x="172" y="431" width="134.39" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<rect x="172" y="431" width="20.54" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="314.39" y="444" font-size="12" fill="var(--fig-ink, #1C1B19)">15.7B / 2.4B = 15%</text>
<text x="172" y="494" font-size="12" fill="var(--fig-muted, #74716A)">MoE 的每 token 计算量跟着“激活参数”走，知识容量跟着“总参数”走：两者被拆开了。</text>
</svg>
