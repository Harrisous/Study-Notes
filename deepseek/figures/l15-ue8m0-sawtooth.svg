<text x="332" y="50" font-size="13" fill="var(--fig-ink, #1C1B19)">→  2<tspan baseline-shift="super" font-size="11">120−127</tspan> = 2<tspan baseline-shift="super" font-size="11">−7</tspan> = 0.0078125</text>
<text x="332" y="70" font-size="12" fill="var(--fig-muted, #74716A)">E = 0…254 表示 2<tspan baseline-shift="super" font-size="11">−127</tspan>…2<tspan baseline-shift="super" font-size="11">127</tspan>；E = 255 保留给 NaN。</text>
<text x="332" y="88" font-size="12" fill="var(--fig-muted, #74716A)">没有 0，也没有负数：缩放因子本来就是正数。</text>
