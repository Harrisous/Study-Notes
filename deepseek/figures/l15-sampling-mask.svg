<text x="28" y="374" font-size="12" fill="var(--fig-ink, #1C1B19)">③ 分子用同一掩码、在核内重新归一化的 π<tspan baseline-shift="sub" font-size="11">θ</tspan>(c)：(0.12 / 0.90) / 0.1579 = 0.844</text>
<text x="560" y="352" font-size="12" fill="var(--fig-red, #A3231C)">π<tspan baseline-shift="sub" font-size="11">θ</tspan> 落在旧核之外的概率：0.10</text>
