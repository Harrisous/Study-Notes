<text x="28" y="330" font-size="12" fill="var(--fig-ink, #1C1B19)">token c 的重要性比，分母是截断后的 π<tspan baseline-shift="sub" font-size="11">old</tspan>(c) = 0.15 / 0.95 = 0.1579：</text>
