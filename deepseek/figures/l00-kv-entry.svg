<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>一个 KV 条目里的字节</title>

<line x1="20" y1="36" x2="20" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="20" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">0 B</text>
<line x1="123.33" y1="36" x2="123.33" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="123.33" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">200 B</text>
<line x1="226.67" y1="36" x2="226.67" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="226.67" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">400 B</text>
<line x1="330" y1="36" x2="330" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="330" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">600 B</text>
<line x1="433.33" y1="36" x2="433.33" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="433.33" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">800 B</text>
<line x1="536.67" y1="36" x2="536.67" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="536.67" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1000 B</text>
<line x1="640" y1="36" x2="640" y2="358" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="640" y="372" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1200 B</text>
<text x="20" y="44" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">V2 / V3：MLA 条目（BF16）</text>
<rect x="20" y="52" width="529.07" height="28" fill="var(--fig-orange, #B4460C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="284.53" y="70.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">潜向量 512 维 × BF16</text>
<rect x="549.07" y="52" width="66.13" height="28" fill="var(--fig-red, #A3231C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="582.13" y="70.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">RoPE</text>
<text x="623.2" y="70.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">1,152 B</text>
<text x="754" y="70.5" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="end" font-weight="700">16 位/维</text>
<text x="20" y="97" font-size="12" fill="var(--fig-muted, #74716A)">每层 1 条、每条对应 1 个 token；576 维全用 BF16</text>
<text x="20" y="124" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">V3.2：MLA 条目（FP8）+ indexer 键</text>
<rect x="20" y="132" width="264.53" height="28" fill="var(--fig-orange, #B4460C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="152.27" y="150.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">潜向量 512 维 × FP8</text>
<rect x="284.53" y="132" width="8.27" height="28" fill="var(--fig-muted, #74716A)" fill-opacity="0.6" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="292.8" y="132" width="66.13" height="28" fill="var(--fig-red, #A3231C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="325.87" y="150.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">RoPE</text>
<rect x="358.93" y="132" width="68.2" height="28" fill="var(--fig-violet, #6733C4)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="393.03" y="150.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">索引键</text>
<text x="435.13" y="150.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">656 + 132 = 788 B</text>
<text x="754" y="150.5" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="end" font-weight="700">9.1 位/维</text>
<text x="20" y="177" font-size="12" fill="var(--fig-muted, #74716A)">缩放 4 个 FP32 = 16 B；RoPE 64 维仍用 BF16；索引键 128 维 FP8 + 4 B 缩放</text>
<text x="20" y="204" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">V4：CSA/HCA 压缩条目 + indexer 键</text>
<rect x="20" y="212" width="231.47" height="28" fill="var(--fig-orange, #B4460C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="135.73" y="230.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">448 维 × FP8</text>
<rect x="251.47" y="212" width="66.13" height="28" fill="var(--fig-red, #A3231C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="284.53" y="230.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">RoPE</text>
<rect x="317.6" y="212" width="4.13" height="28" fill="var(--fig-muted, #74716A)" fill-opacity="0.6" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="321.73" y="212" width="35.13" height="28" fill="var(--fig-violet, #6733C4)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="364.87" y="230.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">584 + 68 = 652 B</text>
<text x="754" y="230.5" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="end" font-weight="700">9.1 位/维</text>
<text x="20" y="257" font-size="12" fill="var(--fig-muted, #74716A)">CSA 一条管 4 个 token、HCA 一条管 128 个；缩放 8 B；索引键 FP4，只在 CSA 层</text>
<text x="20" y="284" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">V4.1：CSA2 条目（FP4）+ indexer 键</text>
<rect x="20" y="292" width="132.27" height="28" fill="var(--fig-orange, #B4460C)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="86.13" y="310.5" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="600">512 维 × FP4</text>
<rect x="152.27" y="292" width="16.53" height="28" fill="var(--fig-muted, #74716A)" fill-opacity="0.6" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="168.8" y="292" width="35.13" height="28" fill="var(--fig-violet, #6733C4)" fill-opacity="0.85" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="211.93" y="310.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">288 + 68 = 356 B</text>
<text x="754" y="310.5" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="end" font-weight="700">4.5 位/维</text>
<text x="20" y="337" font-size="12" fill="var(--fig-muted, #74716A)">40 层里只有 4 层存，一条管 2 或 1 个 token；每 16 维一个 E4M3 缩放 = 32 B</text>
<rect x="20" y="413" width="14" height="14" fill="var(--fig-orange, #B4460C)" fill-opacity="0.85" rx="2"/>
<text x="40" y="425" font-size="12" fill="var(--fig-ink, #1C1B19)">内容维（低精度数据）</text>
<rect x="174" y="413" width="14" height="14" fill="var(--fig-red, #A3231C)" fill-opacity="0.85" rx="2"/>
<text x="194" y="425" font-size="12" fill="var(--fig-ink, #1C1B19)">RoPE 维（BF16）</text>
<rect x="307.12" y="413" width="14" height="14" fill="var(--fig-muted, #74716A)" fill-opacity="0.6" rx="2"/>
<text x="327.12" y="425" font-size="12" fill="var(--fig-ink, #1C1B19)">缩放因子</text>
<rect x="389.12" y="413" width="14" height="14" fill="var(--fig-violet, #6733C4)" fill-opacity="0.85" rx="2"/>
<text x="409.12" y="425" font-size="12" fill="var(--fig-ink, #1C1B19)">indexer 键（索引键）</text>
<text x="754" y="425" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="end">“位/维”只算主 KV</text>
</svg>
