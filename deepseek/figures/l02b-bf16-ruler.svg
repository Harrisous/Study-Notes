<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>刻度有多粗：三位计算器与 BF16 上被舍掉的一步</title>
<defs><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker></defs>
<text x="16" y="26" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(a) 黑板上的三位有效数字计算器：刻度间隔 0.01</text>
<line x1="60" y1="96" x2="660" y2="96" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4"/>
<line x1="142.5" y1="85" x2="142.5" y2="107" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="142.5" y="124" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">0.99</text>
<line x1="287.5" y1="85" x2="287.5" y2="107" stroke="var(--fig-orange, #B4460C)" stroke-width="2.6"/>
<text x="287.5" y="124" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="600">1.00</text>
<line x1="432.5" y1="85" x2="432.5" y2="107" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="432.5" y="124" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">1.01</text>
<line x1="577.5" y1="85" x2="577.5" y2="107" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="577.5" y="124" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">1.02</text>
<line x1="360" y1="66" x2="360" y2="104" stroke="var(--fig-muted, #74716A)" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="365" y="74" font-size="12" fill="var(--fig-muted, #74716A)">中点 1.005</text>
<line x1="287.5" y1="78" x2="302" y2="78" stroke="var(--fig-red, #A3231C)" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="279.5" y="80" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="end" font-weight="600">+0.001</text>
<path d="M302.0 84.0 Q 294.7 98.0 291.5 91.0" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#ah-red)"/>
<text x="287.5" y="142" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1.001 不到中点 → 仍显示 1.00</text>
<text x="16" y="176" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(b) BF16 在 0.02 附近：刻度间隔 2<tspan baseline-shift="super" font-size="11">-13</tspan> ≈ 1.22×10<tspan baseline-shift="super" font-size="11">-4</tspan></text>
<line x1="60" y1="236" x2="660" y2="236" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4"/>
<line x1="128" y1="225" x2="128" y2="247" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="128" y="264" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">0.0197754</text>
<line x1="244" y1="225" x2="244" y2="247" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="244" y="264" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">0.0198975</text>
<line x1="360" y1="225" x2="360" y2="247" stroke="var(--fig-orange, #B4460C)" stroke-width="2.6"/>
<text x="360" y="264" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="600">0.0200195</text>
<line x1="476" y1="225" x2="476" y2="247" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="476" y="264" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">0.0201416</text>
<line x1="592" y1="225" x2="592" y2="247" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6"/>
<text x="592" y="264" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">0.0202637</text>
<line x1="418" y1="206" x2="418" y2="244" stroke="var(--fig-muted, #74716A)" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="423" y="214" font-size="12" fill="var(--fig-muted, #74716A)">中点（0.5 格）</text>
<line x1="360" y1="218" x2="417.02" y2="218" stroke="var(--fig-red, #A3231C)" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="352" y="220" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="end" font-weight="600">+6×10<tspan baseline-shift="super" font-size="11">-5</tspan>（0.49 格）</text>
<path d="M417.0 224.0 Q 388.5 238.0 364.0 231.0" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#ah-red)"/>
<text x="360" y="282" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">舍入后仍是 0.0200195，一点没动</text>
<text x="16" y="306" font-size="12" fill="var(--fig-blue, #1F5FA8)">FP32 在同一段的间隔是 2<tspan baseline-shift="super" font-size="11">-29</tspan>，细 65,536 倍：这一步在 FP32 里跨过约 3.2 万 格，记得下来。</text>
</svg>
