<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>RoPE 为什么挡住矩阵吸收，以及解耦 RoPE</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker></defs>
<text x="20" y="30" font-size="13.5" fill="var(--fig-green, #16704A)" font-weight="700">① 没有 RoPE：吸收成立</text>
<rect x="20" y="46" width="92" height="34" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="66" y="67.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">t</tspan>（128）</text>
<line x1="112" y1="63" x2="150" y2="63" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="152" y="42" width="150" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.06" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="227" y="59.06" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">乘 W<tspan baseline-shift="super" font-size="11">UK</tspan> 的转置</text>
<text x="227" y="75.94" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">固定矩阵，可预先并进 W<tspan baseline-shift="super" font-size="11">Q</tspan></text>
<line x1="302" y1="63" x2="340" y2="63" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="342" y="46" width="96" height="34" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="390" y="67.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">q̃<tspan baseline-shift="sub" font-size="11">t</tspan>（512）</text>
<line x1="438" y1="63" x2="470" y2="63" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="474" y="50" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="496" y="67" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">0</tspan></text>
<rect x="524" y="50" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="546" y="67" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>
<rect x="574" y="50" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="596" y="67" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">2</tspan></text>
<rect x="624" y="50" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="646" y="67" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">3</tspan></text>
<rect x="674" y="50" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="696" y="67" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">…</text>
<text x="474" y="92" font-size="11.5" fill="var(--fig-muted, #74716A)">缓存：每个 token 一个 <tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan>（512 维）</text>
<text x="20" y="116" font-size="12" fill="var(--fig-green, #16704A)">一个 q̃<tspan baseline-shift="sub" font-size="11">t</tspan> 对缓存里所有位置通用：打分 = q̃<tspan baseline-shift="sub" font-size="11">t</tspan>·<tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan></text>
<text x="20" y="150" font-size="13.5" fill="var(--fig-red, #A3231C)" font-weight="700">② 键上加了 RoPE：中间夹着随位置变化的旋转，吸收失败</text>
<rect x="20" y="190" width="92" height="34" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="66" y="211.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">q</tspan>'<tspan baseline-shift="sub" font-size="11">t</tspan>（128）</text>
<rect x="474" y="164" width="44" height="24" fill="var(--fig-red, #A3231C)" fill-opacity="0.1" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="496" y="180" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">R<tspan baseline-shift="sub" font-size="11">0−t</tspan></text>
<line x1="496" y1="188" x2="496" y2="208" stroke="var(--fig-red, #A3231C)" stroke-width="1.1" marker-end="url(#ah-red)"/>
<rect x="524" y="164" width="44" height="24" fill="var(--fig-red, #A3231C)" fill-opacity="0.1" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="546" y="180" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">R<tspan baseline-shift="sub" font-size="11">1−t</tspan></text>
<line x1="546" y1="188" x2="546" y2="208" stroke="var(--fig-red, #A3231C)" stroke-width="1.1" marker-end="url(#ah-red)"/>
<rect x="574" y="164" width="44" height="24" fill="var(--fig-red, #A3231C)" fill-opacity="0.1" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="596" y="180" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">R<tspan baseline-shift="sub" font-size="11">2−t</tspan></text>
<line x1="596" y1="188" x2="596" y2="208" stroke="var(--fig-red, #A3231C)" stroke-width="1.1" marker-end="url(#ah-red)"/>
<rect x="624" y="164" width="44" height="24" fill="var(--fig-red, #A3231C)" fill-opacity="0.1" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="646" y="180" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">R<tspan baseline-shift="sub" font-size="11">3−t</tspan></text>
<line x1="646" y1="188" x2="646" y2="208" stroke="var(--fig-red, #A3231C)" stroke-width="1.1" marker-end="url(#ah-red)"/>
<path d="M112 207 L440 207 L440 176" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" stroke-linejoin="round"/>
<line x1="440" y1="176" x2="470" y2="176" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" marker-end="url(#ah-blue)"/>
<rect x="474" y="210" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="496" y="227" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">0</tspan></text>
<rect x="524" y="210" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="546" y="227" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>
<rect x="574" y="210" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="596" y="227" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">2</tspan></text>
<rect x="624" y="210" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="646" y="227" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">3</tspan></text>
<rect x="674" y="210" width="44" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="696" y="227" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">…</text>
<text x="130" y="234" font-size="12" fill="var(--fig-red, #A3231C)">每个位置 j 夹着一个不同的矩阵 R<tspan baseline-shift="sub" font-size="11">j−t</tspan>W<tspan baseline-shift="super" font-size="11">UK</tspan>（式 5.24）：</text>
<text x="130" y="253" font-size="12" fill="var(--fig-red, #A3231C)">没有固定矩阵能预先并进 W<tspan baseline-shift="super" font-size="11">Q</tspan>，</text>
<text x="130" y="270" font-size="12" fill="var(--fig-red, #A3231C)">只能把所有缓存的键重新展开再旋转。</text>
<text x="20" y="320" font-size="13.5" fill="var(--fig-blue, #1F5FA8)" font-weight="700">③ 解耦 RoPE（DeepSeek-V2/V3）：内容部分不转、可吸收；另开 64 维专门承载位置</text>
<rect x="20" y="338" width="110" height="34" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="75" y="359.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">q</tspan><tspan baseline-shift="super" font-size="11">C</tspan><tspan baseline-shift="sub" font-size="11">t</tspan>（128）</text>
<rect x="20" y="382" width="110" height="34" fill="var(--fig-red, #A3231C)" fill-opacity="0.1" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" rx="6"/>
<text x="75" y="403.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">q</tspan><tspan baseline-shift="super" font-size="11">R</tspan><tspan baseline-shift="sub" font-size="11">t</tspan>（64，RoPE）</text>
<line x1="130" y1="355" x2="300" y2="355" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<text x="215" y="348" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">吸收，同 ①</text>
<line x1="130" y1="399" x2="300" y2="399" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<text x="215" y="416" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">直接与 <tspan font-weight="700">k</tspan><tspan baseline-shift="super" font-size="11">R</tspan><tspan baseline-shift="sub" font-size="11">j</tspan> 点积</text>
<rect x="306" y="342" width="320" height="26" fill="var(--fig-amber, #8A6508)" fill-opacity="0.22" stroke="var(--fig-amber, #8A6508)" stroke-width="1.2" rx="3"/>
<text x="466" y="360" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan>：512 维（内容，所有头共用）</text>
<rect x="306" y="386" width="40" height="26" fill="var(--fig-red, #A3231C)" fill-opacity="0.12" stroke="var(--fig-red, #A3231C)" stroke-width="1.2" rx="3"/>
<text x="356" y="404" font-size="12" fill="var(--fig-red, #A3231C)"><tspan font-weight="700">k</tspan><tspan baseline-shift="super" font-size="11">R</tspan><tspan baseline-shift="sub" font-size="11">j</tspan>：64 维，已按位置 j 旋转，所有头共享</text>
<path d="M 632 342 h 10 v 70 h -10" fill="none" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3"/>
<text x="648" y="372" font-size="12" fill="var(--fig-amber, #8A6508)">每 token 每层</text>
<text x="648" y="390" font-size="12" fill="var(--fig-amber, #8A6508)" font-weight="700">缓存 576 个数</text>
<text x="20" y="448" font-size="12.5" fill="var(--fig-ink, #1C1B19)">打分 = <tspan font-weight="700">q</tspan><tspan baseline-shift="super" font-size="11">C</tspan>·<tspan font-weight="700">k</tspan><tspan baseline-shift="super" font-size="11">C</tspan> + <tspan font-weight="700">q</tspan><tspan baseline-shift="super" font-size="11">R</tspan>·<tspan font-weight="700">k</tspan><tspan baseline-shift="super" font-size="11">R</tspan>：前一项靠吸收只读 <tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan>，后一项占缓存的 64/576 = 11.1%。</text>
<text x="20" y="468" font-size="12.5" fill="var(--fig-muted, #74716A)">YaRN 只作用在 <tspan font-weight="700">q</tspan><tspan baseline-shift="super" font-size="11">R</tspan>、<tspan font-weight="700">k</tspan><tspan baseline-shift="super" font-size="11">R</tspan> 这 64 维上（§7）；详细推导在第 9 课。</text>
<text x="20" y="488" font-size="12" fill="var(--fig-muted, #74716A)">维度取自 DeepSeek-V2：d<tspan baseline-shift="sub" font-size="11">c</tspan> = 512，d<tspan baseline-shift="sub" font-size="11">h</tspan> = 128，d<tspan baseline-shift="sub" font-size="11">h</tspan><tspan baseline-shift="super" font-size="11">R</tspan> = 64（V3 相同）。</text>
</svg>
