<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>投机解码的执行轨迹（γ = 3）：小模型起草，大模型一次并行验证</title>

<text x="16" y="28" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">Ⓐ 普通解码：每调用一次目标模型，产出 1 个 token（5 次调用 → 5 个 token）</text>
<text x="100" y="80" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">目标模型</text>
<rect x="110" y="60" width="100" height="30" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.45" rx="4"/>
<text x="160" y="80" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">调用 1</text>
<rect x="148" y="98" width="24" height="24" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="4"/>
<text x="160" y="115" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">山</text>
