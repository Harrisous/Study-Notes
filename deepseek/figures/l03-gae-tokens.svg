<text x="202" y="312" font-size="12.5" fill="var(--fig-muted, #74716A)" text-anchor="end">Â<tspan baseline-shift="sub" font-size="11">t</tspan>，λ = 1</text>
<text x="277" y="312" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.4875</text>
