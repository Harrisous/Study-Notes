<text x="16" y="398" font-size="12" fill="var(--fig-muted, #74716A)">从最后一个 token 往前递推：Â<tspan baseline-shift="sub" font-size="11">4</tspan> = δ<tspan baseline-shift="sub" font-size="11">4</tspan>，Â<tspan baseline-shift="sub" font-size="11">t</tspan> = δ<tspan baseline-shift="sub" font-size="11">t</tspan> + γλ·Â<tspan baseline-shift="sub" font-size="11">t+1</tspan>（γ = 1）。结束之后 V = 0。</text>
<text x="16" y="418" font-size="12" fill="var(--fig-muted, #74716A)">β = 0.05；红字是每个 token 的 KL 奖励 −β·log(π<tspan baseline-shift="sub" font-size="11">θ</tspan>/π<tspan baseline-shift="sub" font-size="11">ref</tspan>)；数字为笔者自拟，由脚本计算。</text>
