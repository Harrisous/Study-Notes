<text x="306" y="132.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">专家：代码</text>
<text x="306" y="149.82" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">SFT → GRPO；三档推理强度各一版</text>
<path d="M136 208 C 166 208, 166 137, 195 137" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
