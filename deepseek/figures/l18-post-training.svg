<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>V4 的后训练流水线</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<rect x="16" y="176" width="120" height="64" fill="var(--fig-muted, #74716A)" fill-opacity="0.12" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="76" y="202.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">V4-Base</text>
<text x="76" y="222.68" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">专家权重 FP8</text>
<rect x="196" y="62" width="220" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="306" y="78.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">专家：数学</text>
<text x="306" y="95.82" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">SFT → GRPO；三档推理强度各一版</text>
