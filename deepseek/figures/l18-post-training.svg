<rect x="196" y="170" width="220" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="306" y="186.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">专家：智能体</text>
<text x="306" y="203.82" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">SFT → GRPO；三档推理强度各一版</text>
<path d="M136 208 C 166 208, 166 191, 195 191" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<path d="M416 191 C 446 191, 430 208, 459 208" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="196" y="224" width="220" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="306" y="240.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">专家：指令遵循</text>
<text x="306" y="257.82" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">SFT → GRPO；三档推理强度各一版</text>
<path d="M136 208 C 166 208, 166 245, 195 245" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<path d="M416 245 C 446 245, 430 208, 459 208" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="196" y="278" width="220" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6" stroke-dasharray="4 3"/>
<text x="306" y="303.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">更多领域（教师共十个以上）</text>
<path d="M136 208 C 166 208, 166 299, 195 299" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<path d="M416 299 C 446 299, 430 208, 459 208" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="184" y="14" width="244" height="40" fill="var(--fig-amber, #8A6508)" fill-opacity="0.1" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="6"/>
<text x="306" y="30.46" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">奖励：规则 / 测试用例；难验证任务用 GRM</text>
<text x="306" y="45.46" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">（带评分细则，actor 兼任评委）</text>
<text x="306" y="388" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">第一段：专家培养（GRPO 只在这里）</text>
<rect x="460" y="130" width="178" height="156" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="549" y="160.18" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">多教师在线蒸馏</text>
<text x="549" y="181.18" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">（OPD）</text>
<text x="549" y="202.18" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">① 学生自己采样轨迹</text>
<text x="549" y="223.18" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">② 每位教师在每个位置</text>
<text x="549" y="244.18" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">给出全词表分布</text>
<text x="549" y="265.18" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">③ 最小化 Σ w<tspan baseline-shift="-2.4" font-size="11">i</tspan>·KL(学生 ‖ 教师 i)</text>
<text x="549" y="388" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="700">第二段：合成一个模型</text>
<line x1="638" y1="208" x2="652" y2="208" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="652" y="170" width="100" height="76" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="702" y="193.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">V4</text>
<text x="702" y="212.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">统一模型</text>
<text x="702" y="231.68" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">三档推理强度</text>
<rect x="196" y="334" width="552" height="30" fill="var(--fig-orange, #B4460C)" fill-opacity="0.12" stroke="var(--fig-orange, #B4460C)" stroke-width="1.2" rx="6"/>
<text x="472" y="354" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">贯穿后训练：FP4 量化感知训练（专家权重 + indexer 的 QK），推理与 RL 采样直接用 FP4</text>
<text x="16" y="410" font-size="11" fill="var(--fig-muted, #74716A)">OPD 用反向 KL，并在每个位置对 129,280 个词精确求和；不用“采样 token 的对数比当优势”的单样本估计。</text>
</svg>
