<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 424" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>PPO-RLHF 的四个网络与一轮迭代的数据流</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<rect x="16" y="40" width="96" height="40" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.3" rx="8"/>
<text x="64" y="64.86" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">提示 <tspan font-weight="700">q</tspan></text>
<line x1="64" y1="82" x2="64" y2="101" stroke="var(--fig-muted, #74716A)" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="16" y="104" width="136" height="120" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" rx="8"/>
<text x="84" y="137" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan>（训练）</text>
<text x="84" y="158" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">① 生成回答 <tspan font-weight="700">o</tspan></text>
<text x="84" y="179" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">记下每个 token 的</text>
<text x="84" y="200" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">log π<tspan baseline-shift="sub" font-size="11">old</tspan>(o<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
<text x="84" y="242" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">InstructGPT：</text>
<text x="84" y="258" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">1.3B / 6B / 175B</text>
<line x1="152" y1="165" x2="168" y2="165" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5"/>
<line x1="168" y1="67" x2="168" y2="263" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5"/>
<line x1="168" y1="67" x2="184" y2="67" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<line x1="168" y1="165" x2="184" y2="165" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<line x1="168" y1="263" x2="184" y2="263" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<text x="176" y="30" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="600">② 打分：三个网络各读一遍 (<tspan font-weight="700">q</tspan>, <tspan font-weight="700">o</tspan>)</text>
<rect x="184" y="36" width="212" height="62" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" rx="8" stroke-dasharray="6 4"/>
<text x="290" y="60.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">参考模型 π<tspan baseline-shift="sub" font-size="11">ref</tspan>（冻结）</text>
<text x="290" y="82.5" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">每个 token 的 log π<tspan baseline-shift="sub" font-size="11">ref</tspan>(o<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
<rect x="184" y="134" width="212" height="62" fill="var(--fig-green, #16704A)" fill-opacity="0.08" stroke="var(--fig-green, #16704A)" stroke-width="1.4" rx="8" stroke-dasharray="6 4"/>
<text x="290" y="158.5" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">奖励模型 r<tspan baseline-shift="sub" font-size="11">φ</tspan>（冻结）</text>
<text x="290" y="180.5" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle">整段回答一个分数</text>
<rect x="184" y="232" width="212" height="62" fill="var(--fig-violet, #6733C4)" fill-opacity="0.08" stroke="var(--fig-violet, #6733C4)" stroke-width="2.4" rx="8"/>
<text x="290" y="256.5" font-size="12.5" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="700">价值网络 V<tspan baseline-shift="sub" font-size="11">ψ</tspan>（训练）</text>
<text x="290" y="278.5" font-size="12.5" fill="var(--fig-violet, #6733C4)" text-anchor="middle">每个 token 的 V<tspan baseline-shift="sub" font-size="11">ψ</tspan>(s<tspan baseline-shift="sub" font-size="11">t</tspan>)</text>
<text x="290" y="114" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">InstructGPT：与策略同尺寸</text>
<text x="290" y="212" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">InstructGPT：6B</text>
<text x="190" y="312" font-size="11.5" fill="var(--fig-muted, #74716A)">InstructGPT：6B，由 RM 初始化</text>
<rect x="432" y="84" width="150" height="84" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="8"/>
<text x="507" y="108.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">③ 逐 token 奖励 r<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="507" y="130.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−β·log(π<tspan baseline-shift="sub" font-size="11">old</tspan>/π<tspan baseline-shift="sub" font-size="11">ref</tspan>)</text>
<text x="507" y="152.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">末位再加 r<tspan baseline-shift="sub" font-size="11">φ</tspan>，式 (3.8)</text>
<line x1="396" y1="70" x2="431" y2="100" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<line x1="396" y1="163" x2="431" y2="150" stroke="var(--fig-green, #16704A)" stroke-width="1.5" marker-end="url(#ah-green)"/>
<path d="M132 104 V14 H500 V81" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah-blue)"/>
<text x="512" y="40" font-size="11.5" fill="var(--fig-blue, #1F5FA8)">log π<tspan baseline-shift="sub" font-size="11">old</tspan></text>
<text x="508" y="66" font-size="11.5" fill="var(--fig-blue, #1F5FA8)">（采样时已记下）</text>
<rect x="432" y="232" width="150" height="62" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="8"/>
<text x="507" y="256.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">④ GAE → 优势 Â<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="507" y="278.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">式 (3.24)</text>
<line x1="507" y1="168" x2="507" y2="229" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<line x1="396" y1="263" x2="429" y2="263" stroke="var(--fig-violet, #6733C4)" stroke-width="1.5" marker-end="url(#ah-violet)"/>
<rect x="600" y="220" width="132" height="86" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="666" y="244.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">⑤ 更新</text>
<text x="666" y="267.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">π<tspan baseline-shift="sub" font-size="11">θ</tspan>：裁剪目标 (3.17)</text>
<text x="666" y="290.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">V<tspan baseline-shift="sub" font-size="11">ψ</tspan>：回归 (3.25)</text>
<line x1="582" y1="263" x2="597" y2="263" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<path d="M666 306 V352 H34 V227" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<path d="M388 352 V297" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.6" marker-end="url(#ah-violet)"/>
<text x="404" y="345" font-size="12" fill="var(--fig-blue, #1F5FA8)">反向传播，只更新两个“训练”的网络</text>
<rect x="16" y="380" width="26" height="14" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="2.4" rx="3"/>
<text x="48" y="392" font-size="12" fill="var(--fig-ink, #1C1B19)">训练：前向 + 反向 + 优化器状态</text>
<rect x="262" y="380" width="26" height="14" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" rx="3" stroke-dasharray="6 4"/>
<text x="294" y="392" font-size="12" fill="var(--fig-ink, #1C1B19)">冻结：只做前向</text>
<text x="16" y="414" font-size="12" fill="var(--fig-muted, #74716A)">π<tspan baseline-shift="sub" font-size="11">old</tspan> 不是第五个网络：只需要采样时顺手记下的逐 token 对数概率。</text>
</svg>
