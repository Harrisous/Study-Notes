<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 399" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>每 token 的 KV cache 字节数：各模型对比（对数横轴）</title>
<defs><pattern id="hq" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--fig-orange, #B4460C)" fill-opacity="0.12"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--fig-orange, #B4460C)" stroke-width="1.4" stroke-opacity="0.7"/></pattern></defs>
<line x1="262" y1="30" x2="262" y2="337" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="262" y="353" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10 KB</text>
<line x1="391.33" y1="30" x2="391.33" y2="337" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="391.33" y="353" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">100 KB</text>
<line x1="520.67" y1="30" x2="520.67" y2="337" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="520.67" y="353" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1 MB</text>
<line x1="650" y1="30" x2="650" y2="337" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="650" y="353" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10 MB</text>
<text x="456" y="375" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">每 token 的 KV cache（全部层合计，字节，bf16 除非注明；对数刻度）</text>
<text x="16" y="22" font-size="12" fill="var(--fig-muted, #74716A)">灰色 = MHA 或 GQA；橙色 = MLA；橙色斜纹 = MLA 再量化；虚框 = 假想配置</text>
<text x="252" y="53" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">DeepSeek-V2 的形状若用 MHA（假想）</text>
<rect x="262" y="40" width="335.57" height="18" fill="var(--fig-muted, #74716A)" fill-opacity="0.08" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="2" stroke-dasharray="5 3"/>
<text x="603.57" y="53" font-size="11.5" fill="var(--fig-ink, #1C1B19)">3.93 MB</text>
<text x="252" y="80" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">LLaMA-3.1 405B · GQA-8 · 126 层</text>
