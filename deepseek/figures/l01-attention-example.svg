<text x="496" y="114" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">1</text>
<polygon points="690,296 504,110 690,110" fill="var(--fig-green, #16704A)" fill-opacity="0.08"/>
<line x1="504" y1="110" x2="690" y2="110" stroke="var(--fig-green, #16704A)" stroke-width="1"/>
