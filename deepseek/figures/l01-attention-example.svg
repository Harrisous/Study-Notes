<text x="54" y="214" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="600"><tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>
<line x1="46" y1="300" x2="230" y2="300" stroke="var(--fig-violet, #6733C4)" stroke-width="1.8" marker-end="url(#ah-violet)"/>
<text x="234" y="290" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600"><tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">2</tspan></text>
<line x1="46" y1="300" x2="138" y2="208" stroke="var(--fig-violet, #6733C4)" stroke-width="1.8" marker-end="url(#ah-violet)"/>
<text x="134" y="198" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600"><tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">3</tspan></text>
<line x1="46" y1="300" x2="230" y2="208" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<text x="236" y="200" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">3</tspan></text>
<text x="282" y="96" font-size="12" fill="var(--fig-ink, #1C1B19)">分数 = 查询与键的点积：</text>
<text x="282" y="122" font-size="12" fill="var(--fig-violet, #6733C4)"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">3</tspan>·<tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">1</tspan> = 2×0 + 1×1 = 1</text>
<text x="410" y="122" font-size="12" fill="var(--fig-muted, #74716A)">（The）</text>
<text x="282" y="146" font-size="12" fill="var(--fig-violet, #6733C4)" font-weight="600"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">3</tspan>·<tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">2</tspan> = 2×2 + 1×0 = 4</text>
<text x="410" y="146" font-size="12" fill="var(--fig-muted, #74716A)">（cat）</text>
<text x="282" y="170" font-size="12" fill="var(--fig-violet, #6733C4)"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">3</tspan>·<tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">3</tspan> = 2×1 + 1×1 = 3</text>
<text x="410" y="170" font-size="12" fill="var(--fig-muted, #74716A)">（sat）</text>
<text x="282" y="208" font-size="12" fill="var(--fig-muted, #74716A)">k<tspan baseline-shift="sub" font-size="11">3</tspan> 的方向更接近 q<tspan baseline-shift="sub" font-size="11">3</tspan>，</text>
<text x="282" y="226" font-size="12" fill="var(--fig-muted, #74716A)">但 k<tspan baseline-shift="sub" font-size="11">2</tspan> 更长（2 对 1.41），</text>
<text x="282" y="244" font-size="12" fill="var(--fig-muted, #74716A)">所以 k<tspan baseline-shift="sub" font-size="11">2</tspan>（cat）的点积最大。</text>
<line x1="456" y1="12" x2="456" y2="340" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
