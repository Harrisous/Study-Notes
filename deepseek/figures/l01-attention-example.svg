<text x="36" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">1</text>
<line x1="230" y1="318.4" x2="230" y2="88.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="230" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">2</text>
<line x1="27.6" y1="116" x2="266.8" y2="116" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="36" y="120" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">2</text>
<text x="38" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0</text>
<line x1="27.6" y1="300" x2="266.8" y2="300" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
