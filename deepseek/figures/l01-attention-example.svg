<text x="700" y="300" font-size="12" fill="var(--fig-green, #16704A)"><tspan font-weight="700">v</tspan><tspan baseline-shift="sub" font-size="11">1</tspan>（The）</text>
<circle cx="504" cy="110" r="5" fill="var(--fig-green, #16704A)"/>
