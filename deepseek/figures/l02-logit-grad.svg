<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>交叉熵对 logits 的梯度 = p − y，以及沿负梯度走一步的效果</title>

<text x="20" y="22" font-size="12" fill="var(--fig-ink, #1C1B19)">语境 “The unbelievable” 之后，真实的下一个 token 是 Ġtoken（y 在这一格为 1，其余为 0）</text>
<text x="20" y="64" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">候选 token</text>
<text x="130" y="64" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">logit z</text>
<text x="170" y="64" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">p = softmax(z)</text>
<text x="450" y="64" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">梯度 ∂ℓ/∂z = p − y</text>
<text x="572" y="64" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">走一步后 p′</text>
<line x1="450" y1="74" x2="450" y2="286" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<text x="20" y="96" font-size="13" fill="var(--fig-ink, #1C1B19)">Ġstory</text>
<text x="130" y="96" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+2</text>
<rect x="170" y="84" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="170" y="84" width="64.39" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="276" y="96" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.644</text>
<rect x="450" y="84" width="45.07" height="14" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.55"/>
<text x="501.07" y="96" font-size="12" fill="var(--fig-ink, #1C1B19)">+0.644</text>
<rect x="572" y="84" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="572" y="84" width="35.33" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="678" y="96" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.353</text>
<rect x="12" y="122" width="696" height="44" fill="var(--fig-green, #16704A)" fill-opacity="0.07" rx="6"/>
<text x="20" y="146" font-size="13" fill="var(--fig-green, #16704A)" font-weight="600">Ġtoken</text>
<text x="130" y="146" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+1</text>
<rect x="170" y="134" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="170" y="134" width="23.69" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="276" y="146" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.237</text>
<rect x="396.58" y="134" width="53.42" height="14" fill="var(--fig-red, #A3231C)" fill-opacity="0.85"/>
<text x="390.58" y="146" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="end">−0.763</text>
<rect x="572" y="134" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="572" y="134" width="53.08" height="14" fill="var(--fig-green, #16704A)" fill-opacity="0.85"/>
<text x="678" y="146" font-size="12" fill="var(--fig-green, #16704A)">0.531</text>
<text x="20" y="196" font-size="13" fill="var(--fig-ink, #1C1B19)">Ġnews</text>
<text x="130" y="196" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0</text>
<rect x="170" y="184" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="170" y="184" width="8.71" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="276" y="196" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.087</text>
<rect x="450" y="184" width="6.1" height="14" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.55"/>
<text x="462.1" y="196" font-size="12" fill="var(--fig-ink, #1C1B19)">+0.087</text>
<rect x="572" y="184" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="572" y="184" width="8.34" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="678" y="196" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.083</text>
<text x="20" y="246" font-size="13" fill="var(--fig-ink, #1C1B19)">Ġcat</text>
<text x="130" y="246" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−1</text>
<rect x="170" y="234" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="170" y="234" width="3.21" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="276" y="246" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.032</text>
<rect x="450" y="234" width="2.24" height="14" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.55"/>
<text x="458.24" y="246" font-size="12" fill="var(--fig-ink, #1C1B19)">+0.032</text>
<rect x="572" y="234" width="100" height="14" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<rect x="572" y="234" width="3.24" height="14" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="678" y="246" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.032</text>
<text x="390" y="300" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">← 把 z 往上推</text>
<text x="510" y="300" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">把 z 往下压 →</text>
<text x="20" y="332" font-size="12" fill="var(--fig-ink, #1C1B19)">四个梯度之和 = 0.644 + (−0.763) + 0.087 + 0.032 = 0：概率总量守恒，一格涨、其余按 p 的比例跌。</text>
<text x="20" y="352" font-size="12" fill="var(--fig-ink, #1C1B19)">沿负梯度改 logits 一步（z′ = z − 1·(p − y)）：p(Ġtoken) 从 0.237 升到 0.531，损失从 1.440 降到 0.633 nats。</text>
</svg>
