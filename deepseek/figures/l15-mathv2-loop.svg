<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>DeepSeekMath-V2：验证器、元验证器与会自评的生成器</title>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">一次训练迭代里的三个角色</text>
<rect x="12" y="44" width="104" height="50" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.05" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="64" y="64.91" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">题目 X</text>
<text x="64" y="82.45" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">需要证明的题</text>
<rect x="150" y="44" width="124" height="50" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="212" y="63.18" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">生成器 π<tspan baseline-shift="sub" font-size="11">θ</tspan></text>
<text x="212" y="84.18" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">写证明，再自评</text>
<rect x="308" y="36" width="168" height="66" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.06" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="392" y="56.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">证明 Y</text>
<text x="392" y="73.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+ 自评 Z：问题清单</text>
<text x="392" y="90.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">与自评分 s′</text>
<line x1="118" y1="69" x2="146" y2="69" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="276" y1="69" x2="304" y2="69" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="150" y="150" width="124" height="50" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="212" y="169.18" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">验证器 π<tspan baseline-shift="sub" font-size="11">φ</tspan></text>
<text x="212" y="190.18" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">读 (X, Y)</text>
<rect x="308" y="142" width="168" height="66" fill="var(--fig-violet, #6733C4)" fill-opacity="0.06" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="392" y="162.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">分析：列出问题</text>
<text x="392" y="179.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">证明分 s ∈ {0, 0.5, 1}</text>
<text x="392" y="196.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">→ R<tspan baseline-shift="sub" font-size="11">Y</tspan> = s</text>
<path d="M392 102 V118 H212 V146" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<line x1="276" y1="175" x2="304" y2="175" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="150" y="248" width="124" height="50" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="212" y="267.18" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">元验证器 π<tspan baseline-shift="sub" font-size="11">η</tspan></text>
<text x="212" y="288.18" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">检查一份分析</text>
<rect x="308" y="240" width="168" height="66" fill="var(--fig-violet, #6733C4)" fill-opacity="0.06" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="392" y="260.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">分析里指出的问题</text>
<text x="392" y="277.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">是否真实存在？</text>
<text x="392" y="294.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">→ 元验证分 R<tspan baseline-shift="sub" font-size="11">meta</tspan></text>
<path d="M392 208 V224 H212 V244" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" marker-end="url(#ah-ink)"/>
<line x1="276" y1="273" x2="304" y2="273" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="12" y="330" width="464" height="52" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="24" y="352" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">生成器的奖励：R = R<tspan baseline-shift="sub" font-size="11">format</tspan> · (0.76 · R<tspan baseline-shift="sub" font-size="11">Y</tspan> + 0.24 · R<tspan baseline-shift="sub" font-size="11">Z</tspan>)</text>
<text x="24" y="372" font-size="12" fill="var(--fig-ink, #1C1B19)">R<tspan baseline-shift="sub" font-size="11">Z</tspan> = (1 − |s′ − s|) · R<tspan baseline-shift="sub" font-size="11">meta</tspan>(Z)：自评越接近验证器的判断，这一项越高</text>
<path d="M476 356 H494 V31 H212 V40" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-green)"/>
<text x="12" y="404" font-size="11" fill="var(--fig-muted, #74716A)">迭代：先训验证器，再从验证器检查点初始化生成器；放大验证算力给新的难证明自动标注，继续训验证器。</text>
<text x="512" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">奖励表（设 R<tspan baseline-shift="sub" font-size="11">format</tspan> = R<tspan baseline-shift="sub" font-size="11">meta</tspan> = 1）</text>
<text x="536" y="52" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="700">真实 s</text>
<text x="598" y="52" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="700">自评 s′</text>
<text x="664" y="52" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="700">R<tspan baseline-shift="sub" font-size="11">Z</tspan></text>
<text x="732" y="52" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="700">R</text>
<line x1="512" y1="60" x2="748" y2="60" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
