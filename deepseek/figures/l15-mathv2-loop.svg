<text x="512" y="280" font-size="12" fill="var(--fig-ink, #1C1B19)">同一个只值 0.5 分的证明：</text>
<text x="512" y="298" font-size="12" fill="var(--fig-green, #16704A)">老实自评 0.5 → 0.62；夸成 1 → 0.50</text>
<text x="512" y="322" font-size="12" fill="var(--fig-ink, #1C1B19)">同一个错误的证明（s = 0）：</text>
<text x="512" y="340" font-size="12" fill="var(--fig-green, #16704A)">老实自评 0 → 0.24；夸成 1 → 0</text>
<text x="512" y="368" font-size="12" fill="var(--fig-muted, #74716A)">诚实地指出自己的错误，</text>
<text x="512" y="384" font-size="12" fill="var(--fig-muted, #74716A)">得分高于谎称正确。</text>
</svg>
