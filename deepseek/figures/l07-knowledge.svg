<text x="473" y="169" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">8</text>
<text x="473" y="187" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">化学</text>
<rect x="504" y="152" width="50" height="44" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.1" rx="5"/>
<text x="529" y="169" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">9</text>
