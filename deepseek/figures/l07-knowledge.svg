<text x="697" y="187" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">烹饪</text>
<text x="392" y="228" font-size="12" fill="var(--fig-ink, #1C1B19)">每个小专家只装一类知识，一个 token 同时激活几个</text>
<text x="392" y="246" font-size="12" fill="var(--fig-ink, #1C1B19)">相关的小专家，按需组合（§5）；公共知识交给</text>
<text x="392" y="264" font-size="12" fill="var(--fig-ink, #1C1B19)">共享专家，路由专家不必各存一份（§6）。</text>
<line x1="20" y1="306" x2="720" y2="306" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="20" y="330" font-size="12" fill="var(--fig-muted, #74716A)">示意图：这是 DeepSeekMoE 论文提出的假说。真实专家“装了什么”是训练中自发形成的，论文只给出间接证据（§8）。</text>
