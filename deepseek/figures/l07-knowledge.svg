<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 348" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>知识混杂与知识冗余示意：少而大的专家 vs 细粒度专家 + 共享专家</title>

<text x="20" y="24" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(a) 传统 MoE：少而大的专家（画出 4 个）</text>
