<text x="60" y="62" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">专家 1</text>
<rect x="30" y="70" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" rx="3"/>
<text x="60" y="88" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">代码</text>
<rect x="30" y="100" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.18" rx="3"/>
<text x="60" y="118" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">数学</text>
