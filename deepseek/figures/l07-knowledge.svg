<rect x="30" y="160" width="60" height="26" fill="var(--fig-violet, #6733C4)" fill-opacity="0.22" rx="3"/>
<text x="60" y="178" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">公共知识</text>
<rect x="108" y="44" width="72" height="150" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.4" rx="6"/>
<text x="144" y="62" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">专家 2</text>
<rect x="114" y="70" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" rx="3"/>
<text x="144" y="88" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">法律</text>
<rect x="114" y="100" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.18" rx="3"/>
<text x="144" y="118" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">医学</text>
<rect x="114" y="130" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.26" rx="3"/>
<text x="144" y="148" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">体育</text>
<rect x="114" y="160" width="60" height="26" fill="var(--fig-violet, #6733C4)" fill-opacity="0.22" rx="3"/>
<text x="144" y="178" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">公共知识</text>
<rect x="192" y="44" width="72" height="150" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.4" rx="6"/>
<text x="228" y="62" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">专家 3</text>
<rect x="198" y="70" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" rx="3"/>
<text x="228" y="88" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">历史</text>
<rect x="198" y="100" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.18" rx="3"/>
<text x="228" y="118" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">化学</text>
<rect x="198" y="130" width="60" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.26" rx="3"/>
<text x="228" y="148" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">金融</text>
<rect x="198" y="160" width="60" height="26" fill="var(--fig-violet, #6733C4)" fill-opacity="0.22" rx="3"/>
