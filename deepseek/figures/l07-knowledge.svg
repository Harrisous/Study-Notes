<rect x="560" y="152" width="50" height="44" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.1" rx="5"/>
<text x="585" y="169" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10</text>
<text x="585" y="187" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">地理</text>
<rect x="616" y="152" width="50" height="44" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.1" rx="5"/>
<text x="641" y="169" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">11</text>
<text x="641" y="187" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">音乐</text>
<rect x="672" y="152" width="50" height="44" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.1" rx="5"/>
