<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>DeepEncoder：SAM（窗口注意力）→ 16 倍卷积压缩 → CLIP（全局注意力）→ 3B MoE 解码器</title>
