<text x="370" y="190" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">4096 个 token，多数层只在窗口内互相看</text>
<line x1="252" y1="110" x2="278" y2="110" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
