<text x="651" y="290" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">DeepSeek-3B-MoE</text>
<text x="651" y="310" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">12 层，隐藏维 1280</text>
<text x="651" y="328" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">64 选 6 路由 + 2 共享</text>
<text x="651" y="346" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">约 570M 激活</text>
<text x="651" y="366" font-size="11.5" fill="var(--fig-green, #16704A)" text-anchor="middle">输出文本 token</text>
<line x1="532" y1="323" x2="558" y2="323" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<text x="476" y="366" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">256 个视觉 token</text>
<text x="20" y="412" font-size="12" fill="var(--fig-ink, #1C1B19)">编码器约 380M 参数（80M + 300M）。若让 CLIP 直接吃 4096 个 token，全局注意力的分数矩阵会大 4096² / 256² = 256 倍；</text>
<text x="20" y="432" font-size="12" fill="var(--fig-ink, #1C1B19)">先用便宜的窗口注意力看细节、再压 16 倍，是 DeepEncoder 控制激活显存的办法。拼接与投影维度取自开源代码与 config.json。</text>
</svg>
