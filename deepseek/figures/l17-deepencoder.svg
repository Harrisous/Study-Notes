<text x="118" y="328" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">全局注意力</text>
<text x="118" y="346" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">去掉首层 patch embedding</text>
<text x="118" y="366" font-size="11.5" fill="var(--fig-violet, #6733C4)" text-anchor="middle">256 × 256 的注意力矩阵</text>
