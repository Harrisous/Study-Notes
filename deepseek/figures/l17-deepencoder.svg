<text x="323" y="312" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">通道拼接</text>
<text x="323" y="330" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1024 ⊕ 1024 = 2048</text>
<text x="323" y="348" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">（开源代码）</text>
