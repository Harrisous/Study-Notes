<text x="70" y="272" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">选择块 1 的分数 = 1·p<tspan baseline-shift="super" font-size="11">cmp</tspan>[3] + 2·p<tspan baseline-shift="super" font-size="11">cmp</tspan>[4] + 2·p<tspan baseline-shift="super" font-size="11">cmp</tspan>[5] + 2·p<tspan baseline-shift="super" font-size="11">cmp</tspan>[6] + 1·p<tspan baseline-shift="super" font-size="11">cmp</tspan>[7]</text>
<text x="70" y="294" font-size="12" fill="var(--fig-muted, #74716A)">权重 = 压缩块落在选择块内的键数 ÷ 16：中间 3 块完整在内，两端各有一半在内。</text>
<text x="70" y="314" font-size="11" fill="var(--fig-muted, #74716A)">块下标按式 (14.6) 与 (14.12) 的约定计算；NSA 原文式 (9) 的下标与此对不齐（见正文），权重模式相同。</text>
