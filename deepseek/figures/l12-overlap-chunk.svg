<text x="616" y="229" font-size="12" fill="var(--fig-ink, #1C1B19)">屏障（同步点）</text>
<text x="16" y="258" font-size="11" fill="var(--fig-muted, #74716A)">实线框 = 计算，虚线框 = 通信（dispatch：把 token 发给专家；combine：收回专家输出）；计算与通信的 SM 比例手动调。</text>
<text x="16" y="278" font-size="11" fill="var(--fig-muted, #74716A)">每个 chunk 拆成 attention、dispatch、MLP、combine 四块；反向的 attention 与 MLP 再拆成“对输入”“对权重”两半。据 V3 报告图 4 重绘。</text>
