<text x="382" y="268.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">2σ(·)</text>
<line x1="382" y1="284" x2="382" y2="316" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="268" y="318" width="228" height="52" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="382" y="339.91" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600"><tspan font-weight="700">H</tspan><tspan baseline-shift="super" font-size="11">post</tspan><tspan baseline-shift="sub" font-size="11" dx="-22.22"><tspan font-style="italic">l</tspan></tspan><tspan dx="18.48"> ∈ (0, 2)</tspan><tspan baseline-shift="super" font-size="11">1×4</tspan></text>
<text x="382" y="357.46" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">logit 为 0 时恰为 1</text>
<line x1="628" y1="160" x2="628" y2="170" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="516" y="172" width="224" height="40" fill="var(--fig-violet, #6733C4)" fill-opacity="0.08" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="628" y="196.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">× α<tspan baseline-shift="super" font-size="11">res</tspan>，排成 4×4，+ <tspan font-weight="700">S</tspan><tspan baseline-shift="super" font-size="11">res</tspan></text>
<line x1="628" y1="212" x2="628" y2="242" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="516" y="244" width="224" height="40" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="628" y="268.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">exp → [𝓣<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">c</tspan></tspan>, 𝓣<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">r</tspan></tspan>] × 20</text>
<line x1="628" y1="284" x2="628" y2="316" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="516" y="318" width="224" height="52" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="628" y="339.91" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600"><tspan font-weight="700">H</tspan><tspan baseline-shift="super" font-size="11">res</tspan><tspan baseline-shift="sub" font-size="11" dx="-16.06"><tspan font-style="italic">l</tspan></tspan><tspan dx="12.32"> ≈ 双随机 4×4</tspan></text>
<text x="628" y="357.46" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">Sinkhorn–Knopp（§5）</text>
<text x="14" y="400" font-size="12" fill="var(--fig-ink, #1C1B19)">α：3 个门控标量，初值 0.01；<tspan font-weight="700">S</tspan>：24 个静态偏置；<tspan font-weight="700">W</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>：动态投影。三者都是可学习参数。</text>
<text x="14" y="422" font-size="12" fill="var(--fig-muted, #74716A)">每个子层的参数：16384 × 24 + 24 + 3 = 393,243 个（V4-Flash）；mHC 论文用 φ<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>、<tspan font-weight="700">b</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> 表示 <tspan font-weight="700">W</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>、<tspan font-weight="700">S</tspan>。</text>
</svg>
