<text x="134" y="196.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">× α<tspan baseline-shift="super" font-size="11">pre</tspan> + <tspan font-weight="700">S</tspan><tspan baseline-shift="super" font-size="11">pre</tspan></text>
<line x1="134" y1="212" x2="134" y2="242" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
