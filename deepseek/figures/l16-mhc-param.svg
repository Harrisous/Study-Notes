<text x="628" y="152" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">后 16 个 → 混合 res</text>
<text x="380" y="108" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">24 个数（每个 token 一组）</text>
