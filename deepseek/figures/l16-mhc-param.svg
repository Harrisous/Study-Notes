<text x="621" y="69.45" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">一次小矩阵乘：输出只有 24 维</text>
<line x1="621" y1="82" x2="621" y2="112" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
