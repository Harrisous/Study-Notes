<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>93.3% 与 5.76 倍从哪里来：每 token 的 KV 字节，以及 8 张 80 GB 显卡能装下多少 token</title>

<text x="20" y="26" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">① 每个 token 的 KV cache（KB）</text>
<text x="20" y="44" font-size="12" fill="var(--fig-muted, #74716A)">按元素数 × 每元素位数计算</text>
<rect x="58" y="77.07" width="64" height="252.93" fill="var(--fig-muted, #74716A)" fill-opacity="0.45"/>
<text x="90" y="69.07" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">389.1</text>
<text x="90" y="348" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">DeepSeek 67B</text>
<text x="90" y="364" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">GQA-8，bf16</text>
<rect x="168" y="285.07" width="64" height="44.93" fill="var(--fig-orange, #B4460C)" fill-opacity="0.75"/>
<text x="200" y="277.07" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">69.1</text>
<text x="200" y="348" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">V2：MLA</text>
<text x="200" y="364" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">bf16</text>
<rect x="278" y="313.15" width="64" height="16.85" fill="var(--fig-orange, #B4460C)" fill-opacity="0.75"/>
<text x="310" y="305.15" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">25.9</text>
<text x="310" y="348" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">V2：部署态</text>
<text x="310" y="364" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">平均 6 bit</text>
<line x1="40" y1="330" x2="380" y2="330" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<text x="190" y="150" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">−82.2%</text>
<text x="190" y="168" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">MLA + 60 层</text>
<text x="302" y="230" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">−62.5%</text>
<text x="302" y="248" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">6 / 16 bit</text>
<text x="210" y="396" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">合计 1 − 25.92 / 389.12 = 93.3%</text>
<text x="210" y="416" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">对数份额：MLA+层数 64%，量化 36%（笔者计算）</text>
<text x="410" y="26" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">② 8 × 80 GB 装下权重后，还能放多少 token 的 KV</text>
<text x="410" y="44" font-size="12" fill="var(--fig-muted, #74716A)">笔者示意：忽略激活与碎片，单位：百万 token</text>
<text x="410" y="82" font-size="12" fill="var(--fig-ink, #1C1B19)">67B：bf16 权重 + bf16 KV</text>
<rect x="410" y="90" width="20.81" height="30" fill="var(--fig-muted, #74716A)" fill-opacity="0.45"/>
<text x="438.81" y="110" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">1.30M</text>
<text x="410" y="160" font-size="12" fill="var(--fig-ink, #1C1B19)">V2：bf16 权重 + bf16 KV</text>
<rect x="410" y="168" width="38.89" height="30" fill="var(--fig-orange, #B4460C)" fill-opacity="0.4"/>
<text x="456.89" y="188" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">2.43M</text>
<text x="410" y="238" font-size="12" fill="var(--fig-ink, #1C1B19)">V2：FP8 权重 + 6 bit KV</text>
<rect x="410" y="246" width="249.38" height="30" fill="var(--fig-orange, #B4460C)" fill-opacity="0.75"/>
<text x="667.38" y="266" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">15.59M</text>
<text x="410" y="330" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">V2 部署态可缓存的 token 约为 67B 的 12 倍</text>
<text x="410" y="352" font-size="12" fill="var(--fig-muted, #74716A)">能同时服务的序列更多，batch 更大；</text>
<text x="410" y="370" font-size="12" fill="var(--fig-muted, #74716A)">论文：单节点 8×H800 生成吞吐超过 50K token/s，</text>
<text x="410" y="388" font-size="12" fill="var(--fig-muted, #74716A)">是 67B 最大生成吞吐的 5.76 倍</text>
</svg>
