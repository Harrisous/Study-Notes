<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>统一范式：六种方法的数据源、奖励函数与梯度系数</title>

<text x="16" y="30" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">方法</text>
