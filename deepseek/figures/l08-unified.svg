<text x="346" y="178" font-size="12.5" fill="var(--fig-ink, #1C1B19)">𝕀(o)</text>
<rect x="530" y="162" width="42" height="26" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1" rx="4"/>
<text x="551" y="180" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">+1</text>
<rect x="578" y="162" width="42" height="26" fill="var(--fig-muted, #74716A)" fill-opacity="0.08" stroke="var(--fig-muted, #74716A)" stroke-width="1" rx="4"/>
<text x="599" y="180" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0</text>
<rect x="626" y="162" width="42" height="26" fill="var(--fig-muted, #74716A)" fill-opacity="0.08" stroke="var(--fig-muted, #74716A)" stroke-width="1" rx="4"/>
<text x="647" y="180" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0</text>
<rect x="674" y="162" width="42" height="26" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1" rx="4"/>
<text x="695" y="180" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">+1</text>
<text x="16" y="230" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">DPO</text>
<rect x="118" y="209" width="160" height="36" fill="var(--fig-amber, #8A6508)" fill-opacity="0.12" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="5"/>
<text x="198" y="224" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">SFT 模型采样（成对）</text>
<text x="198" y="239" font-size="11" fill="var(--fig-amber, #8A6508)" text-anchor="middle">离线</text>
<text x="290" y="230" font-size="12.5" fill="var(--fig-ink, #1C1B19)">规则</text>
<text x="346" y="230" font-size="12.5" fill="var(--fig-ink, #1C1B19)">±β·σ(r̂<tspan baseline-shift="-3.1" font-size="11">负</tspan> − r̂<tspan baseline-shift="-3.1" font-size="11">正</tspan>)</text>
<rect x="530" y="214" width="42" height="26" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1" rx="4"/>
<text x="551" y="232" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">+0.05</text>
<rect x="578" y="214" width="42" height="26" fill="var(--fig-red, #A3231C)" fill-opacity="0.18" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="599" y="232" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">−0.05</text>
<rect x="626" y="214" width="42" height="26" fill="none" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="4" stroke-dasharray="3 3"/>
<text x="647" y="232" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">—</text>
<rect x="674" y="214" width="42" height="26" fill="none" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="4" stroke-dasharray="3 3"/>
<text x="695" y="232" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">—</text>
<rect x="16" y="254" width="708" height="52" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.5"/>
<text x="16" y="282" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">PPO</text>
<rect x="118" y="261" width="160" height="36" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" rx="5"/>
<text x="198" y="276" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">当前策略采样</text>
<text x="198" y="291" font-size="11" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">在线</text>
<text x="290" y="282" font-size="12.5" fill="var(--fig-ink, #1C1B19)">模型</text>
<text x="346" y="282" font-size="12.5" fill="var(--fig-ink, #1C1B19)">A<tspan baseline-shift="-3.1" font-size="11">t</tspan>（GAE + 价值网络）</text>
<text x="530" y="282" font-size="12" fill="var(--fig-muted, #74716A)">每个 token 各不相同</text>
<text x="16" y="334" font-size="14" fill="var(--fig-blue, #1F5FA8)" font-weight="700">GRPO</text>
<rect x="118" y="313" width="160" height="36" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" rx="5"/>
<text x="198" y="328" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">当前策略采样（每题 G 个）</text>
<text x="198" y="343" font-size="11" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">在线</text>
<text x="290" y="334" font-size="12.5" fill="var(--fig-ink, #1C1B19)">模型</text>
<text x="346" y="334" font-size="12.5" fill="var(--fig-ink, #1C1B19)">Â<tspan baseline-shift="-3.1" font-size="11">i,t</tspan> + β(w − 1)</text>
<rect x="530" y="318" width="42" height="26" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1" rx="4"/>
<text x="551" y="336" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">+1</text>
<rect x="578" y="318" width="42" height="26" fill="var(--fig-red, #A3231C)" fill-opacity="0.18" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="599" y="336" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">−1</text>
<rect x="626" y="318" width="42" height="26" fill="var(--fig-red, #A3231C)" fill-opacity="0.18" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="4"/>
<text x="647" y="336" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">−1</text>
<rect x="674" y="318" width="42" height="26" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1" rx="4"/>
<text x="695" y="336" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">+1</text>
<text x="16" y="378" font-size="12" fill="var(--fig-muted, #74716A)">DPO：一对（第 1 个正确 vs 第 2 个错误），β = 0.1，训练开始时隐式奖励相等，σ(0) = 0.5。</text>
<text x="16" y="396" font-size="12" fill="var(--fig-muted, #74716A)">GRPO：总体标准差，忽略很小的 KL 项。RFT / Online RFT 不惩罚错误回答（系数为 0），GRPO 会（系数为负）。</text>
<text x="16" y="414" font-size="12" fill="var(--fig-muted, #74716A)">黄框 = 离线数据（来自冻结的 SFT 模型），蓝框 = 在线数据（来自正在训练的策略）。</text>
</svg>
