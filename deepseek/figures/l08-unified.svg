<text x="198" y="68" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">人工标注数据</text>
<text x="198" y="83" font-size="11" fill="var(--fig-amber, #8A6508)" text-anchor="middle">离线</text>
<text x="290" y="74" font-size="12.5" fill="var(--fig-ink, #1C1B19)">—</text>
<text x="346" y="74" font-size="12.5" fill="var(--fig-ink, #1C1B19)">1</text>
<text x="530" y="74" font-size="12" fill="var(--fig-muted, #74716A)">只用人工写的解答</text>
<text x="16" y="126" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">RFT</text>
<rect x="118" y="105" width="160" height="36" fill="var(--fig-amber, #8A6508)" fill-opacity="0.12" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="5"/>
