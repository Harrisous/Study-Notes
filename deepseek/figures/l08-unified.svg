<text x="346" y="30" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">梯度系数 GC</text>
<text x="530" y="30" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">例：四个回答，奖励 (1, 0, 0, 1)</text>
