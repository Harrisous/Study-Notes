<text x="647" y="128" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0</text>
<rect x="674" y="110" width="42" height="26" fill="var(--fig-green, #16704A)" fill-opacity="0.18" stroke="var(--fig-green, #16704A)" stroke-width="1" rx="4"/>
<text x="695" y="128" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">+1</text>
<rect x="16" y="150" width="708" height="52" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.5"/>
<text x="16" y="178" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">Online RFT</text>
<rect x="118" y="157" width="160" height="36" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" rx="5"/>
<text x="198" y="172" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">当前策略采样</text>
<text x="198" y="187" font-size="11" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">在线</text>
