<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>门控流水线：V2 与 V3 对照</title>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="16" y="24" font-size="13" fill="var(--fig-muted, #74716A)" font-weight="600">V2（softmax，设备受限，不归一化）</text>
<rect x="16" y="40" width="92" height="48" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="62" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">logit</text>
<text x="62" y="76" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">160 个 z<tspan baseline-shift="sub" font-size="11">i</tspan></text>
<rect x="122" y="40" width="92" height="48" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="168" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">softmax</text>
<text x="168" y="76" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">s 之和 = 1</text>
<line x1="108" y1="64" x2="121" y2="64" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" marker-end="url(#ah-muted)"/>
<rect x="228" y="40" width="92" height="48" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="274" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">设备受限</text>
<text x="274" y="76" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">设备内最大 s</text>
<line x1="214" y1="64" x2="227" y2="64" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" marker-end="url(#ah-muted)"/>
<rect x="334" y="40" width="92" height="48" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="380" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">选 3 台设备</text>
<text x="380" y="76" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">M = 3</text>
<line x1="320" y1="64" x2="333" y2="64" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" marker-end="url(#ah-muted)"/>
<rect x="440" y="40" width="92" height="48" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="486" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">Top-6</text>
<text x="486" y="76" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">在 3 台内选</text>
<line x1="426" y1="64" x2="439" y2="64" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" marker-end="url(#ah-muted)"/>
<rect x="546" y="40" width="92" height="48" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="592" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">g = s</text>
<text x="592" y="76" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">不归一化</text>
<line x1="532" y1="64" x2="545" y2="64" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" marker-end="url(#ah-muted)"/>
<line x1="638" y1="64" x2="656" y2="64" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" marker-end="url(#ah-muted)"/>
<text x="660" y="60" font-size="12" fill="var(--fig-muted, #74716A)">× 16</text>
<text x="660" y="76" font-size="11" fill="var(--fig-muted, #74716A)">（代码）</text>
<line x1="16" y1="116" x2="704" y2="116" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="142" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="600">V3（sigmoid，偏置只管选，节点受限，选中后归一化）</text>
<text x="16" y="166" font-size="12" fill="var(--fig-violet, #6733C4)">选择支路：决定“去哪几个专家”</text>
<rect x="16" y="176" width="92" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.12" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="62" y="197" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">logit</text>
<text x="62" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">256 个 z<tspan baseline-shift="sub" font-size="11">i</tspan></text>
<rect x="122" y="176" width="92" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.12" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="168" y="197" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">sigmoid</text>
<text x="168" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">s<tspan baseline-shift="sub" font-size="11">i</tspan> ∈ (0, 1)</text>
<line x1="108" y1="200" x2="121" y2="200" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="228" y="176" width="92" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.12" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="274" y="197" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">+ 偏置 b<tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="274" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">s<tspan baseline-shift="sub" font-size="11">i</tspan> + b<tspan baseline-shift="sub" font-size="11">i</tspan></text>
<line x1="214" y1="200" x2="227" y2="200" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="334" y="176" width="92" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.12" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="380" y="197" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">节点打分</text>
<text x="380" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">最大 2 个之和</text>
<line x1="320" y1="200" x2="333" y2="200" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="440" y="176" width="92" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.12" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="486" y="197" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">选 4 个节点</text>
<text x="486" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">M = 4</text>
<line x1="426" y1="200" x2="439" y2="200" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<rect x="546" y="176" width="92" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.12" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="592" y="197" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">Top-8</text>
<text x="592" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">在 4 个节点内</text>
<line x1="532" y1="200" x2="545" y2="200" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" marker-end="url(#ah-violet)"/>
<text x="16" y="270" font-size="12" fill="var(--fig-green, #16704A)">权重支路：决定“各占多少”</text>
<rect x="122" y="280" width="92" height="48" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="168" y="301" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">取 8 个的 s</text>
<text x="168" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">不含 b</text>
<rect x="258" y="280" width="106" height="48" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="311" y="301" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">归一化</text>
<text x="311" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">g<tspan baseline-shift="sub" font-size="11">i</tspan> = s<tspan baseline-shift="sub" font-size="11">i</tspan> / Σ s<tspan baseline-shift="sub" font-size="11">j</tspan></text>
<rect x="394" y="280" width="92" height="48" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="440" y="301" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">× 2.5</text>
<text x="440" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">（代码）</text>
<rect x="530" y="280" width="92" height="48" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="576" y="301" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">加权求和</text>
<text x="576" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">Σ g<tspan baseline-shift="sub" font-size="11">i</tspan>·FFN<tspan baseline-shift="sub" font-size="11">i</tspan>(<tspan font-weight="700">u</tspan>)</text>
<line x1="214" y1="304" x2="257" y2="304" stroke="var(--fig-green, #16704A)" stroke-width="1.3" marker-end="url(#ah-green)"/>
<line x1="364" y1="304" x2="393" y2="304" stroke="var(--fig-green, #16704A)" stroke-width="1.3" marker-end="url(#ah-green)"/>
<line x1="486" y1="304" x2="529" y2="304" stroke="var(--fig-green, #16704A)" stroke-width="1.3" marker-end="url(#ah-green)"/>
<line x1="168" y1="224" x2="168" y2="279" stroke="var(--fig-green, #16704A)" stroke-width="1.4" marker-end="url(#ah-green)"/>
<text x="162" y="240" font-size="11" fill="var(--fig-green, #16704A)" text-anchor="end">原始 s</text>
<path d="M592.0 224 V 246 H 198 V 279" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ah-violet)"/>
<text x="588" y="240" font-size="11" fill="var(--fig-violet, #6733C4)" text-anchor="end">只传下标（哪 8 个）</text>
<line x1="274" y1="224" x2="274" y2="262" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="267" y1="255" x2="281" y2="269" stroke="var(--fig-red, #A3231C)" stroke-width="2"/>
<line x1="267" y1="269" x2="281" y2="255" stroke="var(--fig-red, #A3231C)" stroke-width="2"/>
<text x="284" y="266" font-size="11" fill="var(--fig-red, #A3231C)">b 不进入门控值</text>
<text x="16" y="366" font-size="12" fill="var(--fig-ink, #1C1B19)">要点：V3 把“选谁”和“给多少权重”拆成两条支路。偏置 b 只改变选择（紫色），</text>
<text x="16" y="386" font-size="12" fill="var(--fig-ink, #1C1B19)">门控值只由原始亲和度决定（绿色）；V2 的 softmax 让每个门控值都依赖全部 160 个 logit。</text>
</svg>
