<text x="566" y="148" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">↓ 调低</text>
<text x="628" y="148" font-size="13" fill="var(--fig-muted, #74716A)">+0.1</text>
<text x="678" y="148" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">0.0</text>
<text x="380" y="192" font-size="13" fill="var(--fig-ink, #1C1B19)">2</text>
<text x="426" y="192" font-size="13" fill="var(--fig-blue, #1F5FA8)">2</text>
<text x="476" y="192" font-size="13" fill="var(--fig-ink, #1C1B19)">+1</text>
<text x="566" y="192" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">↑ 调高</text>
<text x="628" y="192" font-size="13" fill="var(--fig-muted, #74716A)">-0.2</text>
<text x="678" y="192" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">-0.1</text>
<text x="380" y="236" font-size="13" fill="var(--fig-ink, #1C1B19)">3</text>
<text x="426" y="236" font-size="13" fill="var(--fig-blue, #1F5FA8)">1</text>
<text x="476" y="236" font-size="13" fill="var(--fig-ink, #1C1B19)">+2</text>
<text x="566" y="236" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">↑ 调高</text>
<text x="628" y="236" font-size="13" fill="var(--fig-muted, #74716A)">-0.1</text>
<text x="678" y="236" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">0.0</text>
<text x="380" y="280" font-size="13" fill="var(--fig-ink, #1C1B19)">4</text>
<text x="426" y="280" font-size="13" fill="var(--fig-red, #A3231C)">4</text>
<text x="476" y="280" font-size="13" fill="var(--fig-ink, #1C1B19)">-1</text>
<text x="566" y="280" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">↓ 调低</text>
<text x="628" y="280" font-size="13" fill="var(--fig-muted, #74716A)">-0.1</text>
<text x="678" y="280" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">-0.2</text>
<text x="380" y="330" font-size="12" fill="var(--fig-ink, #1C1B19)">过载专家（红）的偏置调低，下一步更难被选中；</text>
<text x="380" y="348" font-size="12" fill="var(--fig-ink, #1C1B19)">欠载专家（蓝）的偏置调高，下一步更容易被选中。</text>
<line x1="346" y1="190" x2="364" y2="190" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<path d="M 540 364 V 392 H 180 V 367" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.8" marker-end="url(#ah-violet)"/>
<text x="360" y="408" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">③ 下一步用新偏置做选择（只依赖已经过去的 batch，不偷看当前序列）</text>
