<line x1="70" y1="230" x2="276" y2="230" stroke="var(--fig-green, #16704A)" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="280" y="234" font-size="12" fill="var(--fig-green, #16704A)">均值 3</text>
<text x="38" y="230" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" transform="rotate(-90 38 230)">负载（token 数）</text>
<text x="30" y="356" font-size="12" fill="var(--fig-ink, #1C1B19)">MaxVio = (5 − 3)/3 ≈ 0.667</text>
<rect x="366" y="34" width="352" height="330" fill="var(--fig-violet, #6733C4)" fill-opacity="0.04" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="380" y="58" font-size="14" fill="var(--fig-violet, #6733C4)" font-weight="700">② 按负载更新偏置（γ = 0.1）</text>
<text x="380" y="80" font-size="12" fill="var(--fig-violet, #6733C4)">b<tspan baseline-shift="sub" font-size="11">i</tspan> ← b<tspan baseline-shift="sub" font-size="11">i</tspan> + γ · sign(均值 − 负载<tspan baseline-shift="sub" font-size="11">i</tspan>)</text>
<text x="380" y="112" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">专家</text>
