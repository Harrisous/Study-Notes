<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>偏置的反馈回路：按上一步的负载调整下一步的选择</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<rect x="16" y="34" width="330" height="330" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.04" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="30" y="58" font-size="14" fill="var(--fig-blue, #1F5FA8)" font-weight="700">① 训练一步</text>
<text x="30" y="80" font-size="12" fill="var(--fig-violet, #6733C4)">选择用 s + b（带偏置的 Top-2）</text>
<text x="30" y="98" font-size="12" fill="var(--fig-green, #16704A)">加权用 s（偏置不进入门控值）</text>
