<rect x="130" y="260" width="34" height="60" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.45" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="147" y="254" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">2</text>
<text x="147" y="338" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">专家 2</text>
