<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>矩阵吸收前后，一个头在一次解码步里的计算图</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-orange, #B4460C)"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="16" y="22" font-size="14" fill="var(--fig-red, #A3231C)" font-weight="700">① 每步重新展开：每解码一步，都把缓存里 T 个潜向量重新变回键和值</text>
<rect x="400" y="36" width="120" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="460" y="54" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700"><tspan font-weight="700">q</tspan><tspan dy="-5.2" font-size="11">C</tspan><tspan dy="9.1" font-size="11">t,i</tspan></text>
<text x="460" y="70" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[128]</text>
<rect x="210" y="92" width="110" height="42" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="265" y="111" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="700"><tspan font-weight="700">K</tspan><tspan dy="3.9" font-size="11">i</tspan></text>
<text x="265" y="127" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, 128]</text>
<rect x="400" y="92" width="120" height="42" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.14" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="460" y="111" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">分数 <tspan font-weight="700">K</tspan><tspan dy="3.9" font-size="11">i</tspan><tspan dy="-3.9" font-weight="700">q</tspan></text>
<text x="460" y="127" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T]</text>
<rect x="20" y="126" width="116" height="48" fill="var(--fig-orange, #B4460C)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="2.4" rx="6"/>
<text x="78" y="148" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="700">缓存 <tspan font-weight="700">C</tspan></text>
<text x="78" y="164" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, 512]</text>
<rect x="210" y="170" width="110" height="42" fill="var(--fig-green, #16704A)" fill-opacity="0.14" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="265" y="189" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700"><tspan font-weight="700">V</tspan><tspan dy="3.9" font-size="11">i</tspan></text>
<text x="265" y="205" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, 128]</text>
<rect x="400" y="170" width="120" height="42" fill="var(--fig-green, #16704A)" fill-opacity="0.14" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="460" y="189" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700"><tspan font-weight="700">o</tspan><tspan dy="3.9" font-size="11">t,i</tspan><tspan dy="-3.9"> = </tspan><tspan font-weight="700">V</tspan><tspan dy="3.9" font-size="11">i</tspan><tspan dy="-9.1" font-size="11">⊤</tspan><tspan dy="5.2" font-weight="700">p</tspan></text>
<text x="460" y="205" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[128]</text>
<rect x="590" y="170" width="150" height="42" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.14" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="665" y="189" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">× <tspan font-weight="700">W</tspan><tspan dy="-5.2" font-size="11">O</tspan><tspan dy="9.1" font-size="11">i</tspan></text>
<text x="665" y="205" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[5120 × 128] → [5120]</text>
<line x1="460" y1="76" x2="460" y2="92" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
