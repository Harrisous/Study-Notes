<line x1="136" y1="160" x2="210" y2="191" stroke="var(--fig-red, #A3231C)" stroke-width="2.2" marker-end="url(#ah-red)"/>
<text x="150" y="104" font-size="12" fill="var(--fig-red, #A3231C)">×(<tspan font-weight="700">W</tspan><tspan dy="-4.8" font-size="11">UK</tspan><tspan dy="8.4" font-size="11">i</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="11">⊤</tspan></text>
<text x="150" y="214" font-size="12" fill="var(--fig-red, #A3231C)">×(<tspan font-weight="700">W</tspan><tspan dy="-4.8" font-size="11">UV</tspan><tspan dy="8.4" font-size="11">i</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="11">⊤</tspan></text>
<line x1="460" y1="134" x2="460" y2="170" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="468" y="157" font-size="11.5" fill="var(--fig-muted, #74716A)">softmax → <tspan font-weight="700">p</tspan>  [T]</text>
<line x1="320" y1="191" x2="400" y2="191" stroke="var(--fig-green, #16704A)" stroke-width="1.6" marker-end="url(#ah-green)"/>
<line x1="520" y1="191" x2="590" y2="191" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="20" y="240" font-size="12.5" fill="var(--fig-red, #A3231C)">红色两步每一步都要做 T 次：2 · T · 512 · 128 × 2 次运算，缓存越长越贵。</text>
<text x="548" y="58" font-size="12" fill="var(--fig-ink, #1C1B19)">每层（128 头）每解码 1 个 token：</text>
<text x="548" y="76" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">33,636,352 × T 次运算</text>
<text x="548" y="100" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="700">T = 4096：137.8 GFLOPs</text>
<line x1="12" y1="262" x2="748" y2="262" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="292" font-size="14" fill="var(--fig-blue, #1F5FA8)" font-weight="700">③ 吸收：<tspan font-weight="700">W</tspan><tspan dy="-5.6" font-size="11">UK</tspan><tspan dy="9.8" font-size="11">i</tspan><tspan dy="-4.2"> 挪到查询一侧，</tspan><tspan font-weight="700">W</tspan><tspan dy="-5.6" font-size="11">UV</tspan><tspan dy="9.8" font-size="11">i</tspan><tspan dy="-4.2"> 挪到输出一侧，缓存原样使用</tspan></text>
<rect x="20" y="314" width="116" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="78" y="333" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700"><tspan font-weight="700">q</tspan><tspan dy="-5.2" font-size="11">C</tspan><tspan dy="9.1" font-size="11">t,i</tspan></text>
<text x="78" y="349" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[128]</text>
<rect x="210" y="314" width="110" height="42" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="265" y="333" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700"><tspan font-weight="700">q̃</tspan><tspan dy="3.9" font-size="11">t,i</tspan></text>
<text x="265" y="349" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[512]</text>
<rect x="400" y="314" width="120" height="42" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.14" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="460" y="333" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">分数 <tspan font-weight="700">C</tspan><tspan font-weight="700">q̃</tspan></text>
<text x="460" y="349" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T]</text>
<rect x="210" y="382" width="110" height="48" fill="var(--fig-orange, #B4460C)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="2.4" rx="6"/>
<text x="265" y="404" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="700">缓存 <tspan font-weight="700">C</tspan></text>
<text x="265" y="420" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, 512]</text>
<rect x="400" y="446" width="120" height="42" fill="var(--fig-orange, #B4460C)" fill-opacity="0.14" stroke="var(--fig-orange, #B4460C)" stroke-width="1.3" rx="6"/>
<text x="460" y="465" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="700"><tspan font-weight="700">õ</tspan><tspan dy="3.9" font-size="11">t,i</tspan><tspan dy="-3.9"> = </tspan><tspan font-weight="700">C</tspan><tspan dy="-5.2" font-size="11">⊤</tspan><tspan dy="5.2" font-weight="700">p</tspan></text>
<text x="460" y="481" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[512]</text>
<rect x="590" y="446" width="150" height="42" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.14" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="665" y="465" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700"><tspan font-weight="700">W</tspan><tspan dy="-5.2" font-size="11">UV</tspan><tspan dy="9.1" font-size="11">i</tspan><tspan dy="-3.9" font-weight="700">õ</tspan> → × <tspan font-weight="700">W</tspan><tspan dy="-5.2" font-size="11">O</tspan><tspan dy="9.1" font-size="11">i</tspan></text>
<text x="665" y="481" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">[128] → [5120]</text>
<line x1="136" y1="335" x2="210" y2="335" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.2" marker-end="url(#ah-blue)"/>
<text x="140" y="326" font-size="12" fill="var(--fig-blue, #1F5FA8)">×(<tspan font-weight="700">W</tspan><tspan dy="-4.8" font-size="11">UK</tspan><tspan dy="8.4" font-size="11">i</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="11">⊤</tspan></text>
<text x="142" y="354" font-size="12" fill="var(--fig-blue, #1F5FA8)">每步 1 次</text>
<line x1="320" y1="335" x2="400" y2="335" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<line x1="320" y1="396" x2="400" y2="350" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6" marker-end="url(#ah-orange)"/>
<line x1="320" y1="416" x2="400" y2="460" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6" marker-end="url(#ah-orange)"/>
<line x1="460" y1="356" x2="460" y2="446" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="468" y="406" font-size="11.5" fill="var(--fig-muted, #74716A)">softmax → <tspan font-weight="700">p</tspan>  [T]</text>
<line x1="520" y1="467" x2="590" y2="467" stroke="var(--fig-ink, #1C1B19)" stroke-width="2.2" marker-end="url(#ah-ink)"/>
<text x="530" y="508" font-size="12" fill="var(--fig-blue, #1F5FA8)">×<tspan font-weight="700">W</tspan><tspan dy="-4.8" font-size="11">UV</tspan><tspan dy="8.4" font-size="11">i</tspan><tspan dy="-3.6">：每步 1 次</tspan></text>
<text x="20" y="508" font-size="12.5" fill="var(--fig-orange, #B4460C)">缓存 <tspan font-weight="700">C</tspan> 被直接读两遍（打分、加权），从不展开。</text>
<text x="560" y="342" font-size="12" fill="var(--fig-ink, #1C1B19)">每层每解码 1 个 token：</text>
<text x="560" y="360" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">33,554,432 + 278,528 × T</text>
<text x="560" y="384" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="700">T = 4096：1.174 GFLOPs</text>
<text x="560" y="404" font-size="12" fill="var(--fig-blue, #1F5FA8)">是 ① 的 1/117</text>
