<rect x="117.56" y="268" width="378.44" height="32" fill="var(--fig-green, #16704A)" fill-opacity="0.62" stroke="var(--fig-green, #16704A)" stroke-width="1"/>
<text x="306.78" y="289" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.946</text>
<text x="548" y="289" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1.944</text>
<text x="616" y="289" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">2.024</text>
