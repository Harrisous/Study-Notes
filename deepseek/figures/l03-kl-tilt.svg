<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>KL 约束下的最优策略：参考分布按 exp(r/β) 倾斜</title>

<text x="16" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" font-weight="600">三个回答的奖励 r = 0、1、2；每一行是一个概率分布（总长 = 1）</text>
<rect x="96" y="38" width="16" height="12" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1"/>
<text x="118" y="49" font-size="12" fill="var(--fig-ink, #1C1B19)">回答 1（r = 0）</text>
<rect x="236" y="38" width="16" height="12" fill="var(--fig-green, #16704A)" fill-opacity="0.3" stroke="var(--fig-green, #16704A)" stroke-width="1"/>
<text x="258" y="49" font-size="12" fill="var(--fig-ink, #1C1B19)">回答 2（r = 1）</text>
<rect x="376" y="38" width="16" height="12" fill="var(--fig-green, #16704A)" fill-opacity="0.62" stroke="var(--fig-green, #16704A)" stroke-width="1"/>
<text x="398" y="49" font-size="12" fill="var(--fig-ink, #1C1B19)">回答 3（r = 2）</text>
<text x="548" y="80" font-size="12.5" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">E[r]</text>
<text x="616" y="80" font-size="12.5" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">KL</text>
<text x="690" y="80" font-size="12.5" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">目标值</text>
<text x="86" y="114" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">π<tspan baseline-shift="sub" font-size="11">ref</tspan></text>
<rect x="96" y="92" width="240" height="32" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1"/>
