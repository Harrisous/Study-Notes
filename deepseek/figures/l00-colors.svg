<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 394" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>全课统一的图色语义</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<rect x="6" y="7" width="728" height="44" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.5" rx="6"/>
<rect x="18" y="16" width="44" height="24" fill="var(--fig-blue, #1F5FA8)" rx="4"/>
<text x="80" y="24" font-size="13.5" fill="var(--fig-blue, #1F5FA8)" font-weight="700">蓝</text>
<text x="122" y="24" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-blue</text>
<text x="80" y="43" font-size="12.5" fill="var(--fig-ink, #1C1B19)">查询 Q、当前 token、“正在计算的东西”、被激活的路由专家</text>
<rect x="658" y="18" width="44" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.15" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.4" rx="4"/>
<text x="680" y="34" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">q<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<rect x="18" y="62" width="44" height="24" fill="var(--fig-violet, #6733C4)" rx="4"/>
<text x="80" y="70" font-size="13.5" fill="var(--fig-violet, #6733C4)" font-weight="700">紫</text>
<text x="122" y="70" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-violet</text>
<text x="80" y="89" font-size="12.5" fill="var(--fig-ink, #1C1B19)">键 K、路由打分（含 indexer）、共享专家</text>
<rect x="658" y="64" width="44" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.15" stroke="var(--fig-violet, #6733C4)" stroke-width="1.4" rx="4"/>
<text x="680" y="80" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="700">k<tspan baseline-shift="sub" font-size="11">j</tspan></text>
<rect x="6" y="99" width="728" height="44" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.5" rx="6"/>
<rect x="18" y="108" width="44" height="24" fill="var(--fig-green, #16704A)" rx="4"/>
<text x="80" y="116" font-size="13.5" fill="var(--fig-green, #16704A)" font-weight="700">绿</text>
<text x="122" y="116" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-green</text>
<text x="80" y="135" font-size="12.5" fill="var(--fig-ink, #1C1B19)">值 V、输出、正奖励、“好的 / 保留的”</text>
<rect x="658" y="110" width="44" height="22" fill="var(--fig-green, #16704A)" fill-opacity="0.15" stroke="var(--fig-green, #16704A)" stroke-width="1.4" rx="4"/>
<text x="680" y="126" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">v<tspan baseline-shift="sub" font-size="11">j</tspan></text>
<rect x="18" y="154" width="44" height="24" fill="var(--fig-amber, #8A6508)" rx="4"/>
<text x="80" y="162" font-size="13.5" fill="var(--fig-amber, #8A6508)" font-weight="700">黄褐</text>
<text x="122" y="162" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-amber</text>
<text x="80" y="181" font-size="12.5" fill="var(--fig-ink, #1C1B19)">缓存、存储、记忆（KV cache、状态、内存层级）</text>
<rect x="656" y="156" width="10" height="22" fill="var(--fig-amber, #8A6508)" fill-opacity="0.25" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="2"/>
<rect x="668" y="156" width="10" height="22" fill="var(--fig-amber, #8A6508)" fill-opacity="0.4" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="2"/>
<rect x="680" y="156" width="10" height="22" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="2"/>
<rect x="692" y="156" width="10" height="22" fill="var(--fig-amber, #8A6508)" fill-opacity="0.7" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="2"/>
<rect x="6" y="191" width="728" height="44" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.5" rx="6"/>
<rect x="18" y="200" width="44" height="24" fill="var(--fig-orange, #B4460C)" rx="4"/>
<text x="80" y="208" font-size="13.5" fill="var(--fig-orange, #B4460C)" font-weight="700">橙</text>
<text x="122" y="208" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-orange</text>
<text x="80" y="227" font-size="12.5" fill="var(--fig-ink, #1C1B19)">压缩后的潜在表示（c<tspan baseline-shift="super" font-size="11">KV</tspan>）、量化后的低精度数据</text>
<rect x="672" y="201" width="16" height="24" fill="var(--fig-orange, #B4460C)" fill-opacity="0.3" stroke="var(--fig-orange, #B4460C)" stroke-width="1.4" rx="3"/>
<text x="693" y="218" font-size="13" fill="var(--fig-orange, #B4460C)" font-weight="700">c</text>
<rect x="18" y="246" width="44" height="24" fill="var(--fig-red, #A3231C)" rx="4"/>
<text x="80" y="254" font-size="13.5" fill="var(--fig-red, #A3231C)" font-weight="700">红</text>
<text x="122" y="254" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-red</text>
<text x="80" y="273" font-size="12.5" fill="var(--fig-ink, #1C1B19)">被掩掉、被丢弃、错误、负奖励；细线表示 RoPE 位置分支</text>
<rect x="669" y="248" width="22" height="22" fill="var(--fig-red, #A3231C)" fill-opacity="0.12" stroke="var(--fig-red, #A3231C)" stroke-width="1.2" rx="2"/>
<line x1="673" y1="252" x2="687" y2="266" stroke="var(--fig-red, #A3231C)" stroke-width="1.8"/>
<line x1="673" y1="266" x2="687" y2="252" stroke="var(--fig-red, #A3231C)" stroke-width="1.8"/>
<rect x="6" y="283" width="728" height="44" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.5" rx="6"/>
<rect x="18" y="292" width="44" height="24" fill="var(--fig-muted, #74716A)" rx="4"/>
<text x="80" y="300" font-size="13.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">灰</text>
<text x="122" y="300" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-muted / rule / grid</text>
<text x="80" y="319" font-size="12.5" fill="var(--fig-ink, #1C1B19)">未激活的专家、背景结构、坐标网格</text>
<rect x="655" y="297" width="14" height="16" fill="var(--fig-muted, #74716A)" fill-opacity="0.25" stroke="var(--fig-muted, #74716A)" stroke-width="1" rx="2"/>
<rect x="672" y="297" width="14" height="16" fill="var(--fig-muted, #74716A)" fill-opacity="0.25" stroke="var(--fig-muted, #74716A)" stroke-width="1" rx="2"/>
<rect x="689" y="297" width="14" height="16" fill="var(--fig-muted, #74716A)" fill-opacity="0.25" stroke="var(--fig-muted, #74716A)" stroke-width="1" rx="2"/>
<rect x="18" y="338" width="44" height="24" fill="var(--fig-ink, #1C1B19)" rx="4"/>
<text x="80" y="346" font-size="13.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">墨</text>
<text x="122" y="346" font-size="11.5" fill="var(--fig-muted, #74716A)">--fig-ink</text>
<text x="80" y="365" font-size="12.5" fill="var(--fig-ink, #1C1B19)">文字、主要线条、箭头</text>
<line x1="656" y1="351" x2="702" y2="351" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
</svg>
