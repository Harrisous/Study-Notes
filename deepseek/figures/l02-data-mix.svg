<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>GPT-3 的数据配比：数据量占比与训练采样权重</title>

<text x="186" y="24" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">每个数据集：</text>
<rect x="270" y="14" width="14" height="12" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="290" y="24" font-size="12" fill="var(--fig-ink, #1C1B19)">占总 token 数的比例</text>
<rect x="420" y="14" width="14" height="12" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="440" y="24" font-size="12" fill="var(--fig-ink, #1C1B19)">训练时的采样权重</text>
<text x="632" y="50" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">300B 时看了几遍</text>
<text x="596" y="66" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">论文印</text>
<text x="672" y="66" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">按权重复算</text>
<line x1="186" y1="56" x2="186" y2="290" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="186" y="306" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0%</text>
<line x1="256.59" y1="56" x2="256.59" y2="290" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="256.59" y="306" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">20%</text>
<line x1="327.18" y1="56" x2="327.18" y2="290" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="327.18" y="306" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">40%</text>
<line x1="397.76" y1="56" x2="397.76" y2="290" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="397.76" y="306" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">60%</text>
<line x1="468.35" y1="56" x2="468.35" y2="290" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="468.35" y="306" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">80%</text>
<text x="16" y="80" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Common Crawl（过滤后）</text>
<text x="16" y="96" font-size="12" fill="var(--fig-muted, #74716A)">410B token</text>
<rect x="186" y="64" width="289.99" height="13" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="480.99" y="75" font-size="11" fill="var(--fig-muted, #74716A)">82.2%</text>
<rect x="186" y="80" width="211.76" height="13" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="402.76" y="91" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">60%</text>
<text x="596" y="84" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.44</text>
<text x="672" y="84" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.44</text>
<text x="16" y="126" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">WebText2</text>
<text x="16" y="142" font-size="12" fill="var(--fig-muted, #74716A)">19B token</text>
<rect x="186" y="110" width="13.44" height="13" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="204.44" y="121" font-size="11" fill="var(--fig-muted, #74716A)">3.8%</text>
<rect x="186" y="126" width="77.65" height="13" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="268.65" y="137" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">22%</text>
<text x="596" y="130" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">2.9</text>
<text x="672" y="130" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">3.47</text>
<text x="16" y="172" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Books1</text>
<text x="16" y="188" font-size="12" fill="var(--fig-muted, #74716A)">12B token</text>
<rect x="186" y="156" width="8.49" height="13" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="199.49" y="167" font-size="11" fill="var(--fig-muted, #74716A)">2.4%</text>
<rect x="186" y="172" width="28.24" height="13" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="219.24" y="183" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">8%</text>
<text x="596" y="176" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">1.9</text>
<text x="672" y="176" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">2.00</text>
<text x="16" y="218" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Books2</text>
<text x="16" y="234" font-size="12" fill="var(--fig-muted, #74716A)">55B token</text>
<rect x="186" y="202" width="38.9" height="13" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="229.9" y="213" font-size="11" fill="var(--fig-muted, #74716A)">11.0%</text>
<rect x="186" y="218" width="28.24" height="13" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="219.24" y="229" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">8%</text>
<text x="596" y="222" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.43</text>
<text x="672" y="222" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.44</text>
<text x="16" y="264" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Wikipedia</text>
<text x="16" y="280" font-size="12" fill="var(--fig-muted, #74716A)">3B token</text>
<rect x="186" y="248" width="2.12" height="13" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="193.12" y="259" font-size="11" fill="var(--fig-muted, #74716A)">0.6%</text>
<rect x="186" y="264" width="10.59" height="13" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="201.59" y="275" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">3%</text>
<text x="596" y="268" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">3.4</text>
<text x="672" y="268" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">3.00</text>
<text x="16" y="326" font-size="12" fill="var(--fig-ink, #1C1B19)">蓝条长于灰条 = 被“过采样”：WebText2 只占 3.8% 的数据，却占 22% 的训练，看了约 3 遍；</text>
<text x="16" y="344" font-size="12" fill="var(--fig-ink, #1C1B19)">Common Crawl 占 82% 的数据，只占 60% 的训练，连一遍都没看完（0.44 遍）。</text>
<text x="16" y="362" font-size="12" fill="var(--fig-red, #A3231C)">红字：论文印的遍数与“权重 × 300B ÷ 数据量”复算不一致；印刷的五个权重加起来是 101%。</text>
</svg>
