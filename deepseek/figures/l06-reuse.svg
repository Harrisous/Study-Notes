<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>三个预算 D、2D、4D：cosine 各训一次 vs 多步调度共用第一阶段</title>

<line x1="110" y1="30" x2="110" y2="372" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="110" y="388" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<line x1="240" y1="30" x2="240" y2="372" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="240" y="388" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1D</text>
<line x1="370" y1="30" x2="370" y2="372" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="370" y="388" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">2D</text>
<line x1="500" y1="30" x2="500" y2="372" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="500" y="388" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">3D</text>
<line x1="630" y1="30" x2="630" y2="372" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="630" y="388" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">4D</text>
<text x="20" y="44" font-size="13" fill="var(--fig-muted, #74716A)" font-weight="600">cosine</text>
<text x="20" y="60" font-size="12" fill="var(--fig-muted, #74716A)">各训一次</text>
<rect x="110" y="40" width="130" height="16" fill="var(--fig-muted, #74716A)" fill-opacity="0.22" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="248" y="52" font-size="12" fill="var(--fig-muted, #74716A)">1D</text>
<rect x="110" y="66" width="260" height="16" fill="var(--fig-muted, #74716A)" fill-opacity="0.22" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="378" y="78" font-size="12" fill="var(--fig-muted, #74716A)">2D</text>
<rect x="110" y="92" width="520" height="16" fill="var(--fig-muted, #74716A)" fill-opacity="0.22" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="638" y="104" font-size="12" fill="var(--fig-muted, #74716A)">4D</text>
<text x="670" y="70" font-size="13" fill="var(--fig-muted, #74716A)" font-weight="600">合计 7D</text>
<text x="20" y="194" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">多步</text>
<text x="20" y="210" font-size="12" fill="var(--fig-blue, #1F5FA8)">80/10/10</text>
<rect x="110" y="182" width="416" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.35" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="118" y="176" font-size="12" fill="var(--fig-blue, #1F5FA8)">第一阶段（峰值学习率），只训一次：0 → 3.2D</text>
