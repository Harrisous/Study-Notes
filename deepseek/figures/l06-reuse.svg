<rect x="318" y="266" width="26" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.18" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<rect x="344" y="266" width="26" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="378" y="278" font-size="12" fill="var(--fig-blue, #1F5FA8)">预算 2D：尾巴 0.4D</text>
<text x="312" y="278" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">1.6D 处分叉</text>
<rect x="526" y="306" width="52" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.18" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<rect x="578" y="306" width="52" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="638" y="318" font-size="12" fill="var(--fig-blue, #1F5FA8)">预算 4D：尾巴 0.8D</text>
<text x="520" y="318" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">3.2D 处分叉</text>
<text x="110" y="360" font-size="12" fill="var(--fig-muted, #74716A)">尾巴里浅蓝两段：前 10% 用峰值的 31.6%，后 10% 用 10%。</text>
<text x="670" y="194" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">合计 4.6D</text>
<text x="670" y="212" font-size="13" fill="var(--fig-green, #16704A)" font-weight="600">省 34.3%</text>
