<path d="M526.0 198.0 V 314.0" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" stroke-dasharray="3 2"/>
<circle cx="526" cy="190" r="3.5" fill="var(--fig-blue, #1F5FA8)"/>
<rect x="214" y="226" width="13" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.18" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
