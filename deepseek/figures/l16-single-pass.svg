<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>V4 的多趟 mHC 与 V4.1-Flash 的 Single-Pass mHC</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker></defs>
<text x="14" y="26" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">(a) V4：三个串行的核（每个子层）</text>
<rect x="14" y="44" width="200" height="58" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="114" y="68.91" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">核 1：更新残差流</text>
<text x="114" y="86.45" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> = B<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan> + C<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan><tspan font-weight="700">Y</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan></text>
<text x="114" y="122" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">读 (n+1)d</text>
<rect x="262" y="44" width="200" height="58" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="362" y="68.91" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">核 2：算系数</text>
<text x="362" y="86.45" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">(A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>, B<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>, C<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>) = 𝓗(<tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>)</text>
<text x="362" y="122" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">读 nd</text>
<rect x="510" y="44" width="236" height="58" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="628" y="68.91" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">核 3：输入混合</text>
<text x="628" y="86.45" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">X̂</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> = A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan></text>
<text x="628" y="122" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">读 nd</text>
<line x1="214" y1="73" x2="260" y2="73" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<line x1="462" y1="73" x2="508" y2="73" stroke="var(--fig-red, #A3231C)" stroke-width="1.8" marker-end="url(#ah-red)"/>
<text x="485" y="152" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">必须等待：A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> 要先对整条 <tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan></text>
<text x="485" y="170" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">（16384 个数）做完归约才能得到</text>
<text x="14" y="152" font-size="12" fill="var(--fig-ink, #1C1B19)">三个核共写 (n+1)d；再加子层自己的 pre-norm 一读一写</text>
<text x="14" y="170" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">合计 (4n+4)d = 20d：残差流被从显存读了三遍</text>
<line x1="14" y1="196" x2="746" y2="196" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="14" y="222" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">(b) V4.1-Flash：Single-Pass，一次遍历（按 tile 流式处理）</text>
<rect x="14" y="240" width="732" height="126" fill="var(--fig-green, #16704A)" fill-opacity="0.06" stroke="var(--fig-green, #16704A)" stroke-width="1.4" rx="8"/>
<text x="28" y="262" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一个核：对 <tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan> 的每一小块（tile）依次做三件事，中间结果留在片上</text>
<rect x="30" y="276" width="216" height="56" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="138" y="300.22" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">① 更新残差流</text>
<text x="138" y="316.42" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> = B<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan> + C<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan><tspan font-weight="700">Y</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan></text>
<rect x="270" y="276" width="216" height="56" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="378" y="300.22" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">② 用上一层给的 A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan> 混合</text>
<text x="378" y="316.42" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">X̂</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> = A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan></text>
<rect x="510" y="276" width="216" height="56" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="6"/>
<text x="618" y="300.22" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">③ 累加下一层的系数</text>
<text x="618" y="316.42" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan><tspan font-weight="700">W</tspan> 的部分和 → (A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>, B<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>, C<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan>)</text>
<line x1="246" y1="304" x2="268" y2="304" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<line x1="486" y1="304" x2="508" y2="304" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="380" y="354" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle">每个 tile 只读一次、写一次：读 (n+1)d（<tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan> 与 <tspan font-weight="700">Y</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan>），写 (n+1)d（<tspan font-weight="700">X</tspan><tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan></tspan> 与子层输入）</text>
<text x="14" y="396" font-size="12" fill="var(--fig-ink, #1C1B19)">代价：子层 <tspan font-style="italic">l</tspan> 的输入混合用的是子层 <tspan font-style="italic">l</tspan>−1 预测的 A<tspan baseline-shift="sub" font-size="11"><tspan font-style="italic">l</tspan>−1</tspan>，“推迟一格”。论文称实测性能损失可以忽略（未给数字）。</text>
<text x="14" y="416" font-size="12" fill="var(--fig-ink, #1C1B19)">合计 (2n+2)d = 10d = 访存下界，是多趟实现的一半；第一个子层没有“上一层”，代码用 one-hot 的 <tspan font-weight="700">e</tspan><tspan baseline-shift="sub" font-size="11">0</tspan>（只读第 0 条流）。</text>
<text x="14" y="436" font-size="12" fill="var(--fig-muted, #74716A)">预训练仍用多核实现；部署时用单核的 Mega-mHC。“读、写各 (n+1)d”据 V4.1 论文 §2.4.1。</text>
</svg>
