<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>RoPE 最慢的一对维度：4K 训练见过的角度、128K 直接外推的角度、YaRN 之后的角度</title>

<text x="95" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">快的一对 i = 0</text>
<text x="95" y="216" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">4K 内转了 652 圈，</text>
<text x="95" y="234" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">每个角度都见过很多次</text>
<text x="285" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">慢的一对 i = 31</text>
<text x="285" y="216" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">4K 内只转到 31.3°，</text>
<text x="285" y="234" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">训练只见过这一小段</text>
<text x="475" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">i = 31 直接用到 128K</text>
<text x="475" y="216" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">转了 2.78 圈，</text>
<text x="475" y="234" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">31.3° 以外的角度全没见过</text>
<text x="665" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">i = 31 用 YaRN（θ ÷ 40）</text>
<text x="665" y="216" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">128K 只转到 25.0°，</text>
<text x="665" y="234" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">160K 恰好 31.3°</text>
