<text x="30" y="422" font-size="12" fill="var(--fig-orange, #B4460C)" font-weight="600">橙线 IB：每个目标节点只发一次</text>
<text x="242" y="422" font-size="12" fill="var(--fig-orange, #B4460C)">（50 GB/s；dispatch 的数据是 FP8）</text>
<text x="30" y="444" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">蓝弧 NVLink：到达后在节点内转发（160 GB/s）</text>
<text x="30" y="300" font-size="12" fill="var(--fig-ink, #1C1B19)">不限节点：最多要经 IB 发 8 份（8t）</text>
<text x="30" y="322" font-size="12" fill="var(--fig-ink, #1C1B19)">限制 M = 4：IB 至多发 4 份（4t），通信减半</text>
<text x="30" y="344" font-size="12" fill="var(--fig-ink, #1C1B19)">每次 IB 到达后，节点内顺带扇出 160/50 = 3.2 个专家</text>
<text x="30" y="366" font-size="12" fill="var(--fig-ink, #1C1B19)">最多可选 4 × 3.2 ≈ 13 个而通信开销不变（实际 8 个）</text>
<text x="30" y="388" font-size="12" fill="var(--fig-muted, #74716A)">通信内核只用 132 个 SM 中的 20 个（10 个通道）</text>
