<text x="294" y="159" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">x<tspan baseline-shift="sub" font-size="11">t+4</tspan></text>
<text x="30" y="94" font-size="12" fill="var(--fig-violet, #6733C4)">第 i 个头只看 <tspan font-weight="700">z</tspan><tspan baseline-shift="sub" font-size="11">t</tspan>：学的是 p(x<tspan baseline-shift="sub" font-size="11">t+i</tspan> | x<tspan baseline-shift="sub" font-size="11">≤t</tspan>)</text>
<text x="30" y="112" font-size="12" fill="var(--fig-muted, #74716A)">各头给定 <tspan font-weight="700">z</tspan><tspan baseline-shift="sub" font-size="11">t</tspan> 后相互独立，彼此看不到对方的预测</text>
<text x="30" y="432" font-size="12" fill="var(--fig-ink, #1C1B19)">参数匹配：头多加 n − 1 层，主干就减 n − 1 层</text>
<text x="30" y="452" font-size="12" fill="var(--fig-muted, #74716A)">附录 B 的“因果”变体（头串联、但不喂真实 token）：</text>
<text x="30" y="470" font-size="12" fill="var(--fig-muted, #74716A)">MBPP@1 31.9，低于并行头的 33.8（表 S4）</text>
