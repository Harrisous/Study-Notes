<text x="375" y="388.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">I<tspan baseline-shift="-2.6" font-size="11">t,s</tspan> = Σ<tspan baseline-shift="-2.6" font-size="11">j</tspan> w<tspan baseline-shift="-2.6" font-size="11">t,j</tspan> · ReLU(q<tspan baseline-shift="-2.6" font-size="11">t,j</tspan> · k<tspan baseline-shift="-2.6" font-size="11">s</tspan>)</text>
