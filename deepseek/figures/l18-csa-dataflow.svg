<text x="375" y="69.32" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">16 组 × (4096 → 1024) → 拼成 16,384 → 7168</text>
<line x1="375" y1="110" x2="375" y2="82" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
