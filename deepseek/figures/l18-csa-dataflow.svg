<text x="133" y="159.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">W</tspan><tspan baseline-shift="4.8" font-size="11">UQ</tspan>：主查询</text>
<text x="133" y="175.32" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">128 头 × 512 维</text>
