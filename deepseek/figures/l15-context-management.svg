<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>测试时的上下文管理：触发点与三种策略</title>
<defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<text x="584" y="22" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">BrowseComp 得分</text>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">一条搜索轨迹逐步填满 128K 窗口</text>
<text x="16" y="69" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">触发时的上下文</text>
<rect x="150" y="58" width="410" height="24" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="3"/>
