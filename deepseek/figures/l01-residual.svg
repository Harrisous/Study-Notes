<text x="10" y="286" font-size="12.5" fill="var(--fig-ink, #1C1B19)">前向：<tspan font-weight="700">h</tspan><tspan baseline-shift="super" font-size="11">(12)</tspan> = <tspan font-weight="700">h</tspan><tspan baseline-shift="super" font-size="11">(0)</tspan> + Σ<tspan baseline-shift="sub" font-size="11">l=1</tspan><tspan baseline-shift="super" font-size="11" dx="-15.4">12</tspan><tspan dx="3.3">（</tspan><tspan font-weight="700">u</tspan><tspan baseline-shift="super" font-size="11">(l)</tspan> + <tspan font-weight="700">m</tspan><tspan baseline-shift="super" font-size="11">(l)</tspan>）。每个工位只加不改：它读得到前面所有工位写下的东西，</text>
<text x="10" y="308" font-size="12.5" fill="var(--fig-ink, #1C1B19)">却擦不掉它们，除非自己写一个方向相反的增量。反向：梯度沿传送带原样流回，∂<tspan font-weight="700">h</tspan><tspan baseline-shift="super" font-size="11">(12)</tspan>/∂<tspan font-weight="700">h</tspan><tspan baseline-shift="super" font-size="11">(l)</tspan> = I + （经过工位的各项）。</text>
