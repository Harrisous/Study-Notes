<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>残差流是一条传送带：每个子层读一份、加回一个增量</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<text x="10" y="24" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">残差流 = 嵌入 + 所有子层写回的增量之和（GPT-2 small：12 块 × 2 个子层 = 24 个“工位”）</text>
<line x1="56" y1="160" x2="712" y2="160" stroke="var(--fig-ink, #1C1B19)" stroke-width="5"/>
<line x1="712" y1="160" x2="736" y2="160" stroke="var(--fig-ink, #1C1B19)" stroke-width="5" marker-end="url(#ah-ink)"/>
<text x="48" y="165" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600"><tspan font-weight="700">h</tspan><tspan baseline-shift="super" font-size="11">(0)</tspan></text>
<text x="742" y="148" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600"><tspan font-weight="700">h</tspan><tspan baseline-shift="super" font-size="11">(12)</tspan></text>
<text x="10" y="46" font-size="12" fill="var(--fig-muted, #74716A)">传送带上的“件”：每个位置一条 768 维向量，从左往右流；工位先经 LN 读一份，算完把增量加回（⊕）</text>
