<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>残差流每个 token、每个子层的访存量（n = 4）</title>

<text x="20" y="24" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">每个 token、每个子层读写的元素数（以 d 为单位，n = 4）</text>
<line x1="250" y1="64" x2="250" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="250" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<line x1="301.67" y1="64" x2="301.67" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="301.67" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">6d</text>
<line x1="353.33" y1="64" x2="353.33" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="353.33" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">12d</text>
<line x1="405" y1="64" x2="405" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="405" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">18d</text>
<line x1="456.67" y1="64" x2="456.67" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="456.67" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">24d</text>
<line x1="508.33" y1="64" x2="508.33" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="508.33" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">30d</text>
<line x1="560" y1="64" x2="560" y2="318" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="560" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">36d</text>
<text x="630" y="44" font-size="12" fill="var(--fig-muted, #74716A)">V4.1-Flash 的字节数</text>
<text x="630" y="60" font-size="12" fill="var(--fig-muted, #74716A)">（d = 5120，bf16）</text>
<text x="240" y="87" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">普通残差</text>
<text x="240" y="103" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">读 2d + 写 d</text>
<rect x="250" y="74" width="25.83" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.55" rx="3"/>
<text x="281.83" y="94" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">3d</text>
<text x="630" y="94" font-size="12" fill="var(--fig-ink, #1C1B19)">30,720 字节</text>
<text x="240" y="139" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">HC，未融合（mHC 表 2）</text>
<text x="240" y="155" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">读 21d + 写 13d，另 48 个系数</text>
<rect x="250" y="126" width="292.78" height="30" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" rx="3"/>
<text x="548.78" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">34d + 48</text>
<text x="630" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)">348,256 字节</text>
<text x="240" y="191" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">V4 的 mHC：多趟（三个核）</text>
<text x="240" y="207" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">(4n+4)d，含子层的 pre-norm</text>
<rect x="250" y="178" width="172.22" height="30" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" rx="3"/>
<text x="428.22" y="198" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">20d</text>
<text x="630" y="198" font-size="12" fill="var(--fig-ink, #1C1B19)">204,800 字节</text>
<text x="240" y="243" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">Mega-mHC：单核</text>
<text x="240" y="259" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">(3n+2)d</text>
<rect x="250" y="230" width="120.56" height="30" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" rx="3"/>
<text x="376.56" y="250" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">14d</text>
<text x="630" y="250" font-size="12" fill="var(--fig-ink, #1C1B19)">143,360 字节</text>
<text x="240" y="295" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">V4.1 Single-Pass mHC</text>
<text x="240" y="311" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">(2n+2)d = 下界</text>
<rect x="250" y="282" width="86.11" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.55" rx="3"/>
<text x="342.11" y="302" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">10d</text>
<text x="630" y="302" font-size="12" fill="var(--fig-ink, #1C1B19)">102,400 字节</text>
<text x="20" y="368" font-size="12" fill="var(--fig-muted, #74716A)">表 2 不含子层自己的 pre-norm；V4.1 的三个数含 pre-norm 的一读一写（2d）。字节数按 bf16 换算，是笔者的假设。</text>
</svg>
