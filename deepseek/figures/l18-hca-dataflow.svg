<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>HCA 的数据流（V4-Pro 维度）</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-orange, #B4460C)"/></marker></defs>
<rect x="24" y="420" width="190" height="36" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="119" y="442.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">查询 token：<tspan font-weight="700">h</tspan><tspan baseline-shift="-2.6" font-size="11">t</tspan>（7168）</text>
<rect x="506" y="420" width="194" height="36" fill="var(--fig-muted, #74716A)" fill-opacity="0.1" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="603" y="442.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">历史 token：<tspan font-weight="700">h</tspan><tspan baseline-shift="-2.6" font-size="11">τ</tspan>，τ ≤ t</text>
<rect x="506" y="330" width="194" height="50" fill="var(--fig-orange, #B4460C)" fill-opacity="0.1" stroke="var(--fig-orange, #B4460C)" stroke-width="1.3" rx="6"/>
<text x="603" y="350.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">压缩器：m′ = 128，不重叠</text>
<text x="603" y="367.82" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">一路投影 + 逐通道 softmax</text>
<line x1="603" y1="420" x2="603" y2="380" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="506" y="244" width="194" height="56" fill="var(--fig-amber, #8A6508)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="6"/>
<text x="603" y="260.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">条目 <tspan font-weight="700">e</tspan>′<tspan baseline-shift="-2.6" font-size="11">s</tspan>：512 维，K = V</text>
<text x="603" y="276.32" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">584 B，每 128 个 token 一条</text>
<text x="603" y="292.32" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1M 时共 8192 条</text>
<line x1="603" y1="330" x2="603" y2="300" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="506" y="150" width="194" height="46" fill="var(--fig-amber, #8A6508)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="6"/>
<text x="603" y="168.82" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">滑动窗口条目：最近 128 个</text>
<text x="603" y="185.82" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">未压缩，512 维</text>
<path d="M700 438 H712 V173 H701" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="24" y="350" width="190" height="36" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="119" y="372.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">W</tspan><tspan baseline-shift="4.8" font-size="11">DQ</tspan>：7168 → 1536</text>
<line x1="119" y1="420" x2="119" y2="386" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="24" y="280" width="190" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="119" y="304.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="4.8" font-size="11">Q</tspan><tspan baseline-shift="-2.6" font-size="11" dx="-7.48">t</tspan><tspan dx="3.74">（1536）→ RMSNorm</tspan></text>
<line x1="119" y1="350" x2="119" y2="320" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="24" y="180" width="190" height="58" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="119" y="197.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">W</tspan><tspan baseline-shift="4.8" font-size="11">UQ</tspan>：主查询</text>
<text x="119" y="213.32" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">128 头 × 512 维</text>
<text x="119" y="229.32" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">RMSNorm + RoPE（后 64 维）</text>
<line x1="119" y1="280" x2="119" y2="238" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<rect x="244" y="196" width="232" height="56" fill="var(--fig-orange, #B4460C)" fill-opacity="0.1" stroke="var(--fig-orange, #B4460C)" stroke-width="1.3" rx="6"/>
<text x="360" y="211.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">全部 ⌊(t+1)/128⌋ 个条目</text>
<text x="360" y="228.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">∪ 128 个窗口条目</text>
<text x="360" y="245.32" font-size="11" fill="var(--fig-red, #A3231C)" text-anchor="middle">不打分、不挑选</text>
<path d="M506 272 H490 V232 H477" fill="none" stroke="var(--fig-orange, #B4460C)" stroke-width="1.6" marker-end="url(#ah-orange)"/>
<path d="M506 173 H436 V195" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<rect x="244" y="100" width="232" height="50" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="360" y="120.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">稠密的共享 KV MQA：128 头</text>
<text x="360" y="138.32" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">softmax 分母另加 sink 项</text>
<line x1="330" y1="196" x2="330" y2="150" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<path d="M214 209 H229 V125 H243" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<rect x="204" y="26" width="312" height="46" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="360" y="53.32" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">逆 RoPE（−t）→ 分组输出投影 → 7168</text>
<line x1="360" y1="100" x2="360" y2="72" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<line x1="360" y1="26" x2="360" y2="6" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.8" marker-end="url(#ah-ink)"/>
<text x="370" y="16" font-size="12" fill="var(--fig-ink, #1C1B19)">注意力输出（7168 维）</text>
<text x="603" y="134" font-size="11" fill="var(--fig-amber, #8A6508)" text-anchor="middle">琥珀色框 = KV cache</text>
<text x="119" y="160" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">与 CSA 相同</text>
</svg>
