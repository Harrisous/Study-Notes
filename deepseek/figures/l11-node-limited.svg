<text x="290" y="212" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">（50 GB/s）</text>
<text x="16" y="340" font-size="12" fill="var(--fig-ink, #1C1B19)">到达后在节点内用 NVLink（160 GB/s）转发到各 GPU；</text>
<text x="16" y="358" font-size="12" fill="var(--fig-ink, #1C1B19)">蓝色格 = 放着被选中专家的 GPU（每张 GPU 放 4 个专家）。</text>
<text x="16" y="386" font-size="12" fill="var(--fig-blue, #1F5FA8)">IB 流量 ∝ 远端节点数：不受限时最多 7 份，M = 4 时至多 4 份。</text>
<text x="16" y="404" font-size="12" fill="var(--fig-ink, #1C1B19)">NVLink / IB = 160 / 50 = 3.2：节点内转发 3.2 份的时间</text>
<text x="16" y="422" font-size="12" fill="var(--fig-ink, #1C1B19)">= IB 发 1 份的时间，故 4 × 3.2 = 12.8（论文写“至多 13 个”）。</text>
