<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 372" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>黑板上的两个回答：减去基线，平均不变，样本却不再东倒西歪</title>

<text x="16" y="48" font-size="13.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">不减基线：梯度 = 分数 × 方向</text>
<line x1="40" y1="110" x2="500" y2="110" stroke="var(--fig-muted, #74716A)" stroke-width="1.1"/>
<line x1="320" y1="96" x2="320" y2="114" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="80" y1="106" x2="80" y2="114" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="80" y="143" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">−0.6</text>
<line x1="160" y1="106" x2="160" y2="114" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="160" y="143" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">−0.4</text>
<line x1="240" y1="106" x2="240" y2="114" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="240" y="143" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">−0.2</text>
<line x1="320" y1="106" x2="320" y2="114" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="320" y="143" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.0</text>
<line x1="400" y1="106" x2="400" y2="114" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="400" y="143" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.2</text>
<line x1="480" y1="106" x2="480" y2="114" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="480" y="143" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.4</text>
<circle cx="440" cy="110" r="10.88" fill="var(--fig-green, #16704A)" fill-opacity="0.25" stroke="var(--fig-green, #16704A)" stroke-width="1.4"/>
<text x="440" y="76" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">回答 1：1.0 × 0.3</text>
<text x="440" y="92" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">= +0.3（概率 0.7）</text>
<circle cx="96" cy="110" r="7.12" fill="var(--fig-red, #A3231C)" fill-opacity="0.25" stroke="var(--fig-red, #A3231C)" stroke-width="1.4"/>
<text x="96" y="162" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">回答 2：0.8 × (−0.7)</text>
<text x="96" y="178" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">= −0.56（概率 0.3）</text>
<polygon points="330.8,129 342.8,129 336.8,118" fill="var(--fig-ink, #1C1B19)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1"/>
<text x="560" y="74" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">平均 = +0.042</text>
<text x="560" y="94" font-size="12.5" fill="var(--fig-ink, #1C1B19)">方差 = 0.155316</text>
<rect x="560" y="106" width="160" height="12" fill="var(--fig-violet, #6733C4)" fill-opacity="0.3" stroke="var(--fig-violet, #6733C4)" stroke-width="1"/>
<text x="16" y="208" font-size="13.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">减去基线 b = 0.94：梯度 = (分数 − 0.94) × 方向</text>
<line x1="40" y1="270" x2="500" y2="270" stroke="var(--fig-muted, #74716A)" stroke-width="1.1"/>
<line x1="320" y1="256" x2="320" y2="274" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="80" y1="266" x2="80" y2="274" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="80" y="303" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">−0.6</text>
<line x1="160" y1="266" x2="160" y2="274" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="160" y="303" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">−0.4</text>
<line x1="240" y1="266" x2="240" y2="274" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="240" y="303" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">−0.2</text>
<line x1="320" y1="266" x2="320" y2="274" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="320" y="303" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.0</text>
<line x1="400" y1="266" x2="400" y2="274" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="400" y="303" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.2</text>
<line x1="480" y1="266" x2="480" y2="274" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<text x="480" y="303" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0.4</text>
<circle cx="327.2" cy="270" r="10.88" fill="var(--fig-green, #16704A)" fill-opacity="0.25" stroke="var(--fig-green, #16704A)" stroke-width="1.4"/>
<text x="327.2" y="236" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">回答 1：(1.0 − 0.94) × 0.3</text>
<text x="327.2" y="252" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">= +0.018（概率 0.7）</text>
<circle cx="359.2" cy="270" r="7.12" fill="var(--fig-green, #16704A)" fill-opacity="0.25" stroke="var(--fig-green, #16704A)" stroke-width="1.4"/>
<text x="403.2" y="322" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">回答 2：(0.8 − 0.94) × (−0.7)</text>
<text x="403.2" y="338" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">= +0.098（概率 0.3）</text>
<polygon points="330.8,289 342.8,289 336.8,278" fill="var(--fig-ink, #1C1B19)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1"/>
<text x="560" y="234" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">平均 = +0.042</text>
<text x="560" y="254" font-size="12.5" fill="var(--fig-ink, #1C1B19)">方差 = 0.001344</text>
<rect x="560" y="266" width="2" height="12" fill="var(--fig-violet, #6733C4)" fill-opacity="0.3" stroke="var(--fig-violet, #6733C4)" stroke-width="1"/>
<text x="560" y="318" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="700">方差小了约 116 倍</text>
<text x="16" y="362" font-size="11.5" fill="var(--fig-muted, #74716A)">▲ 平均梯度；圆点面积正比于采到它的概率。绿色：把 θ 往正确方向推（回答 1 更可能）；红色：往反方向推。</text>
</svg>
