<text x="410" y="230" font-size="11" fill="var(--fig-violet, #6733C4)" text-anchor="middle">0.71</text>
<line x1="446" y1="144" x2="482" y2="186" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.1"/>
