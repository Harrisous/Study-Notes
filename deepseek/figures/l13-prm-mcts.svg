<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>两条被放弃的路线：过程奖励模型（PRM）与蒙特卡洛树搜索（MCTS）</title>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(a) 结果奖励（R1 用的）与过程奖励（PRM）</text>
<rect x="100" y="40" width="170" height="30" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="6"/>
<text x="185" y="60" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">步骤 1：两边平方</text>
<line x1="185" y1="71" x2="185" y2="79" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<rect x="284" y="44" width="44" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.1" rx="11"/>
<text x="306" y="60" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">0.9</text>
<rect x="100" y="80" width="170" height="30" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="6"/>
<text x="185" y="100" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">步骤 2：整理成四次方程</text>
<line x1="185" y1="111" x2="185" y2="119" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<rect x="284" y="84" width="44" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.1" rx="11"/>
<text x="306" y="100" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">0.8</text>
<rect x="100" y="120" width="170" height="30" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="6"/>
<text x="185" y="140" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">步骤 3：因式分解</text>
<line x1="185" y1="151" x2="185" y2="159" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<rect x="284" y="124" width="44" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.1" rx="11"/>
<text x="306" y="140" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">0.7</text>
<rect x="100" y="160" width="170" height="30" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="6"/>
<text x="185" y="180" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">步骤 4：检验增根</text>
<line x1="185" y1="191" x2="185" y2="199" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.1" marker-end="url(#ah-ink)"/>
<rect x="284" y="164" width="44" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.1" rx="11"/>
<text x="306" y="180" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">0.4</text>
<rect x="100" y="200" width="170" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.2" rx="6"/>
<text x="185" y="220" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">答案：\boxed{…}</text>
<text x="306" y="34" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="700">PRM</text>
<rect x="28" y="204" width="52" height="22" fill="var(--fig-green, #16704A)" fill-opacity="0.16" stroke="var(--fig-green, #16704A)" stroke-width="1.1" rx="11"/>
<text x="54" y="220" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">1 / 0</text>
<line x1="82" y1="215" x2="98" y2="215" stroke="var(--fig-green, #16704A)" stroke-width="1.2" marker-end="url(#ah-green)"/>
<text x="54" y="192" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">结果奖励</text>
<text x="28" y="70" font-size="12" fill="var(--fig-muted, #74716A)">每一步</text>
<text x="28" y="86" font-size="12" fill="var(--fig-muted, #74716A)">都要打分 →</text>
<rect x="16" y="262" width="354" height="142" fill="var(--fig-red, #A3231C)" fill-opacity="0.05" stroke="var(--fig-red, #A3231C)" stroke-width="1.1" rx="8" stroke-dasharray="5 4"/>
<text x="28" y="284" font-size="12.5" fill="var(--fig-red, #A3231C)" font-weight="600">PRM 的三个难处（论文 §G.2）</text>
<text x="28" y="308" font-size="12" fill="var(--fig-ink, #1C1B19)">① 通用推理里，“一步”很难明确定义</text>
<text x="28" y="327" font-size="12" fill="var(--fig-ink, #1C1B19)">② 判断中间一步对不对很难：模型自动标注</text>
<text x="44" y="346" font-size="12" fill="var(--fig-ink, #1C1B19)">效果不理想，人工标注又无法规模化</text>
<text x="28" y="365" font-size="12" fill="var(--fig-ink, #1C1B19)">③ 基于模型的 PRM 必然招来 reward hacking，</text>
<text x="44" y="384" font-size="12" fill="var(--fig-ink, #1C1B19)">重训它要额外资源，流程也更复杂</text>
<text x="392" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(b) MCTS：在 token 序列上做树搜索</text>
<rect x="526" y="44" width="80" height="28" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" rx="6"/>
<text x="566" y="63" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">题目 q</text>
