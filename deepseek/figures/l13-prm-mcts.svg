<text x="586" y="212" font-size="12" fill="var(--fig-violet, #6733C4)">紫色数字 = 价值模型对</text>
<text x="586" y="229" font-size="12" fill="var(--fig-violet, #6733C4)">“从这里继续能答对”的估计</text>
<text x="392" y="250" font-size="12" fill="var(--fig-muted, #74716A)">每个节点最多扩展 K 个子节点（论文设了上限）</text>
<rect x="390" y="262" width="354" height="142" fill="var(--fig-red, #A3231C)" fill-opacity="0.05" stroke="var(--fig-red, #A3231C)" stroke-width="1.1" rx="8" stroke-dasharray="5 4"/>
<text x="402" y="284" font-size="12.5" fill="var(--fig-red, #A3231C)" font-weight="600">MCTS 的两个难处（论文 §G.2）</text>
<text x="402" y="308" font-size="12" fill="var(--fig-ink, #1C1B19)">① 不像棋类，token 生成的搜索空间指数级大：</text>
<text x="418" y="327" font-size="12" fill="var(--fig-ink, #1C1B19)">每步 129,280 种可能；限制扩展数又容易</text>
<text x="418" y="346" font-size="12" fill="var(--fig-ink, #1C1B19)">卡在局部最优</text>
<text x="402" y="365" font-size="12" fill="var(--fig-ink, #1C1B19)">② 价值模型决定每一步搜索的方向，而细粒度</text>
<text x="418" y="384" font-size="12" fill="var(--fig-ink, #1C1B19)">价值模型本身很难训练，难以迭代提升</text>
</svg>
