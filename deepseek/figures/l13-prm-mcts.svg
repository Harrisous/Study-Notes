<text x="566" y="135" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">部分推理</text>
<rect x="588" y="100" width="38" height="18" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1" rx="9"/>
<text x="607" y="113" font-size="11" fill="var(--fig-violet, #6733C4)" text-anchor="middle">0.35</text>
<line x1="566" y1="72" x2="686" y2="116" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.1"/>
