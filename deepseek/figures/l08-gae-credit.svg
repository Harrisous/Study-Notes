<rect x="196" y="282" width="100" height="34" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" rx="4"/>
<text x="246" y="304" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+1.000</text>
<rect x="304" y="282" width="100" height="34" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" rx="4"/>
<text x="354" y="304" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+1.000</text>
<rect x="412" y="282" width="100" height="34" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" rx="4"/>
