<text x="678" y="304" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+1.000</text>
<text x="16" y="338" font-size="12" fill="var(--fig-muted, #74716A)">γ = 1。GAE 从最后一个 token 往前递推：Â<tspan baseline-shift="-3" font-size="11">t</tspan> = δ<tspan baseline-shift="-3" font-size="11">t</tspan> + γλ·Â<tspan baseline-shift="-3" font-size="11">t+1</tspan>。δ<tspan baseline-shift="-3" font-size="11">2</tspan> &lt; 0：价值模型认为 o₂ 让前景变差了。</text>
<text x="16" y="358" font-size="12" fill="var(--fig-muted, #74716A)">PPO 的每个 token 各有一个优势，靠价值模型“猜”出来；GRPO 不要价值模型，整条回答共用一个优势。</text>
