<text x="380" y="120" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">权重 Weight</text>
<text x="380" y="138" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">FP8（128×128 块缩放）</text>
