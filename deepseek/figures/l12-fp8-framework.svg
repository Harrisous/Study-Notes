<text x="380" y="48" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle">FP32</text>
<line x1="380" y1="54" x2="380" y2="104" stroke="var(--fig-orange, #B4460C)" stroke-width="1.5" marker-end="url(#ah-orange)"/>
