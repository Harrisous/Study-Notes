<text x="120" y="120" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">输入 Input</text>
<text x="120" y="138" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">BF16</text>
<rect x="535" y="102" width="190" height="44" fill="var(--fig-muted, #74716A)" fill-opacity="0.12" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="6"/>
<text x="630" y="120" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">输出梯度 Output Grad</text>
<text x="630" y="138" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">BF16</text>
<rect x="30" y="196" width="180" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.8" rx="8"/>
