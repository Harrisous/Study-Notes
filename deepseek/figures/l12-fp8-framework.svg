<text x="120" y="237" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">⊗ FP8 × FP8</text>
<text x="120" y="253" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">Σ 累加在 FP32</text>
<rect x="540" y="196" width="180" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.8" rx="8"/>
<text x="630" y="218" font-size="14" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">Dgrad（求输入梯度）</text>
