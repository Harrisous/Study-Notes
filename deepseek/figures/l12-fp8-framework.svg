<text x="126" y="344" font-size="12" fill="var(--fig-green, #16704A)" font-weight="600">To BF16</text>
<rect x="40" y="358" width="160" height="44" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="120" y="376" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">输出 Output</text>
<text x="120" y="394" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">BF16</text>
<line x1="630" y1="258" x2="630" y2="360" stroke="var(--fig-green, #16704A)" stroke-width="1.5" marker-end="url(#ah-green)"/>
<text x="636" y="344" font-size="12" fill="var(--fig-green, #16704A)" font-weight="600">To BF16</text>
<rect x="535" y="358" width="190" height="44" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="630" y="376" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">输入梯度 Input Grad</text>
<text x="630" y="394" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">BF16</text>
<line x1="380" y1="348" x2="380" y2="382" stroke="var(--fig-green, #16704A)" stroke-width="1.5" marker-end="url(#ah-green)"/>
<rect x="268" y="380" width="224" height="44" fill="var(--fig-amber, #8A6508)" fill-opacity="0.12" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="6"/>
<text x="380" y="398" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">权重梯度 Weight Grad</text>
<text x="380" y="416" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle">FP32（跨 micro-batch 累加）</text>
<line x1="492" y1="402" x2="556" y2="450" stroke="var(--fig-amber, #8A6508)" stroke-width="1.5" marker-end="url(#ah-amber)"/>
