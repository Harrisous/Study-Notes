<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>用 MTP 做投机解码：时间线与每步期望产出</title>
<defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Ⓐ 每一步：主模型验证上一步的草稿，并自己再出 1 个 token；MTP 模块起草下一个</text>
<rect x="20" y="40" width="216" height="150" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.03" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="30" y="60" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">第 1 步</text>
<rect x="30" y="72" width="96" height="32" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="78" y="92.32" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">主模型前向</text>
<rect x="134" y="72" width="92" height="32" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="180" y="92.32" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">MTP 起草</text>
<text x="30" y="126" font-size="12" fill="var(--fig-green, #16704A)">上一步的草稿 ✓ 被接受</text>
<text x="30" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)">本步产出：草稿 + 自己的 1 个</text>
<text x="30" y="170" font-size="13" fill="var(--fig-green, #16704A)" font-weight="700">= 2 个 token</text>
<line x1="236" y1="115" x2="251" y2="115" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="252" y="40" width="216" height="150" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.03" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="262" y="60" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">第 2 步</text>
<rect x="262" y="72" width="96" height="32" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="310" y="92.32" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">主模型前向</text>
<rect x="366" y="72" width="92" height="32" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="412" y="92.32" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">MTP 起草</text>
<text x="262" y="126" font-size="12" fill="var(--fig-red, #A3231C)">上一步的草稿 ✗ 被拒绝</text>
<text x="262" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)">本步只产出主模型的 1 个</text>
<text x="262" y="170" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="700">= 1 个 token</text>
<line x1="468" y1="115" x2="483" y2="115" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="484" y="40" width="216" height="150" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.03" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="494" y="60" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">第 3 步</text>
<rect x="494" y="72" width="96" height="32" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="542" y="92.32" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">主模型前向</text>
<rect x="598" y="72" width="92" height="32" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="644" y="92.32" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">MTP 起草</text>
<text x="494" y="126" font-size="12" fill="var(--fig-green, #16704A)">上一步的草稿 ✓ 被接受</text>
<text x="494" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)">本步产出：草稿 + 自己的 1 个</text>
<text x="494" y="170" font-size="13" fill="var(--fig-green, #16704A)" font-weight="700">= 2 个 token</text>
<text x="20" y="212" font-size="12" fill="var(--fig-muted, #74716A)">接受概率为 p 时，每步期望产出 1 + p 个 token；草稿与验证本身也要算力，所以实际加速低于 1 + p。</text>
<text x="16" y="244" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">Ⓑ 每步期望产出 E = (1 − p<tspan baseline-shift="super" font-size="11">k+1</tspan>) / (1 − p)，k = 草稿数（各草稿独立、接受率同为 p）</text>
