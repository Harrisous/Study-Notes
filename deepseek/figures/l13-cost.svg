<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>DeepSeek-R1 公开的训练账单，以及它与 DeepSeek-V3 全部训练成本的比例</title>

<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(a) R1 的三项成本（千 GPU 小时；按每 GPU 小时 2 美元折算）</text>
<line x1="150" y1="34" x2="150" y2="172" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="150" y="188" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0K</text>
<line x1="262.5" y1="34" x2="262.5" y2="172" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="262.5" y="188" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">40K</text>
<line x1="375" y1="34" x2="375" y2="172" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="375" y="188" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">80K</text>
<line x1="487.5" y1="34" x2="487.5" y2="172" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="487.5" y="188" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">120K</text>
<line x1="600" y1="34" x2="600" y2="172" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="600" y="188" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">160K</text>
<text x="142" y="57" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="end">R1-Zero 的 RL</text>
<rect x="150" y="42" width="284.06" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="440.06" y="57" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">101K · $202K</text>
<text x="744" y="57" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">512 张 H800 × 约 198 小时</text>
<text x="142" y="89" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="end">造 SFT 数据</text>
<rect x="150" y="74" width="14.06" height="22" fill="var(--fig-amber, #8A6508)" fill-opacity="0.75"/>
<text x="170.06" y="89" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">5K · $10K</text>
<text x="744" y="89" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">5K GPU 小时</text>
<text x="142" y="121" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="end">R1 的训练</text>
<rect x="150" y="106" width="115.31" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="271.31" y="121" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">41K · $82K</text>
<text x="744" y="121" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">512 张 H800 × 约 80 小时</text>
<text x="142" y="153" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="700">合计</text>
<rect x="150" y="138" width="413.44" height="22" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.6"/>
<text x="569.44" y="153" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">147K · $294K</text>
<text x="16" y="222" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(b) 放到同一把尺子上：DeepSeek-V3 的全部训练（第 12 课）与 R1 的后训练</text>
<line x1="150" y1="234" x2="150" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="150" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<line x1="241.67" y1="234" x2="241.67" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="241.67" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">500K</text>
<line x1="333.33" y1="234" x2="333.33" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="333.33" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1000K</text>
<line x1="425" y1="234" x2="425" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="425" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1500K</text>
<line x1="516.67" y1="234" x2="516.67" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="516.67" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">2000K</text>
<line x1="608.33" y1="234" x2="608.33" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="608.33" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">2500K</text>
<line x1="700" y1="234" x2="700" y2="302" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="700" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">3000K</text>
<text x="142" y="256" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="end">V3 全部训练</text>
<rect x="150" y="242" width="511.13" height="22" fill="var(--fig-muted, #74716A)" fill-opacity="0.55"/>
<text x="655.13" y="258" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">2,788K · $5.576M</text>
<text x="142" y="288" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="end">R1 后训练</text>
<rect x="150" y="274" width="26.95" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="182.95" y="290" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">147K · $294K，约为 V3 的 5.3%</text>
<text x="16" y="346" font-size="12" fill="var(--fig-muted, #74716A)">V3 的账单不含前期研究与消融实验。R1 这张只列了三项，没有列出：V3-Base 的预训练、30B 小模型在 A100</text>
<text x="16" y="364" font-size="12" fill="var(--fig-muted, #74716A)">上的准备实验、PRM 与 MCTS 等失败尝试、蒸馏 6 个小模型；奖励模型的训练是否计入，论文没有说明。</text>
</svg>
