<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>裁剪让哪些 token 停止学习：按优势的符号与裁剪系数，把重要性比率分成照常学习与梯度为零两段</title>

