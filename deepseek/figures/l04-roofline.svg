<line x1="212.31" y1="40" x2="212.31" y2="380" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="212.31" y="397" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">4</text>
<line x1="297.85" y1="40" x2="297.85" y2="380" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="297.85" y="397" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">16</text>
<line x1="383.38" y1="40" x2="383.38" y2="380" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="383.38" y="397" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">64</text>
<line x1="468.92" y1="40" x2="468.92" y2="380" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="468.92" y="397" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">256</text>
<line x1="554.46" y1="40" x2="554.46" y2="380" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="554.46" y="397" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1024</text>
<line x1="640" y1="40" x2="640" y2="380" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="640" y="397" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">4096</text>
<line x1="84" y1="380" x2="640" y2="380" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
