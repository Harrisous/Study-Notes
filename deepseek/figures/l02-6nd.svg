<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>6ND 的来历：一个线性层的前向与反向，以及 GPT-3 每 token 的训练 FLOPs</title>

<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一个线性层 Y = XW（W 有 d<tspan baseline-shift="-3.2" font-size="11">in</tspan>d<tspan baseline-shift="-3.2" font-size="11">out</tspan> 个参数）</text>
<text x="16" y="66" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">前向</text>
<text x="16" y="84" font-size="12" fill="var(--fig-ink, #1C1B19)">Y = X · W</text>
<rect x="116" y="52" width="28" height="48" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="3"/>
<text x="130" y="81" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">X</text>
<text x="130" y="114" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, d<tspan baseline-shift="-2.8" font-size="11">in</tspan>]</text>
<text x="156" y="81" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">×</text>
<rect x="168" y="52" width="48" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="3"/>
<text x="192" y="81" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">W</text>
<text x="192" y="114" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="-2.8" font-size="11">in</tspan>, d<tspan baseline-shift="-2.8" font-size="11">out</tspan>]</text>
<text x="228" y="81" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">=</text>
<rect x="240" y="52" width="48" height="48" fill="var(--fig-green, #16704A)" fill-opacity="0.14" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="3"/>
<text x="264" y="81" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">Y</text>
<text x="264" y="114" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, d<tspan baseline-shift="-2.8" font-size="11">out</tspan>]</text>
<text x="318" y="70" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">2 · T · d<tspan baseline-shift="-3.2" font-size="11">in</tspan> · d<tspan baseline-shift="-3.2" font-size="11">out</tspan></text>
<text x="318" y="94" font-size="12" fill="var(--fig-muted, #74716A)">= 2 × 参数 × token</text>
<text x="16" y="178" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">反向 ①</text>
<text x="16" y="196" font-size="12" fill="var(--fig-ink, #1C1B19)">∂X = ∂Y · W<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<rect x="116" y="164" width="48" height="48" fill="var(--fig-red, #A3231C)" fill-opacity="0.14" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" rx="3"/>
<text x="140" y="193" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">∂Y</text>
<text x="140" y="226" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, d<tspan baseline-shift="-2.8" font-size="11">out</tspan>]</text>
<text x="176" y="193" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">×</text>
<rect x="188" y="164" width="48" height="48" fill="var(--fig-violet, #6733C4)" fill-opacity="0.14" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" rx="3"/>
<text x="212" y="193" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">W<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<text x="212" y="226" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="-2.8" font-size="11">out</tspan>, d<tspan baseline-shift="-2.8" font-size="11">in</tspan>]</text>
<text x="248" y="193" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">=</text>
<rect x="260" y="164" width="28" height="48" fill="var(--fig-red, #A3231C)" fill-opacity="0.14" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" rx="3"/>
<text x="274" y="193" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">∂X</text>
<text x="274" y="226" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, d<tspan baseline-shift="-2.8" font-size="11">in</tspan>]</text>
<text x="318" y="182" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">2 · T · d<tspan baseline-shift="-3.2" font-size="11">in</tspan> · d<tspan baseline-shift="-3.2" font-size="11">out</tspan></text>
<text x="318" y="206" font-size="12" fill="var(--fig-muted, #74716A)">= 2 × 参数 × token</text>
<text x="16" y="290" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">反向 ②</text>
<text x="16" y="308" font-size="12" fill="var(--fig-ink, #1C1B19)">∂W = X<tspan baseline-shift="super" font-size="11">⊤</tspan> · ∂Y</text>
<rect x="116" y="286" width="48" height="28" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.14" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="3"/>
<text x="140" y="305" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">X<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<text x="140" y="328" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="-2.8" font-size="11">in</tspan>, T]</text>
<text x="176" y="305" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">×</text>
<rect x="188" y="276" width="48" height="48" fill="var(--fig-red, #A3231C)" fill-opacity="0.14" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" rx="3"/>
<text x="212" y="305" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">∂Y</text>
<text x="212" y="338" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[T, d<tspan baseline-shift="-2.8" font-size="11">out</tspan>]</text>
<text x="248" y="305" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">=</text>
<rect x="260" y="276" width="48" height="48" fill="var(--fig-red, #A3231C)" fill-opacity="0.14" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" rx="3"/>
<text x="284" y="305" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">∂W</text>
<text x="284" y="338" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="-2.8" font-size="11">in</tspan>, d<tspan baseline-shift="-2.8" font-size="11">out</tspan>]</text>
<text x="318" y="294" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">2 · T · d<tspan baseline-shift="-3.2" font-size="11">in</tspan> · d<tspan baseline-shift="-3.2" font-size="11">out</tspan></text>
<text x="318" y="318" font-size="12" fill="var(--fig-muted, #74716A)">= 2 × 参数 × token</text>
<line x1="16" y1="374" x2="450" y2="374" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2"/>
<text x="16" y="394" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">合计：前向 2 + 反向 4 = 每参数每 token 6 次 → C ≈ 6ND</text>
<text x="450" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">GPT-3 175B：每训练 token 的 FLOPs</text>
<rect x="566" y="264.76" width="56" height="95.24" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="558" y="316.38" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="end" font-weight="600">前向 2N</text>
<text x="630" y="316.38" font-size="12" fill="var(--fig-ink, #1C1B19)">349.2 GFLOP</text>
<rect x="566" y="74.29" width="56" height="190.47" fill="var(--fig-red, #A3231C)" fill-opacity="0.45" stroke="var(--fig-red, #A3231C)" stroke-width="1"/>
<text x="558" y="173.53" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="end" font-weight="600">反向 4N</text>
<text x="630" y="173.53" font-size="12" fill="var(--fig-ink, #1C1B19)">698.4 GFLOP</text>
<rect x="566" y="70.34" width="56" height="3.95" fill="var(--fig-violet, #6733C4)" fill-opacity="0.85"/>
<line x1="566" y1="72.31" x2="550" y2="58.29" stroke="var(--fig-violet, #6733C4)" stroke-width="1"/>
<text x="548" y="40.29" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="end" font-weight="600">注意力打分 + 加权求和</text>
<text x="548" y="56.29" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="end">14.5 GFLOP（1.4%）</text>
<line x1="562" y1="360" x2="626" y2="360" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<text x="594" y="378" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">6N = 1047.6 GFLOP</text>
<text x="594" y="396" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">× 300B token = 3.14×10<tspan baseline-shift="super" font-size="11">23</tspan></text>
</svg>
