<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>公开的 GPU 小时：预训练与后训练</title>

<line x1="20" y1="34" x2="20" y2="286" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="20" y="302" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<line x1="137.24" y1="34" x2="137.24" y2="286" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="137.24" y="302" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">500 K</text>
<line x1="254.48" y1="34" x2="254.48" y2="286" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="254.48" y="302" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1,000 K</text>
<line x1="371.72" y1="34" x2="371.72" y2="286" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="371.72" y="302" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1,500 K</text>
<line x1="488.97" y1="34" x2="488.97" y2="286" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="488.97" y="302" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">2,000 K</text>
<line x1="606.21" y1="34" x2="606.21" y2="286" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="606.21" y="302" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">2,500 K</text>
<text x="360" y="324" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">H800 GPU 小时（千）</text>
<text x="20" y="40" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">DeepSeek-V3 的正式训练（2024-12）</text>
<rect x="20" y="48" width="624.66" height="30" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.45" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="30" y="67.5" font-size="12.5" fill="var(--fig-surface, #FFFFFF)" font-weight="700">预训练 2,664K</text>
<rect x="644.66" y="48" width="27.9" height="30" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="672.57" y="48" width="1.17" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.9" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="669.74" y="39" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="end" font-weight="600">上下文扩展 119K（蓝）+ 后训练 5K（绿，只有预训练的 0.19%）</text>
<text x="20" y="96" font-size="12" fill="var(--fig-muted, #74716A)">合计 2,788K 小时 × 2 美元 = 557.6 万美元；不含此前的研究与消融实验</text>
<text x="20" y="128" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">DeepSeek-R1（2025-01，建在 V3-Base 上）</text>
<rect x="20" y="136" width="23.68" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.9" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="43.68" y="136" width="1.17" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.5" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="44.86" y="136" width="9.61" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.7" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<text x="62.47" y="155.5" font-size="12" fill="var(--fig-green, #16704A)" font-weight="600">R1-Zero 101K + SFT 数据 5K + R1 41K = 147K 小时 = 29.4 万美元</text>
<text x="20" y="184" font-size="12" fill="var(--fig-muted, #74716A)">约为 V3 全部正式训练的 5.3%；不含 V3-Base 本身、准备实验与蒸馏</text>
<text x="20" y="216" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">DeepSeek-V3.2 的后训练（2025-12）</text>
<rect x="20" y="224" width="62.47" height="30" fill="var(--fig-green, #16704A)" fill-opacity="0.25" stroke="var(--fig-green, #16704A)" stroke-width="1.4" stroke-dasharray="5 3"/>
<path d="M84.5 239.0 l10 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="1.4"/>
<text x="100.47" y="243.5" font-size="12" fill="var(--fig-green, #16704A)" font-weight="600">“超过预训练成本的 10%”：按 V3 的 2,664K 折算至少 266K 小时</text>
<text x="20" y="272" font-size="12" fill="var(--fig-muted, #74716A)">论文只给比例，没有给基数与口径；这根柱子是示意，右端开放</text>
</svg>
