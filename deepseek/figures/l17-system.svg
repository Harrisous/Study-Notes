<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>Engram 的系统实现：训练时分片 + All-to-All，推理时从主机内存预取</title>
<defs><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-amber, #8A6508)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="20" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">(a) 训练：表按行切到各卡，前向用 All-to-All 取行，反向把梯度送回持有该行的卡</text>
