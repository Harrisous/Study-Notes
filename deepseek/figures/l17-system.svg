<text x="24" y="222" font-size="11.5" fill="var(--fig-muted, #74716A)">V4.1-Flash：表按行切到专门的 engram 并行组，优化器状态再按副本切分；每个流水段开始本步的微批之前就对整个本地 batch 发起预取。</text>
<text x="20" y="262" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">(b) 推理：行号只由 token ID 决定，开算之前就能预取（示意时间线，论文未报告各段耗时）</text>
<text x="108" y="309" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">主机 CPU</text>
