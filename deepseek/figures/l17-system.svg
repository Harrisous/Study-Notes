<text x="449.5" y="396.14" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">第 2 块其余部分</text>
<text x="542.32" y="396" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">…</text>
<path d="M312.48 362 V376" fill="none" stroke="var(--fig-amber, #8A6508)" stroke-width="1.6" marker-end="url(#ah-amber)"/>
<path d="M162.2 428 v6 H339.0 v-6" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2"/>
<text x="250.6" y="450" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">预取被第 1 块的计算“盖住”</text>
<text x="356.68" y="450" font-size="11.5" fill="var(--fig-amber, #8A6508)">E = 第 2 块里的 Engram</text>
<text x="118" y="480" font-size="12" fill="var(--fig-blue, #1F5FA8)">对比 MoE：某一层选哪些专家，要等这一层的 <tspan font-weight="700">h</tspan><tspan baseline-shift="sub" font-size="11">t</tspan> 算出来才知道，没法这样提前取。</text>
<text x="118" y="500" font-size="12" fill="var(--fig-ink, #1C1B19)">每 token 取的行数只由“层数 × 阶数 × 头数”决定：27B 为 32 行，V4.1-Flash 为 48 行（12,672 字节，含缩放）。</text>
<text x="118" y="520" font-size="12" fill="var(--fig-ink, #1C1B19)">与表有多大无关：表大 3 倍（Engram-40B），每 token 仍取 32 行。</text>
