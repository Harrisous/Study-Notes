<text x="250.6" y="396.14" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">第 1 块（注意力 + FFN）</text>
<rect x="339" y="378" width="35.36" height="28" fill="var(--fig-amber, #8A6508)" fill-opacity="0.55" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="6"/>
<text x="356.68" y="396.14" font-size="11.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">E</text>
