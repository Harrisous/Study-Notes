<path d="M376.0 196 v8 h124.0 v-8" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.4"/>
<text x="246" y="222" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">内容分数 (<tspan font-weight="700">q</tspan><tspan dy="-4.8" font-size="11">C</tspan><tspan dy="8.4" font-size="11">t,i</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="11">⊤</tspan><tspan dy="4.8" font-weight="700">k</tspan><tspan dy="-4.8" font-size="11">C</tspan><tspan dy="8.4" font-size="11">j,i</tspan><tspan dy="-3.6">：没有旋转夹在中间 → 可吸收</tspan></text>
<text x="474" y="242" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">位置分数 (<tspan font-weight="700">q</tspan><tspan dy="-4.8" font-size="11">R</tspan><tspan dy="8.4" font-size="11">t,i</tspan><tspan dy="-3.6">)</tspan><tspan dy="-4.8" font-size="11">⊤</tspan><tspan dy="4.8" font-weight="700">k</tspan><tspan dy="-4.8" font-size="11">R</tspan><tspan dy="8.4" font-size="11">j</tspan><tspan dy="-3.6">：含 </tspan><tspan font-weight="700">R</tspan><tspan dy="3.6" font-size="11">j−t</tspan></text>
<text x="516" y="71" font-size="12" fill="var(--fig-muted, #74716A)">拼接</text>
<text x="516" y="139" font-size="12" fill="var(--fig-muted, #74716A)">拼接</text>
<text x="560" y="110" font-size="12" fill="var(--fig-ink, #1C1B19)">分数 = 两部分之和，</text>
<text x="560" y="128" font-size="12" fill="var(--fig-ink, #1C1B19)">再除以 √192</text>
