<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 452" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>解耦 RoPE：一个头的 192 维查询与键</title>

<text x="16" y="24" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="700">第 i 个头：查询和键各 192 维 = 128 维内容 + 64 维位置</text>
<text x="106" y="71" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="end" font-weight="600">查询 <tspan font-weight="700">q</tspan><tspan dy="3.9" font-size="11">t,i</tspan></text>
<rect x="118" y="50" width="256" height="32" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" rx="3"/>
<text x="246" y="71" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700"><tspan font-weight="700">q</tspan><tspan dy="-5.2" font-size="11">C</tspan><tspan dy="9.1" font-size="11">t,i</tspan><tspan dy="-3.9">（128）</tspan></text>
<rect x="374" y="50" width="128" height="32" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" stroke="var(--fig-red, #A3231C)" stroke-width="2" rx="3"/>
<text x="438" y="71" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700"><tspan font-weight="700">q</tspan><tspan dy="-5.2" font-size="11">R</tspan><tspan dy="9.1" font-size="11">t,i</tspan><tspan dy="-3.9">（64）</tspan></text>
<text x="246" y="44" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">= <tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">UQ</tspan><tspan dy="8" font-size="11">i</tspan><tspan dy="-3.4" font-weight="700">c</tspan><tspan dy="-4.6" font-size="11">Q</tspan><tspan dy="8" font-size="11">t</tspan><tspan dy="-3.4">，不旋转</tspan></text>
<text x="438" y="44" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">RoPE(<tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">QR</tspan><tspan dy="8" font-size="11">i</tspan><tspan dy="-3.4" font-weight="700">c</tspan><tspan dy="-4.6" font-size="11">Q</tspan><tspan dy="8" font-size="11">t</tspan><tspan dy="-3.4">)，每头一个</tspan></text>
<text x="106" y="139" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="end" font-weight="600">键 <tspan font-weight="700">k</tspan><tspan dy="3.9" font-size="11">j,i</tspan></text>
<rect x="118" y="118" width="256" height="32" fill="var(--fig-violet, #6733C4)" fill-opacity="0.22" stroke="var(--fig-violet, #6733C4)" stroke-width="1.2" rx="3"/>
<text x="246" y="139" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="700"><tspan font-weight="700">k</tspan><tspan dy="-5.2" font-size="11">C</tspan><tspan dy="9.1" font-size="11">j,i</tspan><tspan dy="-3.9">（128）</tspan></text>
<rect x="374" y="118" width="128" height="32" fill="var(--fig-red, #A3231C)" fill-opacity="0.16" stroke="var(--fig-red, #A3231C)" stroke-width="2" rx="3"/>
<text x="438" y="139" font-size="13" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="700"><tspan font-weight="700">k</tspan><tspan dy="-5.2" font-size="11">R</tspan><tspan dy="9.1" font-size="11">j</tspan><tspan dy="-3.9">（64）</tspan></text>
<text x="246" y="166" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">= <tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">UK</tspan><tspan dy="8" font-size="11">i</tspan><tspan dy="-3.4" font-weight="700">c</tspan><tspan dy="-4.6" font-size="11">KV</tspan><tspan dy="8" font-size="11">j</tspan><tspan dy="-3.4">，每头不同，不旋转</tspan></text>
<text x="438" y="166" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">RoPE(<tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">KR</tspan><tspan dy="4.6" font-weight="700">h</tspan><tspan dy="3.4" font-size="11">j</tspan><tspan dy="-3.4">)，没有下标 i</tspan></text>
