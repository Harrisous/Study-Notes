<line x1="82" y1="400" x2="440" y2="400" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<text x="456" y="56" font-size="13" fill="var(--fig-ink, #1C1B19)">一步里 4 台设备收到的（token, 专家）分配：</text>
<text x="456" y="82" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">14 + 10 + 9 + 7 = 40，平均 10</text>
<text x="456" y="108" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">容量因子 1.0 ⇒ 每台的预算 = 平均 = 10</text>
<text x="456" y="146" font-size="13" fill="var(--fig-ink, #1C1B19)">设备 1 超出 4 个：按亲和度从低到高丢</text>
<text x="456" y="172" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">0.03、0.05、0.06、0.08（红）</text>
<text x="456" y="198" font-size="13" fill="var(--fig-amber, #8A6508)" font-weight="600">0.04 属于永不丢弃的序列：跳过（黄）</text>
<text x="456" y="236" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">丢弃比例 4 / 40 = 10%</text>
<text x="456" y="262" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">最慢设备的工作量 14 → 10（少 29%）</text>
<text x="456" y="288" font-size="13" fill="var(--fig-muted, #74716A)">设备 3、4 仍闲着：丢弃只削峰，不填谷</text>
<text x="456" y="382" font-size="12" fill="var(--fig-muted, #74716A)">玩具数字；每个方块是一次（token, 专家）计算，</text>
<text x="456" y="400" font-size="12" fill="var(--fig-muted, #74716A)">方块里的数是它的亲和度 s<tspan baseline-shift="sub" font-size="11">i,t</tspan></text>
