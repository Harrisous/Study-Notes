<line x1="625" y1="70" x2="625" y2="300" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="625" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">-3</tspan></text>
<line x1="666.5" y1="70" x2="666.5" y2="300" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="666.5" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">-2</tspan></text>
<line x1="708" y1="70" x2="708" y2="300" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="708" y="316" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">10<tspan baseline-shift="super" font-size="11">-1</tspan></text>
