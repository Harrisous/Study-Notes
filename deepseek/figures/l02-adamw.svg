<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>AdamW 的一步，以及 L2 正则与解耦权重衰减的区别</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker></defs>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">AdamW 的一步（对每个参数逐元素进行）</text>
<rect x="110" y="36" width="170" height="44" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="195" y="55.05" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">梯度 g<tspan baseline-shift="-3.2" font-size="11">t</tspan></text>
<text x="195" y="70.05" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">（已裁剪）</text>
<rect x="16" y="106" width="170" height="76" fill="var(--fig-amber, #8A6508)" fill-opacity="0.1" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="8"/>
<text x="101" y="125.55" font-size="13" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">一阶矩 m<tspan baseline-shift="-3.2" font-size="11">t</tspan></text>
<text x="101" y="148.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">β<tspan baseline-shift="-3" font-size="11">1</tspan>m<tspan baseline-shift="-3" font-size="11">t−1</tspan> + (1−β<tspan baseline-shift="-3" font-size="11">1</tspan>)g<tspan baseline-shift="-3" font-size="11">t</tspan></text>
<text x="101" y="171.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">梯度的滑动平均</text>
<rect x="200" y="106" width="170" height="76" fill="var(--fig-amber, #8A6508)" fill-opacity="0.1" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="8"/>
<text x="285" y="125.55" font-size="13" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">二阶矩 v<tspan baseline-shift="-3.2" font-size="11">t</tspan></text>
<text x="285" y="148.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">β<tspan baseline-shift="-3" font-size="11">2</tspan>v<tspan baseline-shift="-3" font-size="11">t−1</tspan> + (1−β<tspan baseline-shift="-3" font-size="11">2</tspan>)g<tspan baseline-shift="-3" font-size="11">t</tspan><tspan baseline-shift="super" font-size="11">2</tspan></text>
<text x="285" y="171.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">梯度平方的滑动平均</text>
<rect x="16" y="200" width="170" height="44" fill="var(--fig-muted, #74716A)" fill-opacity="0.06" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="8"/>
<text x="101" y="226.55" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">m̂<tspan baseline-shift="-3.2" font-size="11">t</tspan> = m<tspan baseline-shift="-3.2" font-size="11">t</tspan> / (1 − β<tspan baseline-shift="-3.2" font-size="11">1</tspan><tspan baseline-shift="super" font-size="11">t</tspan>)</text>
<rect x="200" y="200" width="170" height="44" fill="var(--fig-muted, #74716A)" fill-opacity="0.06" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="8"/>
<text x="285" y="226.55" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle" font-weight="600">v̂<tspan baseline-shift="-3.2" font-size="11">t</tspan> = v<tspan baseline-shift="-3.2" font-size="11">t</tspan> / (1 − β<tspan baseline-shift="-3.2" font-size="11">2</tspan><tspan baseline-shift="super" font-size="11">t</tspan>)</text>
<rect x="70" y="270" width="250" height="54" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="195" y="291.55" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">u<tspan baseline-shift="-3.2" font-size="11">t</tspan> = m̂<tspan baseline-shift="-3.2" font-size="11">t</tspan> / (√v̂<tspan baseline-shift="-3.2" font-size="11">t</tspan> + ε)</text>
<text x="195" y="311.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">每个参数的步长被自己的梯度尺度归一化</text>
<rect x="30" y="352" width="330" height="56" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="8"/>
<text x="195" y="374.05" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">θ<tspan baseline-shift="-3.2" font-size="11">t</tspan> = θ<tspan baseline-shift="-3.2" font-size="11">t−1</tspan> − η<tspan baseline-shift="-3.2" font-size="11">t</tspan> u<tspan baseline-shift="-3.2" font-size="11">t</tspan> − η<tspan baseline-shift="-3.2" font-size="11">t</tspan> λ θ<tspan baseline-shift="-3.2" font-size="11">t−1</tspan></text>
<text x="195" y="395.05" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">学习率 η<tspan baseline-shift="-3" font-size="11">t</tspan> 来自调度（图 2.8）</text>
<line x1="160" y1="81" x2="101" y2="106" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="230" y1="81" x2="285" y2="106" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="101" y1="183" x2="101" y2="198" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="285" y1="183" x2="285" y2="198" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="101" y1="245" x2="150" y2="270" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="285" y1="245" x2="245" y2="270" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<line x1="195" y1="325" x2="195" y2="350" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="372" y="338" font-size="12" fill="var(--fig-green, #16704A)" font-weight="600">解耦权重衰减：</text>
<text x="372" y="358" font-size="12" fill="var(--fig-green, #16704A)">−η<tspan baseline-shift="-3" font-size="11">t</tspan>λθ<tspan baseline-shift="-3" font-size="11">t−1</tspan> 直接</text>
<text x="372" y="378" font-size="12" fill="var(--fig-green, #16704A)">作用在 θ 上，</text>
<text x="372" y="398" font-size="12" fill="var(--fig-green, #16704A)">不经过 m、v</text>
<text x="16" y="48" font-size="12" fill="var(--fig-red, #A3231C)" font-weight="600">Adam+L2：</text>
<text x="16" y="66" font-size="12" fill="var(--fig-red, #A3231C)">把 λ′θ 加进 g</text>
<path d="M92 72 H108" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#ah-red)"/>
<text x="492" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">每步被正则“收走”的比例</text>
<text x="492" y="42" font-size="12" fill="var(--fig-muted, #74716A)">η = 6×10<tspan baseline-shift="super" font-size="11">−5</tspan>，λ = 0.1</text>
