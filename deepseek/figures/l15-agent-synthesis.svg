<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>V3.2 的智能体 RL 任务：四类来源，以及通用智能体环境的合成流程</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-red, #A3231C)"/></marker></defs>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">85,267 个智能体 RL 任务（V3.2 论文表 1）</text>
<text x="122" y="53" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">搜索智能体</text>
<rect x="132" y="40" width="330" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.4" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="470" y="53" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">50,275（59.0%）</text>
<text x="574" y="53" font-size="12" fill="var(--fig-muted, #74716A)">环境真实 · 提示合成</text>
<text x="122" y="83" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">代码智能体</text>
<rect x="132" y="70" width="161.91" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.4" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="301.91" y="83" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">24,667（28.9%）</text>
<text x="574" y="83" font-size="12" fill="var(--fig-muted, #74716A)">环境真实 · 提示取自网上</text>
<text x="122" y="113" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">代码解释器</text>
<rect x="132" y="100" width="38.78" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.4" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="178.78" y="113" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">5,908（6.9%）</text>
<text x="574" y="113" font-size="12" fill="var(--fig-muted, #74716A)">环境真实 · 提示取自网上</text>
<text x="122" y="143" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">通用智能体</text>
<rect x="132" y="130" width="28.99" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="168.99" y="143" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="700">4,417（5.2%）</text>
<text x="574" y="143" font-size="12" fill="var(--fig-muted, #74716A)">环境合成 · 提示合成</text>
<text x="132" y="172" font-size="11" fill="var(--fig-muted, #74716A)">实心 = 真实环境（真实搜索 API、代码仓库、Jupyter）；虚线 = 合成环境。</text>
<line x1="12" y1="186" x2="748" y2="186" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="208" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">通用智能体：自动合成环境与任务（“难解、易验”）</text>
<rect x="16" y="224" width="168" height="58" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.05" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="6"/>
<text x="100" y="241.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">输入</text>
<text x="100" y="257.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">任务类别 + 沙箱</text>
<text x="100" y="273.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">（bash 与搜索工具）</text>
<line x1="186" y1="253" x2="196" y2="253" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="200" y="224" width="168" height="58" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="284" y="241.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">① 取数据</text>
<text x="284" y="257.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">上网生成或检索数据，</text>
<text x="284" y="273.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">存进沙箱数据库</text>
<line x1="370" y1="253" x2="380" y2="253" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="384" y="224" width="168" height="58" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="468" y="241.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">② 合成工具</text>
<text x="468" y="257.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">一组任务专用的工具，</text>
<text x="468" y="273.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">每个是一个函数</text>
<line x1="554" y1="253" x2="564" y2="253" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="568" y="224" width="168" height="58" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="652" y="241.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">③ 出题</text>
<text x="652" y="257.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">简单任务 + Python 解法</text>
<text x="652" y="273.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">+ Python 验证函数</text>
<rect x="568" y="320" width="168" height="44" fill="var(--fig-red, #A3231C)" fill-opacity="0.06" stroke="var(--fig-red, #A3231C)" stroke-width="1.3" rx="6"/>
<text x="652" y="338.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">解法没通过验证？</text>
<text x="652" y="354.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">改解法或验证函数，直到通过</text>
<path d="M628 282 v35" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.2" marker-end="url(#ah-red)"/>
<path d="M678 320 v-35" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.2" marker-end="url(#ah-red)"/>
<rect x="384" y="320" width="168" height="44" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="6"/>
<text x="468" y="338.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">④ 逐步加难</text>
<text x="468" y="354.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">同步更新解法与验证函数</text>
<line x1="566" y1="342" x2="556" y2="342" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="460" y="382" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">工具不够用时扩充工具集</text>
<rect x="200" y="398" width="168" height="58" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="284" y="415.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">⑤ 用 V3.2 做 RL 试解</text>
<text x="284" y="431.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">只保留 pass@100 &gt; 0</text>
<text x="284" y="447.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">（100 次里至少解出 1 次）</text>
<path d="M468 364 V427 H372" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<rect x="16" y="398" width="168" height="58" fill="var(--fig-green, #16704A)" fill-opacity="0.2" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="6"/>
<text x="100" y="415.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">结果：1,827 个环境</text>
<text x="100" y="431.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">4,417 个任务</text>
<text x="100" y="447.68" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">平均每个环境约 2.4 个</text>
<line x1="198" y1="427" x2="188" y2="427" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="16" y="320" font-size="12" fill="var(--fig-muted, #74716A)">中间产物：</text>
<text x="16" y="338" font-size="12" fill="var(--fig-muted, #74716A)">数千个 ⟨环境, 工具, 任务, 验证器⟩</text>
<text x="16" y="356" font-size="12" fill="var(--fig-muted, #74716A)">四元组</text>
<rect x="560" y="398" width="188" height="82" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.6" rx="6"/>
<text x="570" y="416" font-size="11" fill="var(--fig-muted, #74716A)">抽 50 个合成任务：pass@1</text>
<text x="570" y="433" font-size="11" fill="var(--fig-ink, #1C1B19)">V3.2-Exp</text>
<text x="738" y="433" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="700">12%</text>
<text x="570" y="447" font-size="11" fill="var(--fig-ink, #1C1B19)">Sonnet-4.5</text>
<text x="738" y="447" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="700">34%</text>
<text x="570" y="461" font-size="11" fill="var(--fig-ink, #1C1B19)">Gemini-3.0 Pro</text>
<text x="738" y="461" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="700">51%</text>
<text x="570" y="475" font-size="11" fill="var(--fig-ink, #1C1B19)">GPT-5-Thinking</text>
<text x="738" y="475" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="700">62%</text>
