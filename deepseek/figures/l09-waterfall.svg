<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>“KV cache 降低 93.3%”的分解</title>

<line x1="70" y1="300" x2="690" y2="300" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="64" y="304" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0</text>
<line x1="70" y1="233.5" x2="690" y2="233.5" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="64" y="237.5" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">100</text>
<line x1="70" y1="167" x2="690" y2="167" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="64" y="171" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">200</text>
<line x1="70" y1="100.5" x2="690" y2="100.5" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="64" y="104.5" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">300</text>
<line x1="70" y1="34" x2="690" y2="34" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="64" y="38" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">400</text>
<text x="20" y="167" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" transform="rotate(-90 20 167)">每 token 的 KV cache（KB）</text>
<rect x="100" y="41.24" width="86" height="258.76" fill="var(--fig-muted, #74716A)" fill-opacity="0.5" rx="2"/>
<text x="143" y="33.24" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">389.12 KB</text>
<text x="143" y="318" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">DeepSeek 67B</text>
<text x="143" y="334" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">GQA-8 · 95 层 · bf16</text>
<rect x="236" y="41.24" width="86" height="185.99" fill="var(--fig-red, #A3231C)" fill-opacity="0.07" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="2" stroke-dasharray="4 3"/>
<rect x="236" y="227.22" width="86" height="72.78" fill="var(--fig-orange, #B4460C)" fill-opacity="0.55" rx="2"/>
<line x1="186" y1="41.24" x2="236" y2="41.24" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="279" y="33.24" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">576 / 2048 = ×0.281</text>
<text x="279" y="243.22" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">109.44 KB</text>
<text x="279" y="318" font-size="12.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="600">换成 MLA</text>
<rect x="372" y="227.22" width="86" height="26.81" fill="var(--fig-red, #A3231C)" fill-opacity="0.07" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="2" stroke-dasharray="4 3"/>
<rect x="372" y="254.04" width="86" height="45.96" fill="var(--fig-orange, #B4460C)" fill-opacity="0.55" rx="2"/>
<line x1="322" y1="227.22" x2="372" y2="227.22" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="415" y="219.22" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">60 / 95 = ×0.632</text>
<text x="415" y="270.04" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">69.12 KB</text>
<text x="415" y="318" font-size="12.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="600">层数 95 → 60</text>
<rect x="508" y="254.04" width="86" height="28.73" fill="var(--fig-red, #A3231C)" fill-opacity="0.07" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="2" stroke-dasharray="4 3"/>
<rect x="508" y="282.76" width="86" height="17.24" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" rx="2"/>
<line x1="458" y1="254.04" x2="508" y2="254.04" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="600" y="272.4" font-size="11.5" fill="var(--fig-red, #A3231C)">6 / 16 = ×0.375</text>
<text x="600" y="296.76" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">25.92 KB</text>
<text x="551" y="318" font-size="12.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="600">KV 量化到 6 bit</text>
<line x1="70" y1="300" x2="690" y2="300" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2"/>
<text x="428" y="92" font-size="12" fill="var(--fig-ink, #1C1B19)">到这一步（纯 MLA + 层数，bf16）：</text>
<text x="428" y="110" font-size="13" fill="var(--fig-orange, #B4460C)" font-weight="700">降低 82.2%</text>
<text x="428" y="150" font-size="13" fill="var(--fig-orange, #B4460C)" font-weight="700">再加 6 bit 量化：降低 93.3%</text>
<text x="428" y="168" font-size="12" fill="var(--fig-muted, #74716A)">= 论文图 1(b) 两根柱子的长度</text>
<text x="428" y="185" font-size="12" fill="var(--fig-muted, #74716A)">389.1 → 25.9 KB（按矢量图坐标反算）</text>
<text x="70" y="362" font-size="12.5" fill="var(--fig-ink, #1C1B19)">按对数份额：MLA 与层数贡献 64% 的降幅，量化贡献 36%。</text>
</svg>
