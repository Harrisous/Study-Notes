<rect x="20" y="398" width="14" height="12" fill="var(--fig-orange, #B4460C)" fill-opacity="0.3" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<text x="40" y="408" font-size="12" fill="var(--fig-ink, #1C1B19)">FP8（E4M3）</text>
<rect x="136.96" y="398" width="14" height="12" fill="var(--fig-orange, #B4460C)" fill-opacity="0.7" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<text x="156.96" y="408" font-size="12" fill="var(--fig-ink, #1C1B19)">FP4（E2M1）</text>
<rect x="253.92" y="398" width="14" height="12" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.3" stroke="var(--fig-blue, #1F5FA8)" stroke-width="0.8"/>
