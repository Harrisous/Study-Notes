<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>一个缓存条目的字节布局：V3.2、V4、V4.1</title>

<text x="20" y="24" font-size="12" fill="var(--fig-muted, #74716A)">每格按字节数等比例画（0.8 像素 / 字节）</text>
