<rect x="333.68" y="398" width="14" height="12" fill="var(--fig-violet, #6733C4)" fill-opacity="0.45" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="353.68" y="408" font-size="12" fill="var(--fig-ink, #1C1B19)">缩放因子</text>
