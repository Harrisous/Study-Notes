<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>decode 一步要从显存搬什么：权重被 batch 共用，KV cache 各读各的</title>
<defs><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-amber, #8A6508)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<rect x="16" y="40" width="270" height="290" fill="var(--fig-amber, #8A6508)" fill-opacity="0.05" stroke="var(--fig-muted, #74716A)" stroke-width="1.2" rx="10"/>
<text x="28" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">显存 HBM（片外，容量大，带宽有限）</text>
<rect x="30" y="56" width="242" height="62" fill="var(--fig-muted, #74716A)" fill-opacity="0.25" stroke="var(--fig-muted, #74716A)" stroke-width="1.2" rx="6"/>
<text x="42" y="80" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">权重：s · N<tspan baseline-shift="sub" font-size="11">mm</tspan> 字节</text>
<text x="42" y="100" font-size="12" fill="var(--fig-muted, #74716A)">Llama-2-7B：13.2 GB</text>
<text x="30" y="140" font-size="12" fill="var(--fig-amber, #8A6508)">序列 1 的 KV cache</text>
<rect x="30" y="144" width="242" height="18" fill="var(--fig-amber, #8A6508)" fill-opacity="0.45" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="3"/>
<text x="30" y="186" font-size="12" fill="var(--fig-amber, #8A6508)">序列 2 的 KV cache</text>
<rect x="30" y="190" width="150.04" height="18" fill="var(--fig-amber, #8A6508)" fill-opacity="0.45" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="3"/>
<text x="30" y="232" font-size="12" fill="var(--fig-amber, #8A6508)">序列 3 的 KV cache</text>
<rect x="30" y="236" width="91.96" height="18" fill="var(--fig-amber, #8A6508)" fill-opacity="0.45" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="3"/>
<text x="30" y="318" font-size="11" fill="var(--fig-muted, #74716A)">每条 2 n<tspan baseline-shift="sub" font-size="11">g</tspan> d<tspan baseline-shift="sub" font-size="11">h</tspan> l s · t 字节（4096 token：2.15 GB）</text>
<rect x="470" y="40" width="234" height="290" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.05" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" rx="10"/>
<text x="482" y="30" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">计算单元（片上，算得快）</text>
<text x="484" y="70" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">权重 × B 个新 token 的向量</text>
<text x="484" y="88" font-size="12" fill="var(--fig-ink, #1C1B19)">FLOPs = B · 2N<tspan baseline-shift="sub" font-size="11">mm</tspan></text>
<rect x="490" y="100" width="12" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.5" rx="2"/>
<rect x="508" y="100" width="12" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.5" rx="2"/>
<rect x="526" y="100" width="12" height="26" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.5" rx="2"/>
<text x="552" y="118" font-size="11" fill="var(--fig-blue, #1F5FA8)">← B = 3 个新 token</text>
<text x="484" y="165" font-size="12" fill="var(--fig-ink, #1C1B19)">q<tspan baseline-shift="super" font-size="11">(1)</tspan> 与序列 1 自己的 K、V</text>
<text x="484" y="211" font-size="12" fill="var(--fig-ink, #1C1B19)">q<tspan baseline-shift="super" font-size="11">(2)</tspan> 与序列 2 自己的 K、V</text>
<text x="484" y="257" font-size="12" fill="var(--fig-ink, #1C1B19)">q<tspan baseline-shift="super" font-size="11">(3)</tspan> 与序列 3 自己的 K、V</text>
<text x="484" y="300" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">每条 FLOPs = 4 l n<tspan baseline-shift="sub" font-size="11">h</tspan> d<tspan baseline-shift="sub" font-size="11">h</tspan> t</text>
<text x="484" y="320" font-size="11" fill="var(--fig-muted, #74716A)">（打分、加权求和各 2 l n<tspan baseline-shift="sub" font-size="11">h</tspan> d<tspan baseline-shift="sub" font-size="11">h</tspan> t）</text>
<rect x="292" y="140" width="172" height="36" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.05" rx="6"/>
<text x="378" y="134" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">带宽 BW：A100 2.039 TB/s</text>
<line x1="272" y1="86" x2="466" y2="78" stroke="var(--fig-ink, #1C1B19)" stroke-width="3.2" marker-end="url(#ah-ink)"/>
<text x="382" y="74" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">读 1 次，B 条序列共用</text>
<line x1="276" y1="153" x2="466" y2="156" stroke="var(--fig-amber, #8A6508)" stroke-width="1.8" marker-end="url(#ah-amber)"/>
<line x1="184.04" y1="199" x2="466" y2="202" stroke="var(--fig-amber, #8A6508)" stroke-width="1.8" marker-end="url(#ah-amber)"/>
<line x1="125.96" y1="245" x2="466" y2="248" stroke="var(--fig-amber, #8A6508)" stroke-width="1.8" marker-end="url(#ah-amber)"/>
<text x="390" y="302" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">各读各的，不能共用</text>
<rect x="16" y="356" width="336" height="96" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.04" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="8"/>
<text x="28" y="380" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">权重部分的算术强度（bf16，s = 2）</text>
<text x="28" y="404" font-size="13" fill="var(--fig-ink, #1C1B19)">B · 2 N<tspan baseline-shift="sub" font-size="11">mm</tspan> FLOPs ÷ 2 N<tspan baseline-shift="sub" font-size="11">mm</tspan> 字节 = B</text>
<text x="28" y="428" font-size="12" fill="var(--fig-muted, #74716A)">加大 batch 就能抬高：B 条序列分摊一次读取</text>
<rect x="368" y="356" width="336" height="96" fill="var(--fig-amber, #8A6508)" fill-opacity="0.06" stroke="var(--fig-amber, #8A6508)" stroke-width="1" rx="8"/>
<text x="380" y="380" font-size="13" fill="var(--fig-amber, #8A6508)" font-weight="600">注意力部分的算术强度（bf16，s = 2）</text>
<text x="380" y="404" font-size="13" fill="var(--fig-ink, #1C1B19)">B · 4 l n<tspan baseline-shift="sub" font-size="11">h</tspan> d<tspan baseline-shift="sub" font-size="11">h</tspan> t ÷ B · 4 l n<tspan baseline-shift="sub" font-size="11">g</tspan> d<tspan baseline-shift="sub" font-size="11">h</tspan> t = n<tspan baseline-shift="sub" font-size="11">h</tspan> / n<tspan baseline-shift="sub" font-size="11">g</tspan></text>
<text x="380" y="428" font-size="12" fill="var(--fig-muted, #74716A)">与 B、t 都无关：batch 救不了，只能减少 KV</text>
</svg>
