<text x="318" y="160" font-size="12" fill="var(--fig-blue, #1F5FA8)">W<tspan baseline-shift="super" font-size="11">Q</tspan>：8192 → 64×128 = 8192</text>
<text x="318" y="181" font-size="12" fill="var(--fig-violet, #6733C4)">W<tspan baseline-shift="super" font-size="11">K</tspan>、W<tspan baseline-shift="super" font-size="11">V</tspan>：8192 → 8×128 = 1024（各一个）</text>
<text x="318" y="202" font-size="12" fill="var(--fig-ink, #1C1B19)">W<tspan baseline-shift="super" font-size="11">O</tspan>：8192 → 8192</text>
<text x="318" y="223" font-size="12" fill="var(--fig-amber, #8A6508)">每 token 每层缓存 2×8×128 = 2048 个数（MHA 为 16384）</text>
