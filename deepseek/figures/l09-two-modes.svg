<text x="188" y="156" font-size="11.5" fill="var(--fig-green, #16704A)" text-anchor="end">V：每头 128 维</text>
<polygon points="196,164 352,164 294,196 254,196" fill="var(--fig-orange, #B4460C)" fill-opacity="0.12"/>
<text x="140" y="190" font-size="11.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle">每个 token 展开一次</text>
<text x="140" y="206" font-size="11.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle">×<tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">UK</tspan><tspan dy="4.6">、×</tspan><tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">UV</tspan></text>
<rect x="229" y="198" width="90" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.25" stroke="var(--fig-amber, #8A6508)" stroke-width="2.4" rx="4"/>
<text x="274" y="214" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="700">缓存 576</text>
<text x="36" y="246" font-size="12" fill="var(--fig-ink, #1C1B19)">每个（查询, 键）对：2 · 128 · (192 + 128)</text>
<text x="36" y="264" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">= 81,920 次运算</text>
<text x="36" y="286" font-size="12" fill="var(--fig-muted, #74716A)">每个 token 展开一次：33,554,432 次</text>
<rect x="390" y="8" width="350" height="300" fill="var(--fig-grid, #EDE9E0)" fill-opacity="0.35" rx="8"/>
<text x="565" y="30" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">MQA 模式：吸收，缓存原样当作一个 KV 头</text>
<text x="565" y="48" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">解码用它</text>
<rect x="566" y="62" width="16" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.25" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.1" rx="3"/>
