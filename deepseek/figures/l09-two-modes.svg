<rect x="598" y="115" width="92" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.28" stroke="var(--fig-amber, #8A6508)" stroke-width="2.4" rx="3"/>
<text x="644" y="131" font-size="11.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="700">[<tspan font-weight="700">c</tspan> ; <tspan font-weight="700">k</tspan><tspan dy="-4.6" font-size="11">R</tspan><tspan dy="4.6"> ]  576</tspan></text>
<rect x="598" y="142" width="81.78" height="18" fill="var(--fig-orange, #B4460C)" fill-opacity="0.28" stroke="var(--fig-amber, #8A6508)" stroke-width="2.4" rx="3"/>
<text x="638.89" y="156" font-size="11.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="700"><tspan font-weight="700">c</tspan>  512</text>
<text x="558" y="132" font-size="11.5" fill="var(--fig-violet, #6733C4)" text-anchor="end">唯一的 K</text>
<text x="558" y="156" font-size="11.5" fill="var(--fig-green, #16704A)" text-anchor="end">唯一的 V</text>
<text x="565" y="190" font-size="11.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle">缓存里的 576 维直接充当 K，其中前 512 维兼作 V；</text>
<text x="565" y="206" font-size="11.5" fill="var(--fig-orange, #B4460C)" text-anchor="middle"><tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">UK</tspan><tspan dy="4.6"> 并进查询，</tspan><tspan font-weight="700">W</tspan><tspan dy="-4.6" font-size="11">UV</tspan><tspan dy="4.6"> 挪到输出（§3）</tspan></text>
<text x="406" y="246" font-size="12" fill="var(--fig-ink, #1C1B19)">每个（查询, 键）对：2 · 128 · (576 + 512)</text>
<text x="406" y="264" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">= 278,528 次运算（MHA 模式的 3.4 倍）</text>
<text x="406" y="286" font-size="12" fill="var(--fig-muted, #74716A)">每个 token 吸收、输出各一次：33,554,432 次</text>
<text x="20" y="334" font-size="13.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">一层的账单（DeepSeek-V2 维度）</text>
<text x="20" y="360" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">场景</text>
<text x="330" y="360" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">MHA 模式</text>
<text x="490" y="360" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">MQA 模式</text>
<text x="640" y="360" font-size="12" fill="var(--fig-muted, #74716A)" font-weight="600">选哪个</text>
<line x1="20" y1="368" x2="740" y2="368" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="20" y="392" font-size="12.5" fill="var(--fig-ink, #1C1B19)">预填充 T = 4096 个 token（因果，约 T²/2 对）</text>
<text x="330" y="392" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">824.8 GFLOPs</text>
<text x="490" y="392" font-size="12.5" fill="var(--fig-ink, #1C1B19)">2,474.5 GFLOPs</text>
<text x="640" y="392" font-size="12.5" fill="var(--fig-violet, #6733C4)" font-weight="700">MHA 模式</text>
<text x="20" y="420" font-size="12.5" fill="var(--fig-ink, #1C1B19)">解码 1 个 token，缓存 T = 4096</text>
<text x="330" y="420" font-size="12.5" fill="var(--fig-ink, #1C1B19)">137.8 GFLOPs</text>
<text x="490" y="420" font-size="12.5" fill="var(--fig-ink, #1C1B19)" font-weight="700">1.174 GFLOPs</text>
<text x="640" y="420" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" font-weight="700">MQA 模式</text>
<line x1="20" y1="434" x2="740" y2="434" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="20" y="456" font-size="11.5" fill="var(--fig-muted, #74716A)">解码时 MHA 模式若不存展开后的 K、V，就得把 T 个潜向量全部重新展开；若存下来，缓存变成 71 倍。</text>
</svg>
