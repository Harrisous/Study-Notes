<text x="558" y="76" font-size="11.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">128 个查询头，每头 576 维</text>
<line x1="574" y1="80" x2="644" y2="115" stroke="var(--fig-ink, #1C1B19)" stroke-width="0.9" stroke-opacity="0.55"/>
