<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>BF16 混合精度：三种浮点格式的位布局与一步训练的数据流</title>
<defs><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<text x="16" y="22" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">浮点数 = 符号 × 2<tspan baseline-shift="super" font-size="11">指数</tspan> × 1.尾数：指数位决定范围，尾数位决定精度</text>
<text x="16" y="59" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">FP32</text>
<rect x="96" y="44" width="13.5" height="22" fill="var(--fig-muted, #74716A)" fill-opacity="0.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<rect x="109.5" y="44" width="108" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="163.5" y="60" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">指数 8</text>
<rect x="217.5" y="44" width="310.5" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.22" stroke="var(--fig-orange, #B4460C)" stroke-width="1"/>
<text x="372.75" y="60" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">尾数 23</text>
<text x="540" y="51" font-size="12" fill="var(--fig-ink, #1C1B19)">范围 ≈ 10<tspan baseline-shift="super" font-size="11">−38</tspan> … 3.4×10<tspan baseline-shift="super" font-size="11">38</tspan></text>
<text x="540" y="72" font-size="12" fill="var(--fig-muted, #74716A)">相对精度 2<tspan baseline-shift="super" font-size="11">−23</tspan> ≈ 1.2×10<tspan baseline-shift="super" font-size="11">−7</tspan></text>
<text x="16" y="107" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">BF16</text>
<rect x="96" y="92" width="13.5" height="22" fill="var(--fig-muted, #74716A)" fill-opacity="0.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<rect x="109.5" y="92" width="108" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="163.5" y="108" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">指数 8</text>
<rect x="217.5" y="92" width="94.5" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.22" stroke="var(--fig-orange, #B4460C)" stroke-width="1"/>
<text x="264.75" y="108" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">尾数 7</text>
<text x="324" y="99" font-size="12" fill="var(--fig-ink, #1C1B19)">范围与 FP32 相同</text>
<text x="324" y="120" font-size="12" fill="var(--fig-muted, #74716A)">相对精度 2<tspan baseline-shift="super" font-size="11">−7</tspan> ≈ 0.0078（2–3 位有效数字）</text>
<text x="16" y="155" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">FP16</text>
<rect x="96" y="140" width="13.5" height="22" fill="var(--fig-muted, #74716A)" fill-opacity="0.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<rect x="109.5" y="140" width="67.5" height="22" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="143.25" y="156" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">指数 5</text>
<rect x="177" y="140" width="135" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.22" stroke="var(--fig-orange, #B4460C)" stroke-width="1"/>
<text x="244.5" y="156" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">尾数 10</text>
<text x="324" y="147" font-size="12" fill="var(--fig-ink, #1C1B19)">最大只有 65,504</text>
<text x="324" y="168" font-size="12" fill="var(--fig-muted, #74716A)">相对精度 2<tspan baseline-shift="super" font-size="11">−10</tspan> ≈ 0.00098</text>
<text x="16" y="206" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一个训练步里各种数用什么格式（按 Chinchilla §4.1；m、v 的格式论文未写）</text>
<rect x="16" y="220" width="200" height="78" fill="var(--fig-amber, #8A6508)" fill-opacity="0.1" stroke="var(--fig-amber, #8A6508)" stroke-width="1.3" rx="8"/>
<text x="116" y="245.55" font-size="13" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">FP32 主权重 θ</text>
<text x="116" y="263.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">+ m、v（FP32，笔者假设）</text>
<text x="116" y="281.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">放在优化器状态里</text>
<rect x="262" y="220" width="170" height="78" fill="var(--fig-orange, #B4460C)" fill-opacity="0.12" stroke="var(--fig-orange, #B4460C)" stroke-width="1.3" rx="8"/>
<text x="347" y="245.55" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="middle" font-weight="600">BF16 权重副本</text>
<text x="347" y="263.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">每步从主权重</text>
<text x="347" y="281.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">舍入得到</text>
<rect x="478" y="220" width="226" height="78" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3" rx="8"/>
<text x="591" y="245.55" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">前向 + 反向（BF16）</text>
<text x="591" y="263.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">前向、反向的计算用 BF16</text>
<text x="591" y="281.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">得到梯度 g</text>
<rect x="262" y="330" width="170" height="62" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="8"/>
<text x="347" y="356.55" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">AdamW 更新</text>
<text x="347" y="374.55" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">在 FP32 主权重上做</text>
<line x1="217" y1="259" x2="260" y2="259" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<line x1="433" y1="259" x2="476" y2="259" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<path d="M591 299 V361 H434" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.5" marker-end="url(#ah-ink)"/>
<text x="596" y="334" font-size="12" fill="var(--fig-ink, #1C1B19)">梯度 g</text>
<path d="M261 361 H116 V300" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="1.5" marker-end="url(#ah-green)"/>
<text x="124" y="354" font-size="12" fill="var(--fig-green, #16704A)">θ ← θ − η(…)</text>
<rect x="16" y="418" width="688" height="70" fill="var(--fig-red, #A3231C)" fill-opacity="0.06" stroke="var(--fig-red, #A3231C)" stroke-width="1" rx="6"/>
<text x="28" y="438" font-size="12" fill="var(--fig-red, #A3231C)" font-weight="600">为什么主权重要 FP32：一个权重 0.02，每步更新约 η = 6×10<tspan baseline-shift="super" font-size="11">−5</tspan></text>
<text x="28" y="458" font-size="12" fill="var(--fig-ink, #1C1B19)">BF16 在 0.02 附近的间隔是 2<tspan baseline-shift="super" font-size="11">−13</tspan> ≈ 1.2×10<tspan baseline-shift="super" font-size="11">−4</tspan>，加 6×10<tspan baseline-shift="super" font-size="11">−5</tspan> 会被舍回原值。</text>
<text x="28" y="478" font-size="12" fill="var(--fig-ink, #1C1B19)">连加 1000 次：FP32 得 0.0800，BF16 仍是 0.0200（NumPy 按位模拟）。</text>
</svg>
