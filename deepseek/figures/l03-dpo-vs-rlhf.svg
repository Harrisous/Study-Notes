<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>RLHF 与 DPO 的流程对比</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<line x1="380" y1="20" x2="380" y2="300" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2"/>
<text x="198" y="26" font-size="14.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">RLHF（奖励模型 + PPO）</text>
<rect x="24" y="50" width="150" height="54" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="8"/>
<text x="99" y="72.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">偏好数据</text>
<text x="99" y="91.1" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">(q, o<tspan baseline-shift="sub" font-size="11">w</tspan>, o<tspan baseline-shift="sub" font-size="11">l</tspan>)</text>
<line x1="99" y1="106" x2="99" y2="162" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="106" y="138" font-size="12" fill="var(--fig-ink, #1C1B19)">最大似然 (3.3)</text>
<rect x="24" y="166" width="150" height="54" fill="var(--fig-green, #16704A)" fill-opacity="0.1" stroke="var(--fig-green, #16704A)" stroke-width="1.3" rx="8"/>
<text x="99" y="197.68" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">奖励模型 r<tspan baseline-shift="sub" font-size="11">φ</tspan></text>
<rect x="222" y="166" width="146" height="54" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.2" rx="8"/>
<text x="295" y="197.68" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan></text>
<rect x="222" y="50" width="146" height="54" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="8" stroke-dasharray="6 4"/>
<text x="295" y="81.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">参考 π<tspan baseline-shift="sub" font-size="11">ref</tspan>（冻结）</text>
<line x1="295" y1="106" x2="295" y2="163" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<text x="301" y="138" font-size="12" fill="var(--fig-muted, #74716A)">KL 惩罚</text>
<path d="M222 180 C 205 172, 192 172, 177 180" fill="none" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<text x="199" y="160" font-size="11.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">采样回答</text>
<path d="M177 208 C 192 216, 205 216, 219 208" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="1.6" marker-end="url(#ah-green)"/>
<text x="199" y="236" font-size="11.5" fill="var(--fig-green, #16704A)" text-anchor="middle">打分</text>
<text x="198" y="262" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">强化学习循环：采样 → 打分 → PPO 更新</text>
<text x="198" y="286" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">两个阶段 · 四个网络 · 训练中在线采样</text>
<text x="560" y="26" font-size="14.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="700">DPO（直接偏好优化）</text>
<rect x="400" y="50" width="150" height="54" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3" rx="8"/>
<text x="475" y="72.25" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">偏好数据</text>
<text x="475" y="91.1" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">(q, o<tspan baseline-shift="sub" font-size="11">w</tspan>, o<tspan baseline-shift="sub" font-size="11">l</tspan>)</text>
<rect x="572" y="50" width="150" height="54" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" rx="8" stroke-dasharray="6 4"/>
<text x="647" y="81.68" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">参考 π<tspan baseline-shift="sub" font-size="11">ref</tspan>（冻结）</text>
<line x1="475" y1="106" x2="475" y2="162" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="484" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)">最大似然：DPO 损失 (3.30)</text>
<path d="M647 106 V124 H482" fill="none" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<text x="654" y="121" font-size="12" fill="var(--fig-muted, #74716A)">log π<tspan baseline-shift="sub" font-size="11">ref</tspan></text>
<rect x="400" y="166" width="322" height="54" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.1" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.2" rx="8"/>
<text x="561" y="197.68" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="700">最终的语言模型 π<tspan baseline-shift="sub" font-size="11">θ</tspan></text>
<text x="561" y="244" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle">隐式奖励 r̂<tspan baseline-shift="sub" font-size="11">θ</tspan>(q, o) = β·log(π<tspan baseline-shift="sub" font-size="11">θ</tspan>/π<tspan baseline-shift="sub" font-size="11">ref</tspan>)</text>
<text x="561" y="266" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">（没有单独的奖励模型，也没有强化学习循环）</text>
<text x="561" y="286" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">一个阶段 · 两个网络 · 不采样</text>
<text x="16" y="318" font-size="12" fill="var(--fig-muted, #74716A)">据 DPO 论文图 1 重绘；颜色按本课程的约定。</text>
</svg>
