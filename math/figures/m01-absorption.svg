<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 534" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>同一个注意力分数的两种算法：先展开键，或先把 W^UK 吸收进查询</title>

<text x="16" y="24" font-size="14" fill="var(--fig-violet, #6733C4)" font-weight="600">Ⓐ 先展开：用 <tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan><tspan baseline-shift="sub" font-size="11">i</tspan> 把缓存里每个 <tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan> 变回键，再与查询点积</text>
<rect x="30" y="52" width="96" height="112" fill="var(--fig-orange, #B4460C)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="1.8"/>
<text x="78" y="182" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">缓存 <tspan font-weight="700">C</tspan>  [T, d<tspan baseline-shift="sub" font-size="11">c</tspan>]</text>
<text x="142" y="114" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="158" y="60" width="24" height="96" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<text x="170" y="47" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">(<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>)<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<text x="170" y="182" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="sub" font-size="11">c</tspan>, d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="198" y="114" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="214" y="52" width="24" height="112" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<text x="226" y="182" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600"><tspan font-weight="700">K</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>  [T, d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="254" y="114" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="270" y="96" width="12" height="24" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.2" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="276" y="85" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="276" y="182" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="298" y="114" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="314" y="52" width="12" height="112" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.1" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2"/>
<text x="320" y="182" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">分数 [T]</text>
<text x="400" y="70" font-size="13" fill="var(--fig-ink, #1C1B19)">每一步都要把 T 个 <tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan> 展开：</text>
<text x="400" y="92" font-size="13" fill="var(--fig-violet, #6733C4)">2Td<tspan baseline-shift="sub" font-size="11">c</tspan>d<tspan baseline-shift="sub" font-size="11">h</tspan> = 536,870,912</text>
<text x="400" y="114" font-size="13" fill="var(--fig-ink, #1C1B19)">再做 T 个 d<tspan baseline-shift="sub" font-size="11">h</tspan> 维点积：</text>
<text x="400" y="136" font-size="13" fill="var(--fig-violet, #6733C4)">2Td<tspan baseline-shift="sub" font-size="11">h</tspan> = 1,048,576</text>
<text x="400" y="160" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">合计 537,919,488（每头每步）</text>
<line x1="16" y1="196" x2="704" y2="196" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="220" font-size="14" fill="var(--fig-blue, #1F5FA8)" font-weight="600">Ⓑ 先吸收：把查询变成 d<tspan baseline-shift="sub" font-size="11">c</tspan> 维，直接与缓存点积</text>
<rect x="30" y="262" width="24" height="96" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<text x="42" y="249" font-size="12" fill="var(--fig-violet, #6733C4)" font-weight="600">(<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>)<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<text x="42" y="384" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">[d<tspan baseline-shift="sub" font-size="11">c</tspan>, d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="70" y="316" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="86" y="298" width="12" height="24" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.2" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="92" y="287" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="114" y="316" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="130" y="262" width="12" height="96" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.2" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="136" y="384" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600"><tspan font-weight="700">q̃</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>  [d<tspan baseline-shift="sub" font-size="11">c</tspan>]</text>
<text x="164" y="315" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">然后</text>
<rect x="186" y="254" width="96" height="112" fill="var(--fig-orange, #B4460C)" fill-opacity="0.14" stroke="var(--fig-amber, #8A6508)" stroke-width="1.8"/>
<text x="234" y="384" font-size="12" fill="var(--fig-amber, #8A6508)" text-anchor="middle" font-weight="600">缓存 <tspan font-weight="700">C</tspan>  [T, d<tspan baseline-shift="sub" font-size="11">c</tspan>]</text>
<text x="298" y="316" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="314" y="262" width="12" height="96" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.2" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="320" y="251" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600"><tspan font-weight="700">q̃</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="342" y="316" font-size="18" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="358" y="254" width="12" height="112" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.1" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2"/>
<text x="364" y="384" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">分数 [T]</text>
<text x="400" y="272" font-size="13" fill="var(--fig-ink, #1C1B19)">查询只变一次：</text>
<text x="400" y="294" font-size="13" fill="var(--fig-blue, #1F5FA8)">2d<tspan baseline-shift="sub" font-size="11">h</tspan>d<tspan baseline-shift="sub" font-size="11">c</tspan> = 131,072</text>
<text x="400" y="316" font-size="13" fill="var(--fig-ink, #1C1B19)">再做 T 个 d<tspan baseline-shift="sub" font-size="11">c</tspan> 维点积：</text>
<text x="400" y="338" font-size="13" fill="var(--fig-blue, #1F5FA8)">2Td<tspan baseline-shift="sub" font-size="11">c</tspan> = 4,194,304</text>
<text x="400" y="362" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="700">合计 4,325,376（每头每步）</text>
<line x1="16" y1="398" x2="704" y2="398" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="422" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">账单：d<tspan baseline-shift="sub" font-size="11">h</tspan> = 128，d<tspan baseline-shift="sub" font-size="11">c</tspan> = 512（DeepSeek-V2），T = 4096，一个头、生成一个 token</text>
<text x="140" y="456" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="end" font-weight="600">Ⓐ 先展开</text>
<rect x="150" y="442" width="440" height="18" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" rx="2"/>
<text x="598" y="456" font-size="12" fill="var(--fig-ink, #1C1B19)">5.38×10<tspan baseline-shift="super" font-size="11">8</tspan></text>
<text x="140" y="486" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="end" font-weight="600">Ⓑ 先吸收</text>
<rect x="150" y="472" width="3.54" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55" rx="2"/>
<text x="161.54" y="486" font-size="12" fill="var(--fig-ink, #1C1B19)">4.33×10<tspan baseline-shift="super" font-size="11">6</tspan></text>
<text x="150" y="522" font-size="12" fill="var(--fig-muted, #74716A)">约 124 倍。T 越大，差距越接近 d<tspan baseline-shift="sub" font-size="11">h</tspan>(1 + 1/d<tspan baseline-shift="sub" font-size="11">c</tspan>) = 128.25；T = 1 时两者几乎相等。</text>
</svg>
