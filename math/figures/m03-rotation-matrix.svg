<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 356" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>旋转矩阵的两列就是两个坐标轴被转到的位置；旋转一个向量就是给它的角度加上 φ</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<text x="185" y="24" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">① 两个坐标轴转到哪里，矩阵的两列就是什么</text>
<line x1="40" y1="227.2" x2="279.54" y2="227.2" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="128.5" y1="253.16" x2="128.5" y2="85.6" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<path d="M245.35 243.62 A118 118 0 1 0 11.65 243.62" fill="none" stroke="var(--fig-muted, #74716A)" stroke-width="1" stroke-dasharray="4 3"/>
