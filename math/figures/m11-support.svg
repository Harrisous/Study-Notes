<rect x="630" y="142" width="40" height="40" fill="var(--fig-grid, #EDE9E0)" rx="4"/>
<text x="650" y="167" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<text x="520" y="208" font-size="12" fill="var(--fig-muted, #74716A)">第 2、3 行都只能用第 1 列，</text>
<text x="520" y="228" font-size="12" fill="var(--fig-muted, #74716A)">凑不出一条全为正的对角线</text>
<text x="520" y="248" font-size="12" fill="var(--fig-red, #A3231C)">→ 永远到不了双随机矩阵：</text>
<text x="520" y="270" font-size="12" fill="var(--fig-muted, #74716A)">行步之后趋向</text>
