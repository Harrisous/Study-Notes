<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>Sinkhorn–Knopp 定理的三种情形：完全支撑、有支撑无完全支撑、没有支撑</title>

<text x="24" y="28" font-size="13" fill="var(--fig-green, #16704A)" font-weight="600">(a) 元素全为正：完全支撑</text>
<rect x="46" y="54" width="40" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="66" y="79" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">2</text>
