<text x="24" y="410" font-size="11" fill="var(--fig-muted, #74716A)">蓝格 = 正元素，灰格 = 0。定理与术语据 Sinkhorn 与 Knopp（1967）；极限由生成脚本迭代 200 轮得到。</text>
