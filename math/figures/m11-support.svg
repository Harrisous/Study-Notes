<text x="154" y="123" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<rect x="46" y="142" width="40" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="66" y="167" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<rect x="90" y="142" width="40" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="110" y="167" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">4</text>
<rect x="134" y="142" width="40" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="154" y="167" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">6</text>
<circle cx="66" cy="74" r="17" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2.2"/>
<circle cx="110" cy="118" r="17" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2.2"/>
<circle cx="154" cy="162" r="17" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2.2"/>
<text x="24" y="208" font-size="12" fill="var(--fig-muted, #74716A)">6 条对角线全为正（绿圈是其中一条）</text>
<text x="24" y="228" font-size="12" fill="var(--fig-green, #16704A)">→ 收敛到唯一的 D₁AD₂，几何级数地快</text>
<text x="24" y="256" font-size="12" fill="var(--fig-muted, #74716A)">极限（两位小数）：</text>
<text x="54" y="280" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.6</text>
<text x="94" y="280" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.18</text>
<text x="134" y="280" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.22</text>
<text x="54" y="298" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.28</text>
<text x="94" y="298" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.51</text>
