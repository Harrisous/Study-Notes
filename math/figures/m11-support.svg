<text x="280" y="28" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="600">(b) 有支撑，无完全支撑</text>
<rect x="322" y="54" width="46" height="46" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="345" y="82" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<rect x="372" y="54" width="46" height="46" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<rect x="372" y="54" width="46" height="46" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="2.2" rx="4"/>
<text x="395" y="82" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<rect x="322" y="104" width="46" height="46" fill="var(--fig-grid, #EDE9E0)" rx="4"/>
<text x="345" y="132" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<rect x="372" y="104" width="46" height="46" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="395" y="132" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<circle cx="345" cy="77" r="20" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2.2"/>
<circle cx="395" cy="127" r="20" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2.2"/>
<text x="280" y="208" font-size="12" fill="var(--fig-muted, #74716A)">正对角线只有主对角线（绿圈）；</text>
<text x="280" y="228" font-size="12" fill="var(--fig-red, #A3231C)">红框的 1 不在任何正对角线上</text>
<text x="280" y="248" font-size="12" fill="var(--fig-violet, #6733C4)">→ 它被压向 0，极限是 I，不是 D₁AD₂</text>
<text x="280" y="268" font-size="12" fill="var(--fig-violet, #6733C4)">→ 慢：第 t 轮后还剩 1/(2t+1)</text>
<text x="330" y="296" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">1</text>
<text x="370" y="296" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">0</text>
<text x="330" y="314" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">0</text>
<text x="370" y="314" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">1</text>
<path d="M312 283 h-4 v36 h4" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1"/>
<path d="M388 283 h4 v36 h-4" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1"/>
<text x="400" y="300" font-size="12" fill="var(--fig-muted, #74716A)">（t → ∞）</text>
<text x="520" y="28" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">(c) 没有正对角线：没有支撑</text>
<rect x="542" y="54" width="40" height="40" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" rx="4"/>
<text x="562" y="79" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
