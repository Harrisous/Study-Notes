<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>低秩分解 W = UV 的形状与参数账（按 DeepSeek-V2 的 MLA 维度等比例绘制）</title>
<defs><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-orange, #B4460C)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="20" y="22" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">① 存成一整张表</text>
<rect x="40" y="78" width="64" height="204.8" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" stroke="var(--fig-violet, #6733C4)" stroke-width="1.4"/>
<text x="72" y="70" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">5120 列</text>
<text x="34" y="180.4" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" transform="rotate(-90 34 180.4)">16384 行</text>
<text x="72" y="174.4" font-size="15" fill="var(--fig-violet, #6733C4)" text-anchor="middle"><tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">K</tspan></text>
<text x="72" y="194.4" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">满秩存储</text>
<text x="20" y="308.8" font-size="13" fill="var(--fig-ink, #1C1B19)">83,886,080 个参数</text>
<text x="142" y="186.4" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">对比</text>
<text x="178" y="22" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">② 存成两块瘦矩阵：<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan> <tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">DKV</tspan></text>
<rect x="214.4" y="63.6" width="64" height="6.4" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="1.2"/>
<text x="214.4" y="55.6" font-size="12" fill="var(--fig-orange, #B4460C)"><tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">DKV</tspan>：512 × 5120</text>
<rect x="200" y="78" width="6.4" height="204.8" fill="var(--fig-violet, #6733C4)" fill-opacity="0.35" stroke="var(--fig-violet, #6733C4)" stroke-width="1.2"/>
<text x="194" y="180.4" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle" transform="rotate(-90 194 180.4)"><tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan>：16384 × 512</text>
<rect x="214.4" y="78" width="64" height="204.8" fill="var(--fig-violet, #6733C4)" fill-opacity="0.04" stroke="var(--fig-violet, #6733C4)" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="246.4" y="174.4" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">乘积</text>
<text x="246.4" y="192.4" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">秩 ≤ 512</text>
<text x="246.4" y="208.4" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">不存</text>
<text x="178" y="308.8" font-size="13" fill="var(--fig-ink, #1C1B19)">8,388,608 + 2,621,440</text>
<text x="178" y="326.8" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">= 11,010,048（13.1%）</text>
<text x="400" y="22" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">③ 一个 token：<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan>(<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">DKV</tspan><tspan font-weight="700">h</tspan><tspan baseline-shift="sub" font-size="11">t</tspan>)，从右往左</text>
<rect x="409" y="218.8" width="22" height="64" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.1" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3"/>
<text x="420" y="300.8" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">h</tspan><tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="420" y="318.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">5120 维</text>
<rect x="549" y="276.4" width="22" height="6.4" fill="var(--fig-orange, #B4460C)" fill-opacity="0.22" stroke="var(--fig-orange, #B4460C)" stroke-width="1.3"/>
<text x="560" y="300.8" font-size="14" fill="var(--fig-orange, #B4460C)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">t</tspan><tspan baseline-shift="super" font-size="11">KV</tspan></text>
<text x="560" y="318.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">512 维</text>
<rect x="689" y="78" width="22" height="204.8" fill="var(--fig-violet, #6733C4)" fill-opacity="0.22" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<text x="700" y="300.8" font-size="14" fill="var(--fig-violet, #6733C4)" text-anchor="middle"><tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="700" y="318.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">16384 维</text>
<line x1="437" y1="252.8" x2="543" y2="252.8" stroke="var(--fig-orange, #B4460C)" stroke-width="1.8" marker-end="url(#ah-orange)"/>
<text x="490" y="208.8" font-size="13" fill="var(--fig-orange, #B4460C)" text-anchor="middle">乘 <tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">DKV</tspan></text>
<text x="490" y="226.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">2·512·5120</text>
<text x="490" y="242.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">= 5.24M FLOPs</text>
<line x1="577" y1="252.8" x2="683" y2="252.8" stroke="var(--fig-violet, #6733C4)" stroke-width="1.8" marker-end="url(#ah-violet)"/>
<text x="630" y="208.8" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle">乘 <tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan></text>
<text x="630" y="226.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">2·16384·512</text>
<text x="630" y="242.8" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">= 16.78M FLOPs</text>
<text x="400" y="344.8" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">两步合计 22.0M FLOPs</text>
<text x="400" y="364.8" font-size="12" fill="var(--fig-ink, #1C1B19)">直接乘满秩 <tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">K</tspan>：167.8M FLOPs（7.6 倍）</text>
<text x="400" y="382.8" font-size="12" fill="var(--fig-red, #A3231C)">先把乘积 <tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan><tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">DKV</tspan> 造出来：8.6×10<tspan baseline-shift="super" font-size="11">10</tspan> FLOPs</text>
<line x1="380" y1="40" x2="380" y2="380" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
</svg>
