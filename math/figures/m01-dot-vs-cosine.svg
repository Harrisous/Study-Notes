<text x="430" y="128" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="700">7</text>
<text x="520" y="128" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">4.12</text>
<text x="600" y="128" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.759</text>
<text x="668" y="128" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1 / 2</text>
<text x="360" y="164" font-size="14" fill="var(--fig-violet, #6733C4)"><tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">3</tspan></text>
<text x="430" y="164" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">2</text>
<text x="520" y="164" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">2.00</text>
<text x="600" y="164" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">0.447</text>
<text x="668" y="164" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">3 / 3</text>
<text x="360" y="202" font-size="12" fill="var(--fig-muted, #74716A)">排名写成“按点积 / 按余弦”。</text>
<text x="360" y="219" font-size="12" fill="var(--fig-muted, #74716A)">最长的 <tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">2</tspan> 点积最高，最同向的 <tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">1</tspan> 余弦最高。</text>
<text x="340" y="262" font-size="13" fill="var(--fig-ink, #1C1B19)">若直接对点积做 softmax（第 1 课），三个权重约为</text>
<text x="340" y="286" font-size="13" fill="var(--fig-ink, #1C1B19)">  <tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">1</tspan> 0.018，<tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">2</tspan> 0.976，<tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">3</tspan> 0.007</text>
<text x="340" y="308" font-size="13" fill="var(--fig-ink, #1C1B19)">  <tspan font-weight="700">k</tspan><tspan baseline-shift="sub" font-size="11">2</tspan> 几乎拿走全部注意力。</text>
