<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>同一个查询 q 与三个键：点积和余弦相似度给出不同的排名</title>
