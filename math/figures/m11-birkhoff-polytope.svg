<text x="150" y="252" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">J₂（a = ½）</text>
<circle cx="90" cy="226" r="4.5" fill="var(--fig-blue, #1F5FA8)"/>
<text x="90" y="214" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">a = 0.8</text>
<text x="24" y="298" font-size="12" fill="var(--fig-muted, #74716A)">维数 (2−1)² = 1，顶点 2! = 2 个</text>
<text x="24" y="318" font-size="12" fill="var(--fig-muted, #74716A)">线段上每一点都是两端的加权平均：</text>
<text x="24" y="338" font-size="12" fill="var(--fig-muted, #74716A)">[a, 1−a; 1−a, a] = a·I + (1−a)·交换</text>
<text x="310" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(b) n = 3：4 维的多面体，这里是一个线性投影</text>
