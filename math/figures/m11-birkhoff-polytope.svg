<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>Birkhoff 多面体：n = 2 是一条线段；n = 3 是 4 维的，这里画的是一个线性投影</title>

<text x="24" y="30" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">(a) n = 2：一条线段</text>
<text x="24" y="50" font-size="12" fill="var(--fig-muted, #74716A)">全部 2×2 双随机矩阵 [a, 1−a; 1−a, a]</text>
