<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 392" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>旋转的复合是角度相加；两个向量各转各的，夹角只取决于转角之差</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="180" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">① 先转 30°、再转 45°，等于一次转 75°</text>
<line x1="36.56" y1="217.6" x2="337.36" y2="217.6" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="177.36" y1="249.6" x2="177.36" y2="64" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<path d="M302.56 244.21 A128 128 0 1 0 52.16 244.21" fill="none" stroke="var(--fig-muted, #74716A)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="177.36" y1="217.6" x2="305.36" y2="217.6" stroke="var(--fig-muted, #74716A)" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<line x1="177.36" y1="217.6" x2="267.87" y2="127.09" stroke="var(--fig-violet, #6733C4)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah-violet)"/>
<line x1="177.36" y1="217.6" x2="288.21" y2="153.6" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<line x1="177.36" y1="217.6" x2="210.49" y2="93.96" stroke="var(--fig-green, #16704A)" stroke-width="2.6" marker-end="url(#ah-green)"/>
<path d="M231.12 217.6 A53.76 53.76 0 0 0 223.92 190.72" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="2"/>
<text x="244.12" y="204.71" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">30°</text>
<path d="M223.92 190.72 A53.76 53.76 0 0 0 191.27 165.67" fill="none" stroke="var(--fig-orange, #B4460C)" stroke-width="2"/>
<text x="217.74" y="164.93" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">45°</text>
<path d="M208.08 217.6 A30.72 30.72 0 0 0 185.31 187.93" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="309.36" y="233.6" font-size="12.5" fill="var(--fig-muted, #74716A)">1</text>
<text x="296.21" y="157.6" font-size="12.5" fill="var(--fig-blue, #1F5FA8)">e<tspan baseline-shift="super" font-size="11">i30°</tspan></text>
<text x="275.87" y="129.09" font-size="12.5" fill="var(--fig-violet, #6733C4)">e<tspan baseline-shift="super" font-size="11">i45°</tspan></text>
<text x="204.49" y="83.96" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">e<tspan baseline-shift="super" font-size="11">i30°</tspan>e<tspan baseline-shift="super" font-size="11">i45°</tspan> = e<tspan baseline-shift="super" font-size="11">i75°</tspan> = 0.259 + 0.966i</text>
<text x="180" y="300" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">复数：e<tspan baseline-shift="super" font-size="11">i30°</tspan> · e<tspan baseline-shift="super" font-size="11">i45°</tspan> = e<tspan baseline-shift="super" font-size="11">i(30°+45°)</tspan></text>
<text x="180" y="321" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">矩阵：R(30°) R(45°) = R(75°)</text>
<text x="180" y="342" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">(0.866 + 0.5i)(0.707 + 0.707i) = 0.259 + 0.966i</text>
<line x1="362" y1="44" x2="362" y2="360" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="551" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">② q、k 按位置各转 tθ、jθ（θ = 0.1）</text>
<text x="464" y="52" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">(t, j) = (5, 2)</text>
<line x1="379.8" y1="155.8" x2="545.4" y2="155.8" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="462.6" y1="213.4" x2="462.6" y2="65.8" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="462.6" y1="155.8" x2="498.6" y2="83.8" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
<line x1="462.6" y1="155.8" x2="480.6" y2="191.8" stroke="var(--fig-violet, #6733C4)" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
<line x1="462.6" y1="155.8" x2="459.67" y2="75.35" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<line x1="462.6" y1="155.8" x2="487.39" y2="187.51" stroke="var(--fig-violet, #6733C4)" stroke-width="2.4" marker-end="url(#ah-violet)"/>
<path d="M490.77 99.45 A63 63 0 0 0 460.31 92.84" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.4"/>
<path d="M476.28 183.17 A30.6 30.6 0 0 0 481.45 179.91" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.4"/>
<path d="M473.69 169.98 A18 18 0 0 0 461.95 137.81" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2"/>
<text x="455.67" y="69.35" font-size="11.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">q 转 28.6°</text>
<text x="491.39" y="203.51" font-size="11.5" fill="var(--fig-violet, #6733C4)" text-anchor="end">k 转 11.5°</text>
<text x="464" y="262" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">夹角 144.06°</text>
<text x="464" y="282" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">点积 −2.024045</text>
<text x="646" y="52" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">(t, j) = (13, 10)</text>
<line x1="561.8" y1="155.8" x2="727.4" y2="155.8" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="626.6" y1="213.4" x2="626.6" y2="65.8" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="626.6" y1="155.8" x2="662.6" y2="83.8" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
<line x1="626.6" y1="155.8" x2="644.6" y2="191.8" stroke="var(--fig-violet, #6733C4)" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6"/>
<line x1="626.6" y1="155.8" x2="566.85" y2="101.85" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<line x1="626.6" y1="155.8" x2="666.62" y2="160.1" stroke="var(--fig-violet, #6733C4)" stroke-width="2.4" marker-end="url(#ah-violet)"/>
<path d="M654.77 99.45 A63 63 0 0 0 579.84 113.58" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.4"/>
<path d="M640.28 183.17 A30.6 30.6 0 0 0 657.02 159.07" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.4"/>
<path d="M644.5 157.72 A18 18 0 0 0 613.24 143.74" fill="none" stroke="var(--fig-green, #16704A)" stroke-width="2"/>
<text x="562.85" y="95.85" font-size="11.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">q 转 74.5°</text>
<text x="672.62" y="164.1" font-size="11.5" fill="var(--fig-violet, #6733C4)">k 转 57.3°</text>
<text x="646" y="262" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">夹角 144.06°</text>
<text x="646" y="282" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">点积 −2.024045</text>
<text x="551" y="314" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">虚线：旋转前的 q = (1, 2)、k = (0.5, −1)，夹角 126.87°，点积 −1.5</text>
<text x="551" y="335" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">两对位置都差 3：夹角都增加 3 × 0.1 rad = 17.19°</text>
<text x="551" y="356" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">绝对位置不同，旋转后的点积完全相同：−2.024045</text>
<text x="370" y="384" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">红色弧线是各自被转过的角度，绿色弧线是转完之后 q 与 k 的夹角。</text>
</svg>
