<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>语言模型生成回答 = 在一个马尔可夫决策过程里按策略行动</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker></defs>
<text x="14" y="24" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一次生成 = 一个回合（例子：M09 通篇使用的“2+3=”玩具模型）</text>
<rect x="14" y="44" width="128" height="74" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.4" rx="8"/>
<text x="24" y="64" font-size="12" fill="var(--fig-muted, #74716A)">状态 s<tspan baseline-shift="sub" font-size="11">0</tspan></text>
<text x="78" y="90" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">“2+3=”</text>
<text x="78" y="108" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">只有提示 q</text>
<rect x="294" y="44" width="128" height="74" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.4" rx="8"/>
<text x="304" y="64" font-size="12" fill="var(--fig-muted, #74716A)">状态 s<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="358" y="90" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">“2+3=5”</text>
<text x="358" y="108" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">q + 已生成的 “5”</text>
<rect x="574" y="44" width="128" height="74" fill="var(--fig-green, #16704A)" fill-opacity="0.08" stroke="var(--fig-green, #16704A)" stroke-width="1.4" rx="8"/>
<text x="584" y="64" font-size="12" fill="var(--fig-muted, #74716A)">状态 s<tspan baseline-shift="sub" font-size="11">2</tspan>（终止）</text>
<text x="638" y="90" font-size="16" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">“2+3=5！”</text>
<text x="638" y="108" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">遇到结束符</text>
<text x="218" y="38" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan>(·|s<tspan baseline-shift="sub" font-size="11">0</tspan>)</text>
<text x="160" y="59" font-size="13" fill="var(--fig-ink, #1C1B19)">“5”</text>
<rect x="190" y="48" width="42" height="15" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85" rx="2"/>
<text x="236" y="60" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.6</text>
<text x="160" y="82" font-size="13" fill="var(--fig-ink, #1C1B19)">“6”</text>
<rect x="190" y="71" width="28" height="15" fill="var(--fig-muted, #74716A)" fill-opacity="0.35" rx="2"/>
<text x="222" y="83" font-size="12" fill="var(--fig-muted, #74716A)">0.4</text>
<line x1="142" y1="104" x2="293" y2="104" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<text x="218" y="122" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">采样 a = “5”</text>
<text x="498" y="38" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan>(·|s<tspan baseline-shift="sub" font-size="11">1</tspan>)</text>
<text x="440" y="59" font-size="13" fill="var(--fig-ink, #1C1B19)">“！”</text>
<rect x="470" y="48" width="49" height="15" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85" rx="2"/>
<text x="523" y="60" font-size="12" fill="var(--fig-blue, #1F5FA8)">0.7</text>
<text x="440" y="82" font-size="13" fill="var(--fig-ink, #1C1B19)">“吧”</text>
<rect x="470" y="71" width="21" height="15" fill="var(--fig-muted, #74716A)" fill-opacity="0.35" rx="2"/>
<text x="495" y="83" font-size="12" fill="var(--fig-muted, #74716A)">0.3</text>
<line x1="422" y1="104" x2="573" y2="104" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.6" marker-end="url(#ah-blue)"/>
<text x="498" y="122" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">采样 a = “！”</text>
<line x1="638" y1="120" x2="638" y2="144" stroke="var(--fig-green, #16704A)" stroke-width="1.6" marker-end="url(#ah-green)"/>
<rect x="580" y="146" width="116" height="44" fill="var(--fig-green, #16704A)" fill-opacity="0.12" stroke="var(--fig-green, #16704A)" stroke-width="1.2" rx="6"/>
<text x="638" y="164" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">奖励 r = 1</text>
<text x="638" y="182" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">（答对且语气肯定）</text>
<text x="14" y="162" font-size="12" fill="var(--fig-muted, #74716A)">这条回答出现的概率 = 0.6 × 0.7 = 0.42；</text>
<text x="14" y="180" font-size="12" fill="var(--fig-muted, #74716A)">转移是确定性的：下一个状态就是把 token 接到前缀末尾。</text>
<rect x="14" y="214" width="692" height="26" fill="var(--fig-grid, #EDE9E0)" fill-opacity="1"/>
<line x1="14" y1="240" x2="706" y2="240" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="232" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">强化学习</text>
<text x="178" y="232" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">语言模型（RLHF / 可验证奖励的 RL）</text>
<line x1="14" y1="266" x2="706" y2="266" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="258" font-size="13" fill="var(--fig-ink, #1C1B19)">状态 s<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="178" y="258" font-size="13" fill="var(--fig-ink, #1C1B19)">提示加上已经生成的前缀 (q, o<tspan baseline-shift="sub" font-size="11">&lt;t</tspan>)</text>
<line x1="14" y1="292" x2="706" y2="292" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="284" font-size="13" fill="var(--fig-ink, #1C1B19)">动作 a<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="178" y="284" font-size="13" fill="var(--fig-ink, #1C1B19)">下一个 token o<tspan baseline-shift="sub" font-size="11">t</tspan>：从整个词表里选一个</text>
<line x1="14" y1="318" x2="706" y2="318" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="310" font-size="13" fill="var(--fig-ink, #1C1B19)">策略 π<tspan baseline-shift="sub" font-size="11">θ</tspan>(a | s)</text>
<text x="178" y="310" font-size="13" fill="var(--fig-ink, #1C1B19)">语言模型最后一层 softmax 给出的下一个 token 分布</text>
<line x1="14" y1="344" x2="706" y2="344" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="336" font-size="13" fill="var(--fig-ink, #1C1B19)">转移 P(s′ | s, a)</text>
<text x="178" y="336" font-size="13" fill="var(--fig-ink, #1C1B19)">确定性：s<tspan baseline-shift="sub" font-size="11">t+1</tspan> = s<tspan baseline-shift="sub" font-size="11">t</tspan> 接上 a<tspan baseline-shift="sub" font-size="11">t</tspan>，没有外部随机性</text>
<line x1="14" y1="370" x2="706" y2="370" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="362" font-size="13" fill="var(--fig-ink, #1C1B19)">奖励 r<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="178" y="362" font-size="13" fill="var(--fig-ink, #1C1B19)">奖励模型或规则在回答结束时打一次分（RLHF 另有每 token 的 KL 项）</text>
<line x1="14" y1="396" x2="706" y2="396" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="22" y="388" font-size="13" fill="var(--fig-ink, #1C1B19)">回合、折扣 γ</text>
<text x="178" y="388" font-size="13" fill="var(--fig-ink, #1C1B19)">一段回答，遇到结束符 EOS 停止；长度有限，通常取 γ = 1</text>
<line x1="170" y1="214" x2="170" y2="396" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<rect x="14" y="214" width="692" height="182" fill="none" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
</svg>
