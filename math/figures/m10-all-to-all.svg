<text x="20" y="26" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">① all-to-all：每张卡给其余每张卡各发一块不同的数据</text>
<text x="20" y="232" font-size="12" fill="var(--fig-ink, #1C1B19)">成对交换：第 k 步，GPU i 与 GPU (i XOR k) 互换一块，</text>
<text x="20" y="250" font-size="12" fill="var(--fig-ink, #1C1B19)">共 p − 1 = 3 步。灰色对角块留在本卡，不上网络。</text>
<text x="20" y="274" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">带宽项只看每卡要发出的总字节 S：</text>
<text x="20" y="292" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">时间 ≈ (p − 1)α + Sβ</text>
<text x="474" y="26" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">② V3 一个 token 的 MoE 通信（示意）</text>
<text x="474" y="62" font-size="12" fill="var(--fig-ink, #1C1B19)">dispatch，8 份</text>
<rect x="474" y="69" width="92.81" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55" rx="2"/>
<text x="572.81" y="83" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">57.8 KiB</text>
<text x="474" y="112" font-size="12" fill="var(--fig-ink, #1C1B19)">combine，8 份</text>
<rect x="474" y="119" width="180" height="18" fill="var(--fig-green, #16704A)" fill-opacity="0.55" rx="2"/>
<text x="660" y="133" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">112.0 KiB</text>
<text x="474" y="162" font-size="12" fill="var(--fig-ink, #1C1B19)">跨节点 dispatch，≤ 4 份</text>
<rect x="474" y="169" width="46.41" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85" rx="2"/>
<text x="526.41" y="183" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">28.9 KiB</text>
<text x="474" y="212" font-size="12" fill="var(--fig-ink, #1C1B19)">跨节点 combine，≤ 4 份</text>
<rect x="474" y="219" width="90" height="18" fill="var(--fig-green, #16704A)" fill-opacity="0.85" rx="2"/>
<text x="570" y="233" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">56.0 KiB</text>
<text x="474" y="272" font-size="11" fill="var(--fig-muted, #74716A)">每份 dispatch：FP8 的 7168 字节</text>
<text x="474" y="288" font-size="11" fill="var(--fig-muted, #74716A)">+ 每 128 个数一个 FP32 缩放 = 7392 字节；</text>
<text x="474" y="304" font-size="11" fill="var(--fig-muted, #74716A)">每份 combine：BF16，14,336 字节。</text>
<text x="474" y="320" font-size="11" fill="var(--fig-muted, #74716A)">节点受限路由把跨节点的份数压到 4 以内。</text>
</svg>
