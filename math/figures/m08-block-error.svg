<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>一个离群值的代价：格式 × 缩放粒度</title>

