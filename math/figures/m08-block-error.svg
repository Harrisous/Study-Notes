<text x="540.04" y="187" font-size="12" fill="var(--fig-blue, #1F5FA8)">2.4%</text>
<text x="250" y="225" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">FP8 · 整张量，离群值 10<tspan baseline-shift="super" font-size="11">5</tspan></text>
<rect x="270" y="212" width="29.58" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="305.58" y="225" font-size="12" fill="var(--fig-blue, #1F5FA8)">17.4%</text>
<rect x="530" y="212" width="28.72" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="564.72" y="225" font-size="12" fill="var(--fig-blue, #1F5FA8)">16.9%</text>
<text x="250" y="263" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end">FP8 · 每 128 个，离群值 10<tspan baseline-shift="super" font-size="11">5</tspan></text>
<rect x="270" y="250" width="3.82" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="279.82" y="263" font-size="12" fill="var(--fig-blue, #1F5FA8)">2.2%</text>
<rect x="530" y="250" width="4.21" height="18" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.75"/>
<text x="540.21" y="263" font-size="12" fill="var(--fig-blue, #1F5FA8)">2.5%</text>
<text x="16" y="334" font-size="11" fill="var(--fig-muted, #74716A)">设置：1024 个 N(0,1) 随机数，其中一个换成离群值（前四行 50，后两行 10<tspan baseline-shift="super" font-size="11">5</tspan>）；统计其余 1023 个数。缩放因子 s = 块内最大绝对值 / 格式最大值</text>
</svg>
