<line x1="336.67" y1="36" x2="336.67" y2="336" stroke="var(--fig-muted, #74716A)" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="336.67" y="354" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1.2</text>
<line x1="403.33" y1="36" x2="403.33" y2="336" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="403.33" y="354" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1.4</text>
<line x1="470" y1="36" x2="470" y2="336" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="470" y="354" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1.6</text>
<line x1="70" y1="306" x2="470" y2="306" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="62" y="310" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">−1.0</text>
<line x1="70" y1="246" x2="470" y2="246" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="62" y="250" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">−0.5</text>
<line x1="70" y1="186" x2="470" y2="186" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3"/>
<text x="62" y="190" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">0</text>
<line x1="70" y1="126" x2="470" y2="126" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="62" y="130" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">+0.5</text>
<line x1="70" y1="66" x2="470" y2="66" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="62" y="70" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">+1.0</text>
<rect x="70" y="36" width="400" height="300" fill="none" stroke="var(--fig-muted, #74716A)" stroke-width="1.1"/>
<text x="270" y="376" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">概率比 ρ = π<tspan baseline-shift="sub" font-size="11">θ</tspan> / π<tspan baseline-shift="sub" font-size="11">θold</tspan></text>
<text x="22" y="186" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle" transform="rotate(-90 22 186)">优势 A</text>
<text x="203.33" y="28" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1 − ε</text>
<text x="336.67" y="28" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1 + ε</text>
<text x="270" y="28" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">起点 ρ = 1</text>
<line x1="223.33" y1="120" x2="323.33" y2="120" stroke="var(--fig-green, #16704A)" stroke-width="2" marker-end="url(#ah-green)"/>
<line x1="90" y1="120" x2="183.33" y2="120" stroke="var(--fig-green, #16704A)" stroke-width="2" marker-end="url(#ah-green)"/>
<line x1="316.67" y1="252" x2="216.67" y2="252" stroke="var(--fig-green, #16704A)" stroke-width="2" marker-end="url(#ah-green)"/>
<line x1="450" y1="252" x2="356.67" y2="252" stroke="var(--fig-green, #16704A)" stroke-width="2" marker-end="url(#ah-green)"/>
<rect x="218" y="97" width="104" height="18" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="270" y="110" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">好动作：推高概率</text>
<rect x="218" y="261" width="104" height="18" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="270" y="274" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">坏动作：压低概率</text>
<text x="136.67" y="110" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">反而降了：照常拉回</text>
<text x="403.33" y="274" font-size="12" fill="var(--fig-green, #16704A)" text-anchor="middle">反而涨了：照常压回</text>
<text x="403.33" y="156" font-size="12.5" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">已涨够：梯度 0</text>
<text x="136.67" y="220" font-size="12.5" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">已压够：梯度 0</text>
<circle cx="370" cy="66" r="5.5" fill="var(--fig-red, #A3231C)"/>
<text x="342.67" y="54" font-size="12" fill="var(--fig-red, #A3231C)" font-weight="600">ℓ = 1.2，梯度 0</text>
<circle cx="370" cy="306" r="5.5" fill="var(--fig-blue, #1F5FA8)"/>
<text x="342.67" y="328" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">ℓ = −1.3，梯度 = A</text>
<circle cx="170" cy="66" r="5.5" fill="var(--fig-blue, #1F5FA8)"/>
<text x="197.33" y="54" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="end" font-weight="600">ℓ = 0.7，梯度 = A</text>
<circle cx="170" cy="306" r="5.5" fill="var(--fig-red, #A3231C)"/>
<text x="197.33" y="328" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="end" font-weight="600">ℓ = −0.8，梯度 0</text>
<text x="492" y="42" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">单个 token 的目标</text>
<text x="492" y="61" font-size="12" fill="var(--fig-ink, #1C1B19)">ℓ(ρ, A) = min(ρA, clip(ρ, 1−ε, 1+ε)·A)</text>
<text x="492" y="80" font-size="12" fill="var(--fig-muted, #74716A)">ε = 0.2</text>
<text x="492" y="108" font-size="12" fill="var(--fig-red, #A3231C)">红色区域：ℓ 对 ρ 是常数，</text>
<text x="492" y="127" font-size="12" fill="var(--fig-red, #A3231C)">这个 token 不再提供梯度。</text>
<text x="492" y="155" font-size="12" fill="var(--fig-ink, #1C1B19)">白色区域：∂ℓ/∂ρ = A，</text>
<text x="492" y="174" font-size="12" fill="var(--fig-ink, #1C1B19)">和未裁剪的 ρA 一样。</text>
<text x="492" y="202" font-size="12" fill="var(--fig-green, #16704A)">绿色箭头：梯度上升把 ρ</text>
<text x="492" y="221" font-size="12" fill="var(--fig-green, #16704A)">往哪边推。只在“往好的</text>
<text x="492" y="240" font-size="12" fill="var(--fig-green, #16704A)">方向已经走够”时停下；</text>
<text x="492" y="259" font-size="12" fill="var(--fig-green, #16704A)">往坏的方向越界照常惩罚。</text>
<text x="492" y="287" font-size="12" fill="var(--fig-muted, #74716A)">四个点：正文例题的四种情形</text>
</svg>
