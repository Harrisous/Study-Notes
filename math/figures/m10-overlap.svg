<text x="16" y="280" font-size="11" fill="var(--fig-muted, #74716A)">② 的总长 = b + a/8：每块的计算都藏在下一块的搬运后面，只剩最后一块的计算露在外面（琥珀 = 搬运，蓝 = 计算）。</text>
<text x="16" y="298" font-size="11" fill="var(--fig-muted, #74716A)">切成 8 块只是示意：块越多，露在外面的尾巴越短，总时间越接近下界；这条尾巴和 §5 流水线的“填充与排空”是同一回事。</text>
