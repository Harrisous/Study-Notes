<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>点积的几何意义：a·b 等于 |a| 乘以 b 在 a 方向上的影子长</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<line x1="64" y1="300" x2="64" y2="42.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="64" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">0</text>
<line x1="120" y1="300" x2="120" y2="42.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="120" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1</text>
<line x1="176" y1="300" x2="176" y2="42.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="176" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">2</text>
<line x1="232" y1="300" x2="232" y2="42.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="232" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">3</text>
<line x1="288" y1="300" x2="288" y2="42.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="288" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">4</text>
<line x1="344" y1="300" x2="344" y2="42.4" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="344" y="318" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">5</text>
<line x1="64" y1="300" x2="366.4" y2="300" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<line x1="64" y1="244" x2="366.4" y2="244" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="54" y="248" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">1</text>
<line x1="64" y1="188" x2="366.4" y2="188" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="54" y="192" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">2</text>
<line x1="64" y1="132" x2="366.4" y2="132" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="54" y="136" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">3</text>
<line x1="64" y1="76" x2="366.4" y2="76" stroke="var(--fig-grid, #EDE9E0)" stroke-width="1"/>
<text x="54" y="80" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">4</text>
<line x1="64" y1="300" x2="372" y2="300" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<line x1="64" y1="300" x2="64" y2="36.8" stroke="var(--fig-muted, #74716A)" stroke-width="1.2"/>
<line x1="64" y1="300" x2="368.24" y2="223.94" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.6"/>
<line x1="64" y1="300" x2="208.94" y2="263.76" stroke="var(--fig-violet, #6733C4)" stroke-width="7" stroke-opacity="0.28" stroke-linecap="round"/>
<line x1="176" y1="132" x2="208.94" y2="263.76" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3" stroke-dasharray="4 3"/>
<path d="M200.2 265.9 L198.1 257.2 L206.8 255.1" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.1"/>
<path d="M112.9 287.8 A50.4 50.4 0 0 0 92.0 258.1" fill="none" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2"/>
<text x="118.93" y="266.89" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">θ</text>
<line x1="64" y1="300" x2="288" y2="244" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<line x1="64" y1="300" x2="176" y2="132" stroke="var(--fig-violet, #6733C4)" stroke-width="2.4" marker-end="url(#ah-violet)"/>
<text x="296" y="260" font-size="14" fill="var(--fig-blue, #1F5FA8)"><tspan font-weight="700">a</tspan> = (4, 1)</text>
<text x="168" y="122" font-size="14" fill="var(--fig-violet, #6733C4)" text-anchor="end"><tspan font-weight="700">b</tspan> = (2, 3)</text>
<line x1="153.86" y1="282.53" x2="171.86" y2="326" stroke="var(--fig-violet, #6733C4)" stroke-width="1"/>
<text x="173.86" y="338" font-size="13" fill="var(--fig-violet, #6733C4)">影子长 2.67（沿 <tspan font-weight="700">a</tspan> 方向量）</text>
<rect x="394" y="28" width="318" height="262" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="10"/>
<text x="410" y="58" font-size="14" fill="var(--fig-ink, #1C1B19)"><tspan font-weight="700">a</tspan>·<tspan font-weight="700">b</tspan> = 4×2 + 1×3 = 11</text>
<text x="410" y="87" font-size="14" fill="var(--fig-ink, #1C1B19)">|<tspan font-weight="700">a</tspan>| = √17 ≈ 4.12，|<tspan font-weight="700">b</tspan>| = √13 ≈ 3.61</text>
<text x="410" y="116" font-size="14" fill="var(--fig-ink, #1C1B19)">cos θ = 11 ÷ (4.12 × 3.61) ≈ 0.740</text>
<text x="410" y="145" font-size="14" fill="var(--fig-ink, #1C1B19)">θ ≈ 42.3°</text>
<text x="410" y="174" font-size="14" fill="var(--fig-violet, #6733C4)"><tspan font-weight="700">b</tspan> 在 <tspan font-weight="700">a</tspan> 方向上的影子长</text>
<text x="410" y="203" font-size="14" fill="var(--fig-violet, #6733C4)">   |<tspan font-weight="700">b</tspan>| cos θ = 11 ÷ 4.12 ≈ 2.67</text>
<text x="410" y="232" font-size="14" fill="var(--fig-blue, #1F5FA8)"><tspan font-weight="700">a</tspan>·<tspan font-weight="700">b</tspan> = |<tspan font-weight="700">a</tspan>| × 影子长</text>
<text x="410" y="261" font-size="14" fill="var(--fig-blue, #1F5FA8)">   = 4.12 × 2.67 ≈ 11</text>
</svg>
