<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>单个注意力头里的三次矩阵乘法，按 GPT-2 small 的真实形状等比例绘制</title>

<text x="16" y="22" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">① 投影：每个 token 的 768 维隐藏状态 → 这个头的 64 维查询（键、值同理）</text>
<rect x="40" y="44" width="99.84" height="133.12" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.07" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3"/>
<text x="89.92" y="195.12" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600"><tspan font-weight="700">H</tspan>  [T, d]</text>
<text x="89.92" y="212.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">[1024, 768]</text>
<text x="161.84" y="117.56" font-size="20" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="183.84" y="60.64" width="8.32" height="99.84" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.16" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="188" y="178.48" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">  </text>
<text x="188" y="195.48" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="200.16" y="74.64" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">(<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">Q</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>)<tspan baseline-shift="super" font-size="11">⊤</tspan>  [d, d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="200.16" y="96.64" font-size="12" fill="var(--fig-muted, #74716A)">[768, 64]</text>
<text x="302.16" y="117.56" font-size="20" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="328.16" y="44" width="8.32" height="133.12" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.16" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="332.32" y="195.12" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">  </text>
<text x="332.32" y="212.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="344.48" y="58" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600"><tspan font-weight="700">Q</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>  [T, d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="344.48" y="80" font-size="12" fill="var(--fig-muted, #74716A)">[1024, 64]</text>
<text x="344.48" y="171.12" font-size="12" fill="var(--fig-muted, #74716A)">1.01×10<tspan baseline-shift="super" font-size="11">8</tspan> 次运算</text>
<rect x="470" y="48" width="234" height="92" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="8"/>
<text x="484" y="70" font-size="12" fill="var(--fig-muted, #74716A)">等比例绘制：方块边长与维度成正比</text>
<text x="484" y="90" font-size="12" fill="var(--fig-muted, #74716A)">T = 1024（序列长度）</text>
<text x="484" y="108" font-size="12" fill="var(--fig-muted, #74716A)">d = 768，d<tspan baseline-shift="sub" font-size="11">h</tspan> = 64（GPT-2 small）</text>
<text x="484" y="128" font-size="12" fill="var(--fig-red, #A3231C)">红色：因果掩码丢掉的上三角</text>
<line x1="16" y1="238" x2="704" y2="238" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="262" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">② 打分：<tspan font-weight="700">S</tspan><tspan baseline-shift="sub" font-size="11">i</tspan> = <tspan font-weight="700">Q</tspan><tspan baseline-shift="sub" font-size="11">i</tspan><tspan font-weight="700">K</tspan><tspan baseline-shift="sub" font-size="11">i</tspan><tspan baseline-shift="super" font-size="11">⊤</tspan> / √d<tspan baseline-shift="sub" font-size="11">h</tspan></text>
<rect x="40" y="290" width="8.32" height="133.12" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.16" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="44.16" y="441.12" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">  </text>
<text x="44.16" y="458.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="44.16" y="441.12" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600"><tspan font-weight="700">Q</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="64.32" y="363.56" font-size="20" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="80.32" y="352.4" width="133.12" height="8.32" fill="var(--fig-violet, #6733C4)" fill-opacity="0.16" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<text x="146.88" y="378.72" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">  </text>
<text x="146.88" y="395.72" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="146.88" y="342.4" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600"><tspan font-weight="700">K</tspan><tspan baseline-shift="sub" font-size="11">i</tspan><tspan baseline-shift="super" font-size="11">⊤</tspan>  [d<tspan baseline-shift="sub" font-size="11">h</tspan>, T]</text>
<text x="229.44" y="363.56" font-size="20" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="245.44" y="290" width="133.12" height="133.12" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<polygon points="245.44,290 378.56,290 378.56,423.12" fill="var(--fig-red, #A3231C)" fill-opacity="0.16"/>
<line x1="245.44" y1="290" x2="378.56" y2="423.12" stroke="var(--fig-red, #A3231C)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="312" y="441.12" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">  </text>
<text x="312" y="458.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="312" y="441.12" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600"><tspan font-weight="700">S</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>  [T, T]</text>
<text x="312" y="464.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1.34×10<tspan baseline-shift="super" font-size="11">8</tspan> 次运算</text>
<line x1="394" y1="250" x2="394" y2="464" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="408" y="262" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">③ 加权求和：<tspan font-weight="700">O</tspan><tspan baseline-shift="sub" font-size="11">i</tspan> = softmax(<tspan font-weight="700">S</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>) <tspan font-weight="700">V</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<rect x="416" y="290" width="133.12" height="133.12" fill="var(--fig-violet, #6733C4)" fill-opacity="0.1" stroke="var(--fig-violet, #6733C4)" stroke-width="1.3"/>
<polygon points="416,290 549.12,290 549.12,423.12" fill="var(--fig-red, #A3231C)" fill-opacity="0.16"/>
<line x1="416" y1="290" x2="549.12" y2="423.12" stroke="var(--fig-red, #A3231C)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="482.56" y="441.12" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600">  </text>
<text x="482.56" y="458.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="482.56" y="441.12" font-size="13" fill="var(--fig-violet, #6733C4)" text-anchor="middle" font-weight="600"><tspan font-weight="700">P</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>  [T, T]</text>
<text x="565.12" y="363.56" font-size="20" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="581.12" y="290" width="8.32" height="133.12" fill="var(--fig-green, #16704A)" fill-opacity="0.16" stroke="var(--fig-green, #16704A)" stroke-width="1.3"/>
<text x="585.28" y="441.12" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">  </text>
<text x="585.28" y="458.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="585.28" y="441.12" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600"><tspan font-weight="700">V</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="605.44" y="363.56" font-size="20" fill="var(--fig-muted, #74716A)" text-anchor="middle">=</text>
<rect x="621.44" y="290" width="8.32" height="133.12" fill="var(--fig-green, #16704A)" fill-opacity="0.16" stroke="var(--fig-green, #16704A)" stroke-width="1.3"/>
<text x="625.6" y="441.12" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">  </text>
<text x="625.6" y="458.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle"></text>
<text x="625.6" y="441.12" font-size="13" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600"><tspan font-weight="700">O</tspan><tspan baseline-shift="sub" font-size="11">i</tspan></text>
<text x="637.76" y="304" font-size="12" fill="var(--fig-muted, #74716A)">[T, d<tspan baseline-shift="sub" font-size="11">h</tspan>]</text>
<text x="522.56" y="464.12" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">1.34×10<tspan baseline-shift="super" font-size="11">8</tspan> 次运算</text>
</svg>
