<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>把 h 正交投影到由 u1、u2 张成的平面上：保留投影 p，丢弃垂直分量 r</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<line x1="142.2" y1="256.29" x2="290.4" y2="364.77" stroke="var(--fig-muted, #74716A)" stroke-width="1.1"/>
<text x="296.4" y="368.77" font-size="13" fill="var(--fig-muted, #74716A)" font-style="italic">x</text>
<line x1="136.49" y1="265.3" x2="379.67" y2="205.96" stroke="var(--fig-muted, #74716A)" stroke-width="1.1"/>
<text x="385.67" y="209.96" font-size="13" fill="var(--fig-muted, #74716A)" font-style="italic">y</text>
<line x1="150" y1="276.14" x2="150" y2="28.72" stroke="var(--fig-muted, #74716A)" stroke-width="1.1"/>
<text x="156" y="32.72" font-size="13" fill="var(--fig-muted, #74716A)" font-style="italic">z</text>
<polygon points="106.62,278.55 243.12,378.46 391.19,187.38 254.69,87.46" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.08" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1"/>
<text x="239.12" y="398.46" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">子空间：<tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">1</tspan>、<tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">2</tspan> 张成的平面</text>
<line x1="150" y1="262" x2="189" y2="290.55" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<line x1="150" y1="262" x2="197.77" y2="200.36" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<text x="193" y="306.55" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="700"><tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="189.77" y="194.36" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="end" font-weight="700"><tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">2</tspan></text>
<line x1="150" y1="262" x2="160.45" y2="123.5" stroke="var(--fig-ink, #1C1B19)" stroke-width="2.4" marker-end="url(#ah-ink)"/>
<line x1="150" y1="262" x2="295.55" y2="231.92" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.8" marker-end="url(#ah-blue)"/>
<line x1="295.55" y1="231.92" x2="160.45" y2="123.5" stroke="var(--fig-red, #A3231C)" stroke-width="1.8" stroke-dasharray="6 4"/>
<path d="M282.2 221.2 L265.5 224.6 L278.9 235.4" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.1"/>
<circle cx="160.45" cy="123.5" r="3.5" fill="var(--fig-ink, #1C1B19)"/>
<circle cx="295.55" cy="231.92" r="3.5" fill="var(--fig-blue, #1F5FA8)"/>
<text x="150.45" y="113.5" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600"><tspan font-weight="700">h</tspan> = (2, −1, 3)</text>
<text x="303.55" y="253.92" font-size="14" fill="var(--fig-blue, #1F5FA8)" font-weight="600"><tspan font-weight="700">p</tspan> = (2, 1, 1)</text>
<text x="242" y="167.71" font-size="13" fill="var(--fig-red, #A3231C)"><tspan font-weight="700">r</tspan> = (0, −2, 2)</text>
<text x="242" y="184.71" font-size="12" fill="var(--fig-red, #A3231C)">垂直于平面，被丢弃</text>
<rect x="460" y="36" width="262" height="250" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1.2" rx="10"/>
<text x="474" y="64" font-size="13" fill="var(--fig-ink, #1C1B19)"><tspan font-weight="700">U</tspan> = [<tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">1</tspan> <tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">2</tspan>]，<tspan font-weight="700">U</tspan><tspan baseline-shift="super" font-size="11">⊤</tspan><tspan font-weight="700">U</tspan> = <tspan font-weight="700">I</tspan></text>
<text x="474" y="91" font-size="13" fill="var(--fig-blue, #1F5FA8)">坐标 <tspan font-weight="700">U</tspan><tspan baseline-shift="super" font-size="11">⊤</tspan><tspan font-weight="700">h</tspan> = (2, 1.41)</text>
<text x="474" y="118" font-size="13" fill="var(--fig-muted, #74716A)">   即 (2, √2)</text>
<text x="474" y="145" font-size="13" fill="var(--fig-blue, #1F5FA8)">投影 <tspan font-weight="700">p</tspan> = <tspan font-weight="700">UU</tspan><tspan baseline-shift="super" font-size="11">⊤</tspan><tspan font-weight="700">h</tspan> = (2, 1, 1)</text>
<text x="474" y="172" font-size="13" fill="var(--fig-red, #A3231C)">残差 <tspan font-weight="700">r</tspan> = <tspan font-weight="700">h</tspan> − <tspan font-weight="700">p</tspan> = (0, −2, 2)</text>
<text x="474" y="199" font-size="13" fill="var(--fig-red, #A3231C)"><tspan font-weight="700">r</tspan>·<tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">1</tspan> = 0，<tspan font-weight="700">r</tspan>·<tspan font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="11">2</tspan> = 0</text>
<text x="474" y="226" font-size="13" fill="var(--fig-ink, #1C1B19)">|<tspan font-weight="700">h</tspan>|<tspan baseline-shift="super" font-size="11">2</tspan> = 14 = |<tspan font-weight="700">p</tspan>|<tspan baseline-shift="super" font-size="11">2</tspan> + |<tspan font-weight="700">r</tspan>|<tspan baseline-shift="super" font-size="11">2</tspan></text>
<text x="474" y="253" font-size="13" fill="var(--fig-muted, #74716A)">         = 6 + 8</text>
</svg>
