<text x="250" y="206" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle"><tspan font-weight="700">q</tspan><tspan baseline-shift="sub" font-size="11">t,i</tspan><tspan baseline-shift="super" font-size="11">C</tspan></text>
<text x="250" y="225" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">128</text>
<rect x="341" y="175.2" width="18" height="12.8" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.22" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="350" y="206" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle"><tspan font-weight="700">q̃</tspan><tspan baseline-shift="sub" font-size="11">t,i</tspan></text>
<text x="350" y="225" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">512</text>
<line x1="54" y1="158" x2="136" y2="158" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.6" marker-end="url(#ah-ink)"/>
<text x="95" y="146" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">DQ</tspan></text>
