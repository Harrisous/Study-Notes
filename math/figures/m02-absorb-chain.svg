<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 436" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>吸收后的 MLA 单头解码：先把查询变成 512 维，再直接与缓存点积；两个固定乘积不预先乘出</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-green, #16704A)"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="14" y="24" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">① 打分：查询先变成 512 维（每步 1 次），再和缓存里的每个 <tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">j</tspan> 点积</text>
<rect x="31" y="60" width="18" height="128" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.08" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3"/>
<text x="40" y="206" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">h</tspan><tspan baseline-shift="sub" font-size="11">t</tspan></text>
<text x="40" y="225" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">5120</text>
<rect x="141" y="149.6" width="18" height="38.4" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.08" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.3"/>
<text x="150" y="206" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">t</tspan><tspan baseline-shift="super" font-size="11">Q</tspan></text>
<text x="150" y="225" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">1536</text>
