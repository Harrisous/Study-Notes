<text x="300" y="146" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">(<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>)<tspan baseline-shift="super" font-size="11">⊤</tspan></text>
<path d="M154 108 v-10 h192 v10" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="250" y="72" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">不预乘：(<tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UK</tspan><tspan baseline-shift="sub" font-size="11">i</tspan>)<tspan baseline-shift="super" font-size="11">⊤</tspan><tspan font-weight="700">W</tspan><tspan baseline-shift="super" font-size="11">UQ</tspan><tspan baseline-shift="sub" font-size="11">i</tspan> 是 512×1536</text>
<text x="250" y="92" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">秩 ≤ 128；整存参数 3.0 倍</text>
