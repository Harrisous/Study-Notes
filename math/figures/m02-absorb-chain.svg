<text x="456" y="202" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="596" y="202" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle"><tspan font-weight="700">c</tspan><tspan baseline-shift="sub" font-size="11">T</tspan></text>
<text x="526" y="202" font-size="12" fill="var(--fig-orange, #B4460C)" text-anchor="middle">…</text>
