<text x="479" y="134" font-size="12.5" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">A = −0.35</text>
<line x1="382" y1="278" x2="574.07" y2="224.54" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="433" y="230" width="92" height="38" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="5"/>
<text x="479" y="246" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">“！” π = 0.5</text>
<text x="479" y="263" font-size="12.5" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">A = −0.10</text>
<line x1="382" y1="278" x2="574.03" y2="313.64" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="433" y="275" width="92" height="38" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="5"/>
<text x="479" y="291" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">“吧” π = 0.5</text>
<text x="479" y="308" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">A = +0.10</text>
<line x1="16" y1="366" x2="704" y2="366" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="16" y="384" font-size="12" fill="var(--fig-muted, #74716A)">V(“2+3=5”) = 0.7×1 + 0.3×0.5 = 0.85；V(“2+3=6”) = 0.5×0 + 0.5×0.2 = 0.10；V(“2+3=”) = 0.6×0.85 + 0.4×0.10 = 0.55</text>
<text x="16" y="404" font-size="12" fill="var(--fig-muted, #74716A)">Q(s, a) = 走这一步之后的价值；A(s, a) = Q(s, a) − V(s)。例：A(“2+3=”, “5”) = 0.85 − 0.55 = +0.30。</text>
<text x="16" y="424" font-size="12" fill="var(--fig-muted, #74716A)">每个状态上 Σ π(a|s)·A(s, a) = 0：0.6×0.30 + 0.4×(−0.45) = 0，0.7×0.15 + 0.3×(−0.35) = 0。</text>
</svg>
