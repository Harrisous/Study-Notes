<rect x="151" y="128" width="92" height="38" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="5"/>
<text x="197" y="144" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">“5” π = 0.6</text>
<text x="197" y="161" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">A = +0.30</text>
<line x1="136" y1="192" x2="256.37" y2="276.85" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="151" y="214" width="92" height="38" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="5"/>
<text x="197" y="230" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">“6” π = 0.4</text>
<text x="197" y="247" font-size="12.5" fill="var(--fig-red, #A3231C)" text-anchor="middle" font-weight="600">A = −0.45</text>
<line x1="382" y1="106" x2="574.08" y2="48.57" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="433" y="56" width="92" height="38" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="5"/>
<text x="479" y="72" font-size="12.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">“！” π = 0.7</text>
<text x="479" y="89" font-size="12.5" fill="var(--fig-green, #16704A)" text-anchor="middle" font-weight="600">A = +0.15</text>
<line x1="382" y1="106" x2="574.03" y2="137.67" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="433" y="101" width="92" height="38" fill="var(--fig-surface, #FFFFFF)" fill-opacity="1" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1" rx="5"/>
