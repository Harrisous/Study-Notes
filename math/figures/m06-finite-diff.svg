<text x="425.44" y="124.67" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">截断误差（前向）∝ h</text>
<text x="441" y="261.43" font-size="12" fill="var(--fig-violet, #6733C4)">截断误差（中心）</text>
<text x="441" y="278.43" font-size="12" fill="var(--fig-violet, #6733C4)">∝ h²</text>
<text x="92" y="217.14" font-size="12" fill="var(--fig-ink, #1C1B19)">舍入误差 ∝ 1/h</text>
<text x="92" y="234.14" font-size="12" fill="var(--fig-muted, #74716A)">（h 越小反而越大）</text>
<text x="586" y="48" font-size="12" fill="var(--fig-muted, #74716A)">x₀ = 0.2，真导数</text>
<text x="586" y="66" font-size="12" fill="var(--fig-ink, #1C1B19)">f′(x₀) = 9.0661</text>
<line x1="586" y1="92" x2="610" y2="92" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.2"/>
<text x="616" y="96" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">前向差分</text>
<text x="586" y="116" font-size="12" fill="var(--fig-blue, #1F5FA8)">(f(x+h) − f(x)) / h</text>
<text x="586" y="136" font-size="12" fill="var(--fig-blue, #1F5FA8)">最好约 6.4×10<tspan baseline-shift="super" font-size="11">-7</tspan></text>
<text x="586" y="154" font-size="12" fill="var(--fig-blue, #1F5FA8)">在 h ≈ 7.9×10<tspan baseline-shift="super" font-size="11">-9</tspan></text>
<line x1="586" y1="186" x2="610" y2="186" stroke="var(--fig-violet, #6733C4)" stroke-width="2.2"/>
<text x="616" y="190" font-size="13" fill="var(--fig-violet, #6733C4)" font-weight="600">中心差分</text>
<text x="586" y="210" font-size="12" fill="var(--fig-violet, #6733C4)">(f(x+h) − f(x−h)) / 2h</text>
<text x="586" y="230" font-size="12" fill="var(--fig-violet, #6733C4)">最好约 2.8×10<tspan baseline-shift="super" font-size="11">-9</tspan></text>
<text x="586" y="248" font-size="12" fill="var(--fig-violet, #6733C4)">在 h ≈ 7.9×10<tspan baseline-shift="super" font-size="11">-7</tspan></text>
<text x="586" y="284" font-size="12" fill="var(--fig-muted, #74716A)">float64 计算；圆点取</text>
<text x="586" y="302" font-size="12" fill="var(--fig-muted, #74716A)">21 个相邻 h 的中位数</text>
<text x="586" y="320" font-size="12" fill="var(--fig-muted, #74716A)">最低处，不取偶然的</text>
<text x="586" y="338" font-size="12" fill="var(--fig-muted, #74716A)">向下尖刺</text>
</svg>
