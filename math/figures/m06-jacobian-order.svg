<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>同一串雅可比，两种乘法顺序：反向模式与前向模式</title>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-ink, #1C1B19)"/></marker></defs>
<circle cx="70" cy="46" r="17" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="70" y="51" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">x</text>
<line x1="89" y1="46" x2="191" y2="46" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="140" y="37" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">J<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<circle cx="210" cy="46" r="17" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="210" y="51" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">h<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<line x1="229" y1="46" x2="331" y2="46" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="280" y="37" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">J<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<circle cx="350" cy="46" r="17" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="350" y="51" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">h<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<line x1="369" y1="46" x2="471" y2="46" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="420" y="37" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">J<tspan baseline-shift="sub" font-size="11">3</tspan></text>
<circle cx="490" cy="46" r="17" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.3"/>
<text x="490" y="51" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">h<tspan baseline-shift="sub" font-size="11">3</tspan></text>
<line x1="509" y1="46" x2="611" y2="46" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.4" marker-end="url(#ah-ink)"/>
<text x="560" y="37" font-size="13" fill="var(--fig-muted, #74716A)" text-anchor="middle">标量损失</text>
<circle cx="630" cy="46" r="17" fill="var(--fig-red, #A3231C)" fill-opacity="0.12" stroke="var(--fig-red, #A3231C)" stroke-width="1.3"/>
<text x="630" y="51" font-size="14" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">𝓛</text>
<text x="70" y="80" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[768]</text>
<text x="210" y="80" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[768]</text>
<text x="350" y="80" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[768]</text>
<text x="490" y="80" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[768]</text>
<text x="630" y="80" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">[1]</text>
<text x="360" y="106" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">(∇<tspan baseline-shift="sub" font-size="11">x</tspan>𝓛)ᵀ = gᵀ J<tspan baseline-shift="sub" font-size="11">3</tspan> J<tspan baseline-shift="sub" font-size="11">2</tspan> J<tspan baseline-shift="sub" font-size="11">1</tspan>，其中 gᵀ = ∂𝓛/∂h<tspan baseline-shift="sub" font-size="11">3</tspan> 是 [1, 768] 的行向量；每个 J 是 [768, 768]</text>
<text x="24" y="136" font-size="13" fill="var(--fig-red, #A3231C)" font-weight="600">反向模式：从左往右乘，中间结果始终是一行（向量–雅可比积）</text>
<rect x="24" y="178.5" width="64" height="7" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" stroke="var(--fig-red, #A3231C)" stroke-width="1"/>
<text x="56" y="172.5" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">gᵀ [1,768]</text>
<text x="95" y="187" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="102" y="150" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="134" y="187" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">3</tspan></text>
<text x="177" y="187" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">→</text>
<rect x="188" y="178.5" width="64" height="7" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" stroke="var(--fig-red, #A3231C)" stroke-width="1"/>
<text x="220" y="172.5" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">[1,768]</text>
<text x="259" y="187" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="266" y="150" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="298" y="187" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<text x="341" y="187" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">→</text>
<rect x="352" y="178.5" width="64" height="7" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" stroke="var(--fig-red, #A3231C)" stroke-width="1"/>
<text x="384" y="172.5" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">[1,768]</text>
<text x="423" y="187" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="430" y="150" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="462" y="187" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="505" y="187" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">→</text>
<rect x="516" y="178.5" width="64" height="7" fill="var(--fig-red, #A3231C)" fill-opacity="0.55" stroke="var(--fig-red, #A3231C)" stroke-width="1"/>
<text x="548" y="172.5" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">(∇<tspan baseline-shift="sub" font-size="11">x</tspan>𝓛)ᵀ [1,768]</text>
<text x="24" y="236" font-size="12" fill="var(--fig-red, #A3231C)">每一步 [1,768]×[768,768]：2·768² = 1.18×10<tspan baseline-shift="super" font-size="11">6</tspan> 次运算；三步合计 3.54×10<tspan baseline-shift="super" font-size="11">6</tspan></text>
<text x="24" y="286" font-size="13" fill="var(--fig-blue, #1F5FA8)" font-weight="600">前向模式：从右往左乘，要搬运整块 [768,768] 的矩阵（雅可比–矩阵积）</text>
<rect x="24" y="300" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="56" y="337" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<text x="95" y="337" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="102" y="300" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="134" y="337" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="177" y="337" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">→</text>
<rect x="188" y="300" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="220" y="337" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">2</tspan>J<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="267" y="337" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">；</text>
<rect x="282" y="300" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="314" y="337" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">3</tspan></text>
<text x="353" y="337" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<rect x="360" y="300" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="392" y="337" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">2</tspan>J<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="435" y="337" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">→</text>
<rect x="446" y="300" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.12" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1.2"/>
<text x="478" y="337" font-size="13" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">J<tspan baseline-shift="sub" font-size="11">3</tspan>J<tspan baseline-shift="sub" font-size="11">2</tspan>J<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="520" y="328" font-size="12" fill="var(--fig-muted, #74716A)">最后才乘</text>
<text x="520" y="346" font-size="12" fill="var(--fig-muted, #74716A)">gᵀ</text>
<text x="24" y="386" font-size="12" fill="var(--fig-blue, #1F5FA8)">每步 [768,768]×[768,768]：2·768³ = 9.06×10<tspan baseline-shift="super" font-size="11">8</tspan> 次运算；合计 1.81×10<tspan baseline-shift="super" font-size="11">9</tspan>，是反向模式的 512 倍</text>
<text x="24" y="438" font-size="12" fill="var(--fig-muted, #74716A)">方块边长按 768 等比例画；行向量的“1”那一边为了看得见画粗了。</text>
<text x="24" y="458" font-size="12" fill="var(--fig-muted, #74716A)">输入换成 1.24 亿个参数时，差距变成“一次反向传播 vs 约 1.24 亿次前向”。</text>
</svg>
