<text x="196.66" y="101" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle">49%</text>
<text x="440.81" y="84" font-size="13" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="700">68.5</text>
<text x="440.81" y="101" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle">27%</text>
<text x="567.54" y="84" font-size="13" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle" font-weight="700">30.7</text>
<text x="567.54" y="101" font-size="12" fill="var(--fig-surface, #FFFFFF)" text-anchor="middle">12%</text>
