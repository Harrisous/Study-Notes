<text x="40" y="252" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">同一刻度下的对比：如果 671B 个参数对每个 token 全部参与计算（嵌入层照旧只查表）</text>
<rect x="40" y="264" width="39.56" height="20" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.85"/>
<text x="87.56" y="279" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">V3 实际：250 GF</text>
<rect x="40" y="292" width="640" height="20" fill="var(--fig-muted, #74716A)" fill-opacity="0.35"/>
<text x="674" y="307" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">全部激活：约 4051 GF（16.2 倍）</text>
