<text x="62" y="140" font-size="12" fill="var(--fig-ink, #1C1B19)">路由专家（每 token 8 个）  122.61 GF（49.0%）</text>
<rect x="370" y="129" width="14" height="14" fill="var(--fig-orange, #B4460C)" fill-opacity="0.85" stroke="var(--fig-orange, #B4460C)" stroke-width="1" rx="2"/>
