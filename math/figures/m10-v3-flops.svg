<rect x="645.93" y="64" width="18.23" height="46" fill="var(--fig-muted, #74716A)" fill-opacity="0.55" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="664.16" y="64" width="14.21" height="46" fill="var(--fig-ink, #1C1B19)" fill-opacity="0.55" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
<rect x="678.37" y="64" width="1.63" height="46" fill="var(--fig-violet, #6733C4)" fill-opacity="0.4" stroke="var(--fig-surface, #FFFFFF)" stroke-width="1"/>
