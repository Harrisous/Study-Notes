<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>DeepSeek-V3 每个训练 token 的运算量拆分</title>

<text x="40" y="30" font-size="14" fill="var(--fig-ink, #1C1B19)" font-weight="600">DeepSeek-V3 每个训练 token：250.45 GFLOPs（前向 83.5 + 反向 167.0）</text>
<text x="40" y="50" font-size="12" fill="var(--fig-muted, #74716A)">矩阵部分 = 6 × 每 token 激活的参数 36.62B；注意力打分按因果掩码、平均上下文 2048 计</text>
