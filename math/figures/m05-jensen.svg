<text x="548" y="64" font-size="12" fill="var(--fig-ink, #1C1B19)">X 等可能取 1 或 4</text>
<text x="548" y="82" font-size="12" fill="var(--fig-ink, #1C1B19)">E[X] = 2.5</text>
<text x="548" y="118" font-size="12" fill="var(--fig-violet, #6733C4)" font-weight="600">弦的中点：函数的平均</text>
<text x="548" y="136" font-size="12" fill="var(--fig-violet, #6733C4)">E[ln X] = 0.693</text>
<text x="548" y="172" font-size="12" fill="var(--fig-blue, #1F5FA8)" font-weight="600">曲线上的点：平均的函数</text>
<text x="548" y="190" font-size="12" fill="var(--fig-blue, #1F5FA8)">ln E[X] = 0.916</text>
<text x="548" y="226" font-size="12" fill="var(--fig-ink, #1C1B19)">ln 是凹函数，弦在曲线下方</text>
<text x="548" y="244" font-size="12" fill="var(--fig-ink, #1C1B19)" font-weight="600">所以 E[ln X] ≤ ln E[X]</text>
<text x="548" y="262" font-size="12" fill="var(--fig-orange, #B4460C)">证明只需要那条切线</text>
