<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>计算图上的前向值（蓝）与伴随 ∂y/∂v（红）</title>
<defs><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker></defs>
<line x1="162" y1="118" x2="250.39" y2="53.18" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="163.4" y="67" width="87.2" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="207" y="79" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1/v₋₁ = 0.5</text>
<line x1="162" y1="118" x2="250.62" y2="210.56" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="181.4" y="145" width="51.2" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="207" y="157" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">v₀ = 5</text>
<line x1="162" y1="318" x2="250.71" y2="213.52" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="177.8" y="269" width="58.4" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="207" y="281" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">v₋₁ = 2</text>
<line x1="162" y1="318" x2="250.29" y2="370.97" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="159.8" y="347" width="94.4" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="207" y="359" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">cos v₀=0.284</text>
<line x1="376" y1="52" x2="424.94" y2="130.3" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="393.4" y="94" width="15.2" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="401" y="106" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<line x1="376" y1="212" x2="424.94" y2="133.7" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="393.4" y="154" width="15.2" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="401" y="166" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<line x1="550" y1="132" x2="579.5" y2="246.06" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="557.4" y="192" width="15.2" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="565" y="204" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">1</text>
<line x1="376" y1="372" x2="578.29" y2="249.04" stroke="var(--fig-muted, #74716A)" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<rect x="466.8" y="292" width="22.4" height="16" fill="var(--fig-surface, #FFFFFF)" rx="3"/>
<text x="478" y="304" font-size="11" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−1</text>
<rect x="38" y="85" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="100" y="106" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">x₁ = v₋₁</text>
<text x="100" y="124" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 2</text>
<text x="100" y="142" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">x̄₁ = 5.5</text>
<rect x="38" y="285" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="100" y="306" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">x₂ = v₀</text>
<text x="100" y="324" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 5</text>
<text x="100" y="342" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">x̄₂ = 1.716</text>
<rect x="252" y="19" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="314" y="40" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">v₁ = ln v₋₁</text>
<text x="314" y="58" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 0.693</text>
<text x="314" y="76" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">v̄₁ = 1</text>
<rect x="252" y="179" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="314" y="200" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">v₂ = v₋₁ × v₀</text>
<text x="314" y="218" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 10</text>
<text x="314" y="236" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">v̄₂ = 1</text>
<rect x="252" y="339" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="314" y="360" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">v₃ = sin v₀</text>
<text x="314" y="378" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= −0.959</text>
<text x="314" y="396" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">v̄₃ = −1</text>
<rect x="426" y="99" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="488" y="120" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">v₄ = v₁ + v₂</text>
<text x="488" y="138" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 10.693</text>
<text x="488" y="156" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">v̄₄ = 1</text>
<rect x="580" y="215" width="124" height="66" fill="var(--fig-surface, #FFFFFF)" stroke="var(--fig-ink, #1C1B19)" stroke-width="1.2" rx="8"/>
<text x="642" y="236" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">y = v₅ = v₄ − v₃</text>
<text x="642" y="254" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 11.652</text>
<text x="642" y="272" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">v̄₅ = 1</text>
<text x="100" y="171" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">5 × 1 + 0.5 × 1 = 5.5</text>
<text x="100" y="188" font-size="11" fill="var(--fig-red, #A3231C)" text-anchor="middle">（两条路径相加）</text>
<text x="100" y="371" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">2 × 1 + 0.284 × (−1)</text>
<text x="100" y="388" font-size="11" fill="var(--fig-red, #A3231C)" text-anchor="middle">= 1.716（两条路径相加）</text>
<text x="452" y="380" font-size="12" fill="var(--fig-blue, #1F5FA8)">蓝：前向值（从左往右算）</text>
<text x="452" y="400" font-size="12" fill="var(--fig-red, #A3231C)">红：伴随 v̄ = ∂y/∂v（从右往左算，</text>
<text x="452" y="418" font-size="12" fill="var(--fig-red, #A3231C)">从 v̄₅ = 1 出发）</text>
<text x="452" y="438" font-size="12" fill="var(--fig-ink, #1C1B19)">箭头上：局部导数 ∂(箭头终点)/∂(起点)</text>
<text x="452" y="458" font-size="12" fill="var(--fig-ink, #1C1B19)">规则：v̄ = Σ 子节点的伴随 × 局部导数</text>
<text x="452" y="478" font-size="12" fill="var(--fig-muted, #74716A)">核对：∂y/∂x₁ = 1/x₁ + x₂ = 5.5，</text>
<text x="452" y="496" font-size="12" fill="var(--fig-muted, #74716A)">∂y/∂x₂ = x₁ − cos x₂ = 1.716</text>
</svg>
