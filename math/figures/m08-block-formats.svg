<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>块格式按位数等比例画出：每行都是 128 个数</title>

<text x="200" y="30" font-size="12" fill="var(--fig-muted, #74716A)">橙色 = 低精度的数本身，紫色 = 缩放因子；长度按位数等比例（每行 128 个数）</text>
<text x="188" y="76" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">DeepSeek-V3 FP8 激活</text>
<text x="188" y="92" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">1×128 一组</text>
<rect x="200" y="64" width="512" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="712" y="64" width="16" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="456" y="58" font-size="11" fill="var(--fig-orange, #B4460C)" text-anchor="middle">128 个 E4M3</text>
<text x="720" y="102" font-size="11" fill="var(--fig-violet, #6733C4)" text-anchor="middle">FP32</text>
<text x="728" y="58" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">平均 8.25 位/个</text>
<text x="188" y="160" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">MXFP4</text>
<text x="188" y="176" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">每 32 个一组</text>
<rect x="200" y="148" width="64" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="264" y="148" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="232" y="142" font-size="11" fill="var(--fig-orange, #B4460C)" text-anchor="middle">32 个 E2M1</text>
<text x="266" y="186" font-size="11" fill="var(--fig-violet, #6733C4)" text-anchor="middle">E8M0</text>
<rect x="268" y="148" width="64" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="332" y="148" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="336" y="148" width="64" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="400" y="148" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="404" y="148" width="64" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="468" y="148" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="472" y="142" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">平均 4.25 位/个</text>
<text x="188" y="244" font-size="13" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">NVFP4 / V4.1 KV</text>
<text x="188" y="260" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">每 16 个一组</text>
<rect x="200" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="232" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="216" y="226" font-size="11" fill="var(--fig-orange, #B4460C)" text-anchor="middle">16 个 E2M1</text>
<text x="234" y="270" font-size="11" fill="var(--fig-violet, #6733C4)" text-anchor="middle">E4M3</text>
<rect x="236" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="268" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="272" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="304" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="308" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="340" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="344" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="376" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="380" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="412" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="416" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="448" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<rect x="452" y="232" width="32" height="22" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="484" y="232" width="4" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="488" y="226" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">平均 4.5 位/个</text>
<rect x="512" y="232" width="16" height="22" fill="var(--fig-violet, #6733C4)" fill-opacity="0.15" stroke="var(--fig-violet, #6733C4)" stroke-width="1" stroke-dasharray="3 2"/>
<text x="536" y="244" font-size="11" fill="var(--fig-violet, #6733C4)">+ 每张量 1 个 FP32</text>
<text x="536" y="259" font-size="11" fill="var(--fig-violet, #6733C4)">（NVFP4 有，V4.1 去掉了）</text>
<text x="16" y="322" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">一个 512 维的 KV 条目（DeepSeek-V4.1 的潜向量）占多少字节</text>
<text x="188" y="354" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">BF16</text>
<rect x="200" y="340" width="481.28" height="20" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.35" stroke="var(--fig-blue, #1F5FA8)" stroke-width="0.8"/>
<text x="689.28" y="354" font-size="12" fill="var(--fig-ink, #1C1B19)">1024 B</text>
<text x="188" y="388" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">FP8</text>
<rect x="200" y="374" width="240.64" height="20" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="440.64" y="374" width="7.52" height="20" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="456.16" y="388" font-size="12" fill="var(--fig-ink, #1C1B19)">512 + 16 = 528 B（E4M3 + 每 32 个 1 个 E8M0）</text>
<text x="188" y="422" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="end" font-weight="600">FP4</text>
<rect x="200" y="408" width="120.32" height="20" fill="var(--fig-orange, #B4460C)" fill-opacity="0.35" stroke="var(--fig-orange, #B4460C)" stroke-width="0.8"/>
<rect x="320.32" y="408" width="15.04" height="20" fill="var(--fig-violet, #6733C4)" fill-opacity="0.55" stroke="var(--fig-violet, #6733C4)" stroke-width="0.8"/>
<text x="343.36" y="422" font-size="12" fill="var(--fig-ink, #1C1B19)">256 + 32 = 288 B（E2M1 + 每 16 个 1 个 E4M3）</text>
<text x="200" y="448" font-size="11" fill="var(--fig-muted, #74716A)">FP4 条目是 BF16 的 1/3.56；本图的字节数按格式计算，与 FlashMLA 文档给出的 V4.1 行格式一致</text>
</svg>
