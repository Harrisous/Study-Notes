<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>softmax 的雅可比 diag(p) − ppᵀ 与交叉熵梯度 p − y（z = (2, 1, 0)，真类别为 0）</title>

<text x="24" y="34" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">① logits 与概率</text>
<text x="24" y="80" font-size="12" fill="var(--fig-muted, #74716A)">z<tspan baseline-shift="sub" font-size="11">0</tspan> = 2</text>
<rect x="82" y="68" width="69.19" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55"/>
<text x="156.19" y="81" font-size="12" fill="var(--fig-blue, #1F5FA8)">p<tspan baseline-shift="sub" font-size="11">0</tspan> = 0.665</text>
<text x="24" y="142" font-size="12" fill="var(--fig-muted, #74716A)">z<tspan baseline-shift="sub" font-size="11">1</tspan> = 1</text>
<rect x="82" y="130" width="25.45" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55"/>
<text x="112.45" y="143" font-size="12" fill="var(--fig-blue, #1F5FA8)">p<tspan baseline-shift="sub" font-size="11">1</tspan> = 0.245</text>
<text x="24" y="204" font-size="12" fill="var(--fig-muted, #74716A)">z<tspan baseline-shift="sub" font-size="11">2</tspan> = 0</text>
<rect x="82" y="192" width="9.36" height="16" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55"/>
<text x="96.36" y="205" font-size="12" fill="var(--fig-blue, #1F5FA8)">p<tspan baseline-shift="sub" font-size="11">2</tspan> = 0.090</text>
<text x="24" y="256" font-size="12" fill="var(--fig-muted, #74716A)">p = softmax(z)，和为 1</text>
<text x="250" y="34" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">② 雅可比 ∂p<tspan baseline-shift="sub" font-size="11">i</tspan>/∂z<tspan baseline-shift="sub" font-size="11">j</tspan> = p<tspan baseline-shift="sub" font-size="11">i</tspan>(δ<tspan baseline-shift="sub" font-size="11">ij</tspan> − p<tspan baseline-shift="sub" font-size="11">j</tspan>)</text>
<text x="283" y="58" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">z<tspan baseline-shift="sub" font-size="11">0</tspan></text>
<text x="349" y="58" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">z<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<text x="415" y="58" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">z<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<text x="242" y="101" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">p<tspan baseline-shift="sub" font-size="11">0</tspan></text>
<rect x="251" y="65" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.58" rx="4"/>
<text x="283" y="102" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.223</text>
<rect x="317" y="65" width="64" height="64" fill="var(--fig-red, #A3231C)" fill-opacity="0.45" rx="4"/>
<text x="349" y="102" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−0.163</text>
<rect x="383" y="65" width="64" height="64" fill="var(--fig-red, #A3231C)" fill-opacity="0.21" rx="4"/>
<text x="415" y="102" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−0.060</text>
<text x="458" y="102" font-size="12" fill="var(--fig-muted, #74716A)">行和 0</text>
<text x="242" y="167" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">p<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<rect x="251" y="131" width="64" height="64" fill="var(--fig-red, #A3231C)" fill-opacity="0.45" rx="4"/>
<text x="283" y="168" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−0.163</text>
<rect x="317" y="131" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.49" rx="4"/>
<text x="349" y="168" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.185</text>
<rect x="383" y="131" width="64" height="64" fill="var(--fig-red, #A3231C)" fill-opacity="0.13" rx="4"/>
<text x="415" y="168" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−0.022</text>
<text x="458" y="168" font-size="12" fill="var(--fig-muted, #74716A)">行和 0</text>
<text x="242" y="233" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="end">p<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<rect x="251" y="197" width="64" height="64" fill="var(--fig-red, #A3231C)" fill-opacity="0.21" rx="4"/>
<text x="283" y="234" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−0.060</text>
<rect x="317" y="197" width="64" height="64" fill="var(--fig-red, #A3231C)" fill-opacity="0.13" rx="4"/>
<text x="349" y="234" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">−0.022</text>
<rect x="383" y="197" width="64" height="64" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.26" rx="4"/>
<text x="415" y="234" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">0.082</text>
<text x="458" y="234" font-size="12" fill="var(--fig-muted, #74716A)">行和 0</text>
<text x="250" y="284" font-size="12" fill="var(--fig-blue, #1F5FA8)">对角（加粗）&gt; 0：自己的 logit ↑，自己的概率 ↑</text>
<text x="250" y="302" font-size="12" fill="var(--fig-red, #A3231C)">非对角 &lt; 0：别人的 logit ↑，自己的概率 ↓</text>
<text x="250" y="320" font-size="12" fill="var(--fig-muted, #74716A)">对称；每行、每列之和都是 0</text>
<text x="548" y="34" font-size="13" fill="var(--fig-ink, #1C1B19)" font-weight="600">③ ∂ℓ/∂z = p − y</text>
<rect x="550" y="160" width="36" height="50.21" fill="var(--fig-red, #A3231C)" fill-opacity="0.55"/>
<text x="568" y="225.21" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">−0.335</text>
<text x="568" y="66" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">类 0</text>
<rect x="600" y="123.29" width="36" height="36.71" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55"/>
<text x="618" y="118.29" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">0.245</text>
<text x="618" y="66" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">类 1</text>
<rect x="650" y="146.5" width="36" height="13.5" fill="var(--fig-blue, #1F5FA8)" fill-opacity="0.55"/>
<text x="668" y="141.5" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">0.090</text>
<text x="668" y="66" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">类 2</text>
<text x="568" y="81" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="middle">（真）</text>
<line x1="548" y1="160" x2="688" y2="160" stroke="var(--fig-ink, #1C1B19)" stroke-width="1"/>
<text x="548" y="256" font-size="12" fill="var(--fig-muted, #74716A)">和为 0；真类别为负，</text>
<text x="548" y="274" font-size="12" fill="var(--fig-muted, #74716A)">其余等于各自的 p</text>
<text x="548" y="292" font-size="12" fill="var(--fig-ink, #1C1B19)">ℓ = −ln p<tspan baseline-shift="sub" font-size="11">0</tspan> = 0.4076 nats</text>
</svg>
