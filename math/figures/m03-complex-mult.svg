<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 372" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>复数是平面上的点；乘以一个复数 = 把长度乘上它的模、把角度加上它的辐角</title>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-blue, #1F5FA8)"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-muted, #74716A)"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-orange, #B4460C)"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fig-violet, #6733C4)"/></marker></defs>
<text x="123.33" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">(a) z = 1 + 2i 是平面上的一个点</text>
<line x1="30" y1="191.3" x2="193.4" y2="191.3" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="79.4" y1="280.6" x2="79.4" y2="64" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="191.4" y="206.3" font-size="11" fill="var(--fig-muted, #74716A)" text-anchor="end">实轴</text>
<text x="84.4" y="74" font-size="11" fill="var(--fig-muted, #74716A)">虚轴</text>
<line x1="41.4" y1="188.3" x2="41.4" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="117.4" y1="188.3" x2="117.4" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="155.4" y1="188.3" x2="155.4" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="193.4" y1="188.3" x2="193.4" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="76.4" y1="267.3" x2="82.4" y2="267.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="76.4" y1="229.3" x2="82.4" y2="229.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="76.4" y1="153.3" x2="82.4" y2="153.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="76.4" y1="115.3" x2="82.4" y2="115.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="76.4" y1="77.3" x2="82.4" y2="77.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="79.4" y1="191.3" x2="117.4" y2="115.3" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<text x="123.4" y="113.3" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" font-weight="600">z = 1 + 2i</text>
<line x1="79.4" y1="191.3" x2="117.4" y2="267.3" stroke="var(--fig-muted, #74716A)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah-muted)"/>
<text x="123.4" y="273.3" font-size="12.5" fill="var(--fig-muted, #74716A)">z̄ = 1 − 2i</text>
<path d="M102.96 191.3 A23.56 23.56 0 0 0 89.94 170.23" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.6"/>
<text x="115.5" y="167.74" font-size="11.5" fill="var(--fig-red, #A3231C)">63.43°</text>
<text x="87.76" y="148.74" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="end">|z| = √5</text>
<line x1="117.4" y1="115.3" x2="117.4" y2="191.3" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.6"/>
<line x1="117.4" y1="115.3" x2="79.4" y2="115.3" stroke="var(--fig-blue, #1F5FA8)" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.6"/>
<text x="123.33" y="318" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">实部 1 = 横坐标，虚部 2 = 纵坐标</text>
<text x="123.33" y="337" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">共轭 z̄：关于实轴的镜像</text>
<text x="370" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">(b) 乘以 i：逆时针转 90°</text>
<line x1="272.67" y1="191.3" x2="437.97" y2="191.3" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="365.77" y1="280.6" x2="365.77" y2="64" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="289.77" y1="188.3" x2="289.77" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="327.77" y1="188.3" x2="327.77" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="403.77" y1="188.3" x2="403.77" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="362.77" y1="267.3" x2="368.77" y2="267.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="362.77" y1="229.3" x2="368.77" y2="229.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="362.77" y1="153.3" x2="368.77" y2="153.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="362.77" y1="115.3" x2="368.77" y2="115.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="362.77" y1="77.3" x2="368.77" y2="77.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="365.77" y1="191.3" x2="403.77" y2="115.3" stroke="var(--fig-muted, #74716A)" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<text x="408.77" y="117.3" font-size="12.5" fill="var(--fig-muted, #74716A)">z</text>
<line x1="365.77" y1="191.3" x2="289.77" y2="153.3" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<text x="287.77" y="145.3" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">iz = −2 + i</text>
<line x1="365.77" y1="191.3" x2="327.77" y2="267.3" stroke="var(--fig-violet, #6733C4)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah-violet)"/>
<text x="323.77" y="281.3" font-size="12.5" fill="var(--fig-violet, #6733C4)" text-anchor="middle">i²z = −z</text>
<path d="M381.06 160.71 A34.2 34.2 0 0 0 335.18 176.01" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.6"/>
<text x="351.35" y="152.04" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">90°</text>
<path d="M344.69 180.76 A23.56 23.56 0 0 0 355.23 212.37" fill="none" stroke="var(--fig-violet, #6733C4)" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="370" y="318" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">i(a + bi) = −b + ai：正是 R(90°)</text>
<text x="370" y="337" font-size="12" fill="var(--fig-violet, #6733C4)" text-anchor="middle">再乘一次 i 共转 180°：i² = −1</text>
<text x="616.67" y="24" font-size="13.5" fill="var(--fig-ink, #1C1B19)" text-anchor="middle" font-weight="600">(c) 乘以 w = 1 + i：拉长 √2 倍、转 45°</text>
<line x1="523.33" y1="191.3" x2="679.13" y2="191.3" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="589.83" y1="280.6" x2="589.83" y2="86.8" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="551.83" y1="188.3" x2="551.83" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="627.83" y1="188.3" x2="627.83" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="665.83" y1="188.3" x2="665.83" y2="194.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="586.83" y1="267.3" x2="592.83" y2="267.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="586.83" y1="229.3" x2="592.83" y2="229.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="586.83" y1="153.3" x2="592.83" y2="153.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="586.83" y1="115.3" x2="592.83" y2="115.3" stroke="var(--fig-muted, #74716A)" stroke-width="1"/>
<line x1="589.83" y1="191.3" x2="627.83" y2="115.3" stroke="var(--fig-muted, #74716A)" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<text x="633.83" y="119.3" font-size="12" fill="var(--fig-muted, #74716A)">z（√5，63.43°）</text>
<line x1="589.83" y1="191.3" x2="627.83" y2="153.3" stroke="var(--fig-orange, #B4460C)" stroke-width="2" marker-end="url(#ah-orange)"/>
<text x="633.83" y="165.3" font-size="12" fill="var(--fig-orange, #B4460C)">w（√2，45°）</text>
<line x1="589.83" y1="191.3" x2="551.83" y2="77.3" stroke="var(--fig-blue, #1F5FA8)" stroke-width="2.4" marker-end="url(#ah-blue)"/>
<text x="559.83" y="69.3" font-size="12.5" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">wz = −1 + 3i</text>
<path d="M607.68 155.61 A39.9 39.9 0 0 0 577.22 153.45" fill="none" stroke="var(--fig-red, #A3231C)" stroke-width="1.6"/>
<text x="593.5" y="143.75" font-size="11.5" fill="var(--fig-red, #A3231C)" text-anchor="middle">+45°</text>
<text x="616.67" y="318" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">|wz| = √10 = √2 × √5</text>
<text x="616.67" y="337" font-size="12" fill="var(--fig-red, #A3231C)" text-anchor="middle">辐角 108.43° = 63.43° + 45°</text>
<line x1="246.67" y1="44" x2="246.67" y2="340" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<line x1="493.33" y1="44" x2="493.33" y2="340" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="370" y="364" font-size="11.5" fill="var(--fig-muted, #74716A)" text-anchor="middle">每个面板的网格刻度间隔 1。蓝色是乘法的结果，红色弧线是辐角增加的量。</text>
</svg>
