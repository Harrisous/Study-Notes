<text x="644" y="154" font-size="12" fill="var(--fig-muted, #74716A)" text-anchor="middle">硬币 2</text>
<text x="644" y="174" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">p = 1/2</text>
<text x="644" y="192" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">h = 1 bit</text>
<text x="602" y="120" font-size="16" fill="var(--fig-muted, #74716A)" text-anchor="middle">×</text>
<line x1="520" y1="208" x2="684" y2="208" stroke="var(--fig-rule, #DCD7CC)" stroke-width="1"/>
<text x="602" y="232" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">两枚都是正面</text>
<text x="602" y="252" font-size="12" fill="var(--fig-ink, #1C1B19)" text-anchor="middle">p = 1/2 × 1/2 = 1/4</text>
<text x="602" y="274" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle" font-weight="600">h = −log₂(1/4) = 2 bits</text>
<text x="602" y="294" font-size="12" fill="var(--fig-blue, #1F5FA8)" text-anchor="middle">= 1 + 1</text>
